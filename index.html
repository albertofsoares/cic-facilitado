<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title-tag">CIC-EAD | Plataforma de Ensino</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #007bff;
            --primary-hover: #0056b3;
            --bg: #ffffff;
            --surface: #f8f9fa;
            --text: #212529;
            --border: #dee2e6;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg: #0b0e14;
            --surface: #161b22;
            --text: #f0f6fc;
            --border: #30363d;
            --shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background 0.3s, color 0.3s; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        code { font-family: 'JetBrains Mono', monospace; background: rgba(0,123,255,0.1); padding: 2px 4px; border-radius: 4px; }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-weight: 700; color: var(--primary); font-size: 1.5rem; cursor: pointer; }

        .nav-tools { display: flex; gap: 1rem; align-items: center; }

        .search-bar {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
        }

        /* Layout */
        .container { display: flex; min-height: calc(100vh - 70px); }

        aside {
            width: 280px;
            padding: 2rem;
            border-right: 1px solid var(--border);
            background: var(--surface);
        }

        main { flex: 1; padding: 2rem 5%; }

        /* UI Elements */
        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { border: 1px solid var(--primary); color: var(--primary); background: transparent; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        /* Categories */
        .cat-item { cursor: pointer; padding: 8px 0; display: block; color: var(--text); text-decoration: none; }
        .cat-item:hover { color: var(--primary); }
        .sub-cat { padding-left: 1.5rem; font-size: 0.9rem; opacity: 0.8; }

        /* Auth Screen */
        #auth-screen {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            text-align: center;
        }

        .auth-card input {
            width: 100%;
            padding: 0.8rem;
            margin: 0.5rem 0;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
        }

        /* Admin Panel */
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            aside { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
            .admin-grid { grid-template-columns: 1fr; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body data-theme="light">

    <section id="auth-screen">
        <div class="card auth-card">
            <h2 id="auth-title">Entrar no CIC-EAD</h2>
            <p style="margin-bottom: 1.5rem; font-size: 0.9rem;">Área Restrita aos Alunos</p>
            <input type="email" id="auth-email" placeholder="E-mail">
            <input type="password" id="auth-pass" placeholder="Senha">
            <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;" onclick="handleAuth()">Confirmar</button>
            <p style="margin-top: 1rem; font-size: 0.8rem; cursor: pointer; color: var(--primary);" onclick="toggleAuthMode()" id="auth-toggle-text">Não tem conta? Registre-se</p>
        </div>
    </section>

    <div id="app-content" class="hidden">
        <nav>
            <div class="logo" onclick="renderPage('home')">
                <i class="fas fa-cube"></i> <span id="site-name-display">CIC-EAD</span>
            </div>
            <div class="nav-tools">
                <input type="text" class="search-bar" placeholder="Buscar conteúdo..." oninput="searchContent(this.value)">
                <button class="btn btn-outline" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
                <button id="admin-btn" class="btn btn-outline hidden" onclick="renderPage('admin')"><i class="fas fa-user-shield"></i></button>
                <button class="btn btn-primary" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </nav>

        <div class="container">
            <aside id="sidebar">
                <h3>Categorias</h3>
                <div id="category-list" style="margin-top: 1rem;">
                    </div>
            </aside>

            <main id="main-view">
                </main>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAHDSu3C39lJPkMtacpHoLNXn3aphXpRvA",
            authDomain: "cic-ead.firebaseapp.com",
            projectId: "cic-ead",
            storageBucket: "cic-ead.firebasestorage.app",
            messagingSenderId: "224684609703",
            appId: "1:224684609703:web:52fce7f22501300a2b0b82"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- BANCO DE DADOS LOCAL (Simulação de Persistência) ---
        let db = JSON.parse(localStorage.getItem('cic_db')) || {
            config: { name: "CIC-EAD", theme: "light" },
            categories: [
                { id: 1, name: "Sistema Operacional", subs: ["Unidade 1", "Unidade 2"] },
                { id: 2, name: "Programação Web", subs: ["HTML/CSS", "JavaScript"] }
            ],
            posts: [
                { id: 1, cat: "Unidade 1", title: "Introdução ao Kernel", body: "O *Kernel* é o coração do sistema." }
            ],
            quizzes: [
                { id: 1, question: "O que é o Kernel?", options: ["Um Hardware", "Núcleo do SO", "Um App", "Um Driver"], correct: 1 }
            ]
        };

        function saveDB() {
            localStorage.setItem('cic_db', JSON.stringify(db));
            refreshUI();
        }

        // --- SISTEMA DE ROTEAMENTO ---
        window.renderPage = (page, param = null) => {
            const main = document.getElementById('main-view');
            
            if (page === 'home') {
                main.innerHTML = `<h1>Bem-vindo ao ${db.config.name}</h1><p>Selecione uma categoria ao lado para começar.</p>`;
            } 
            
            else if (page === 'post') {
                const post = db.posts.find(p => p.cat === param);
                main.innerHTML = post ? `
                    <h1>${post.title}</h1>
                    <div class="card">${formatText(post.body)}</div>
                ` : `<h1>Sem conteúdo</h1><p>Esta unidade ainda não possui posts.</p>`;
            }

            else if (page === 'quiz') {
                main.innerHTML = `<h1>Desafio Quiz</h1>` + db.quizzes.map(q => `
                    <div class="card">
                        <p><strong>${q.question}</strong></p>
                        ${q.options.map((opt, i) => `<button class="btn btn-outline" style="margin:5px" onclick="checkQuiz(${i}, ${q.correct})">${opt}</button>`).join('')}
                    </div>
                `).join('');
            }

            else if (page === 'admin') {
                main.innerHTML = `
                    <h1>Painel Administrativo</h1>
                    <div class="admin-grid">
                        <div class="card">
                            <h3>Configurações Gerais</h3>
                            <input type="text" id="edit-site-name" class="search-bar" style="width:100%" value="${db.config.name}">
                            <button class="btn btn-primary" onclick="updateConfig()" style="margin-top:10px">Salvar Nome</button>
                        </div>
                        <div class="card">
                            <h3>Novo Post</h3>
                            <input type="text" id="post-title" class="search-bar" placeholder="Título" style="width:100%">
                            <select id="post-cat" class="search-bar" style="width:100%; margin:10px 0;">
                                ${db.categories.flatMap(c => c.subs).map(s => `<option>${s}</option>`)}
                            </select>
                            <textarea id="post-body" class="search-bar" style="width:100%; height:100px" placeholder="Texto (*negrito* _italico_ ^codigo^)"></textarea>
                            <button class="btn btn-primary" onclick="addPost()">Publicar</button>
                        </div>
                    </div>
                `;
            }
        };

        // --- LÓGICA DE AUTH ---
        let isLogin = true;
        window.toggleAuthMode = () => {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "Entrar no CIC-EAD" : "Criar Nova Conta";
            document.getElementById('auth-toggle-text').innerText = isLogin ? "Não tem conta? Registre-se" : "Já tem conta? Faça Login";
        };

        window.handleAuth = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            try {
                if (isLogin) await signInWithEmailAndPassword(auth, email, pass);
                else await createUserWithEmailAndPassword(auth, email, pass);
            } catch (e) { alert("Erro na autenticação: " + e.message); }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                if (user.email.endsWith('@admin.com')) {
                    document.getElementById('admin-btn').classList.remove('hidden');
                }
                refreshUI();
                renderPage('home');
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-content').classList.add('hidden');
            }
        });

        // --- UTILITÁRIOS ---
        function formatText(text) {
            return text
                .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
                .replace(/_(.*?)_/g, '<em>$1</em>')
                .replace(/\^(.*?)\^/g, '<code>$1</code>');
        }

        window.toggleTheme = () => {
            const body = document.body;
            const theme = body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', theme);
        };

        function refreshUI() {
            document.getElementById('site-name-display').innerText = db.config.name;
            document.getElementById('site-title-tag').innerText = db.config.name;
            
            const catList = document.getElementById('category-list');
            catList.innerHTML = db.categories.map(c => `
                <div class="cat-group">
                    <strong>${c.name}</strong>
                    ${c.subs.map(s => `<a class="cat-item sub-cat" onclick="renderPage('post', '${s}')">${s}</a>`).join('')}
                </div>
            `).join('') + `<hr><a class="cat-item" onclick="renderPage('quiz')"><strong><i class="fas fa-tasks"></i> Quizzes</strong></a>`;
        }

        // Funções Globais para o Admin
        window.updateConfig = () => {
            db.config.name = document.getElementById('edit-site-name').value;
            saveDB();
        };

        window.addPost = () => {
            const title = document.getElementById('post-title').value;
            const cat = document.getElementById('post-cat').value;
            const body = document.getElementById('post-body').value;
            db.posts.push({ id: Date.now(), title, cat, body });
            saveDB();
            alert("Post adicionado!");
        };

        window.checkQuiz = (selected, correct) => {
            if (selected === correct) alert("Correto! Parabéns.");
            else alert("Resposta errada. Tente novamente!");
        };

        window.searchContent = (term) => {
            if (!term) return;
            const results = db.posts.filter(p => p.title.toLowerCase().includes(term.toLowerCase()));
            if(results.length > 0) renderPage('post', results[0].cat);
        };

    </script>
</body>
</html>
