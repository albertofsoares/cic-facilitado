<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Tech SPA Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js" type="module"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap');
        
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .code-font { font-family: 'JetBrains Mono', monospace; }
        
        .dark {
            background-color: #0f172a;
            color: #f1f5f9;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dark .glass {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .active-nav {
            border-bottom: 2px solid var(--primary);
            color: var(--primary);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Configuração Firebase ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tech-spa-001';

        // --- Estado Global Único ---
        const State = {
            user: null,
            isAdmin: false,
            currentView: 'loading', // auth, dashboard, admin, loading
            theme: localStorage.getItem('theme') || 'light',
            data: {
                categories: [],
                posts: [],
                quizzes: []
            },
            ui: {
                editingPost: null,
                editingCategory: null,
                editingQuiz: null,
                isModalOpen: false
            }
        };

        // --- Utilitários de Renderização ---
        function render() {
            const root = document.getElementById('app');
            if (!root) return;

            // Apply Theme
            document.documentElement.classList.toggle('dark', State.theme === 'dark');

            if (State.currentView === 'loading') {
                root.innerHTML = renderLoading();
            } else if (!State.user) {
                root.innerHTML = renderAuth();
            } else {
                root.innerHTML = `
                    <div class="min-h-screen flex flex-col">
                        ${renderNavbar()}
                        <main class="flex-grow container mx-auto px-4 py-8">
                            ${State.currentView === 'admin' ? renderAdminView() : renderDashboardView()}
                        </main>
                        ${renderFooter()}
                    </div>
                    ${State.ui.isModalOpen ? renderModal() : ''}
                `;
            }
            attachEvents();
        }

        // --- Parsers de Conteúdo ---
        function parseContent(text) {
            if (!text) return '';
            return text
                .replace(/\*(.*?)\*/g, '<strong class="font-bold">$1</strong>')
                .replace(/_(.*?)_/g, '<em class="italic">$1</em>')
                .replace(/\^(.*?)\^/g, '<code class="code-font bg-blue-100 dark:bg-blue-900 px-1 rounded text-blue-600 dark:text-blue-300">$1</code>')
                .replace(/\n/g, '<br>');
        }

        // --- Componentes de UI ---
        const renderLoading = () => `
            <div class="h-screen flex items-center justify-center bg-slate-900">
                <div class="text-blue-500 animate-pulse text-2xl font-bold tracking-tighter">
                    <span class="text-white">TECH</span>SPA_
                </div>
            </div>
        `;

        const renderNavbar = () => `
            <nav class="sticky top-0 z-40 w-full glass border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex justify-between items-center">
                <div class="flex items-center gap-8">
                    <div class="text-2xl font-bold text-blue-600 cursor-pointer" onclick="setView('dashboard')">
                        <span class="dark:text-white text-slate-900">HIGH</span>TECH
                    </div>
                    <div class="hidden md:flex gap-6 text-sm font-medium uppercase tracking-widest">
                        <button onclick="setView('dashboard')" class="${State.currentView === 'dashboard' ? 'text-blue-500' : 'hover:text-blue-500'}">Feed</button>
                        ${State.isAdmin ? `<button onclick="setView('admin')" class="${State.currentView === 'admin' ? 'text-blue-500' : 'hover:text-blue-500'}">Admin Panel</button>` : ''}
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800">
                        ${State.theme === 'light' ? '🌙' : '☀️'}
                    </button>
                    <div class="flex items-center gap-2">
                        <span class="text-xs opacity-60 hidden sm:block">${State.user.email || 'Usuário'}</span>
                        <button onclick="handleLogout()" class="text-xs font-bold text-red-500 border border-red-500 px-3 py-1 rounded hover:bg-red-500 hover:text-white transition">SAIR</button>
                    </div>
                </div>
            </nav>
        `;

        const renderAuth = () => `
            <div class="h-screen flex flex-col items-center justify-center bg-slate-100 dark:bg-slate-950 p-6">
                <div class="max-w-md w-full glass p-8 rounded-2xl shadow-2xl border border-white/20">
                    <h1 class="text-3xl font-black mb-2 text-blue-600">IDENTIDADE_</h1>
                    <p class="text-slate-500 mb-8 text-sm">Acesse a plataforma para visualizar conteúdos e quizzes.</p>
                    <form id="loginForm" class="space-y-4">
                        <input type="email" id="email" placeholder="Email" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition">
                        <input type="password" id="password" placeholder="Senha" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition">
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg shadow-blue-500/30 transition-all">ENTRAR</button>
                    </form>
                    <p class="mt-4 text-[10px] opacity-40 uppercase text-center">Acesso Admin: use email @admin.com</p>
                </div>
            </div>
        `;

        const renderDashboardView = () => `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <aside class="lg:col-span-3 space-y-6">
                    <div class="glass p-6 rounded-xl">
                        <h3 class="font-bold mb-4 border-b border-blue-500 pb-2">CATEGORIAS</h3>
                        <ul class="space-y-2">
                            ${State.data.categories.length ? State.data.categories.map(cat => `
                                <li class="text-sm">
                                    <span class="font-semibold text-blue-500">${cat.name}</span>
                                    <ul class="ml-4 mt-1 border-l border-slate-300 dark:border-slate-700 pl-2 opacity-70">
                                        ${cat.subs ? cat.subs.split(',').map(s => `<li>${s.trim()}</li>`).join('') : ''}
                                    </ul>
                                </li>
                            `).join('') : '<li class="opacity-50 italic">Nenhuma categoria</li>'}
                        </ul>
                    </div>
                </aside>
                
                <section class="lg:col-span-6 space-y-6">
                    ${State.data.posts.map(post => `
                        <article class="glass p-8 rounded-2xl shadow-sm border-l-4 border-blue-600">
                            <div class="flex justify-between items-start mb-4">
                                <span class="text-[10px] font-bold px-2 py-1 bg-blue-100 dark:bg-blue-900/40 text-blue-600 rounded uppercase tracking-tighter">${post.category || 'Geral'}</span>
                                <span class="text-[10px] opacity-40 italic">${new Date(post.createdAt).toLocaleDateString()}</span>
                            </div>
                            <h2 class="text-xl font-bold mb-4">${post.title}</h2>
                            <div class="prose prose-slate dark:prose-invert max-w-none text-slate-600 dark:text-slate-300">
                                ${parseContent(post.content)}
                            </div>
                        </article>
                    `).join('')}
                    ${State.data.posts.length === 0 ? '<div class="p-12 text-center opacity-40 italic">O feed está vazio...</div>' : ''}
                </section>

                <aside class="lg:col-span-3 space-y-6">
                    <div class="glass p-6 rounded-xl border-t-4 border-emerald-500">
                        <h3 class="font-bold mb-4 flex items-center gap-2">
                            <span>QUIZZES DISPONÍVEIS</span>
                            <span class="bg-emerald-100 text-emerald-700 text-[10px] px-2 py-0.5 rounded-full">${State.data.quizzes.length}</span>
                        </h3>
                        <div class="space-y-4">
                            ${State.data.quizzes.map(quiz => `
                                <div class="p-4 bg-white/5 rounded-lg border border-slate-200 dark:border-slate-800 hover:border-emerald-500 transition group cursor-pointer">
                                    <p class="font-semibold text-sm group-hover:text-emerald-500">${quiz.title}</p>
                                    <p class="text-[10px] opacity-50 uppercase">${quiz.questions?.length || 0} Questões</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </aside>
            </div>
        `;

        const renderAdminView = () => `
            <div class="animate-in fade-in slide-in-from-bottom-4 duration-500">
                <header class="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-4">
                    <div>
                        <h1 class="text-4xl font-black text-slate-900 dark:text-white">CONTROLE_TOTAL</h1>
                        <p class="text-blue-500 font-mono text-sm">Privilégios de Administrador Ativos</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openModal('post')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold">+ NOVO POST</button>
                        <button onclick="openModal('category')" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold">+ CATEGORIA</button>
                        <button onclick="openModal('quiz')" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold">+ NOVO QUIZ</button>
                    </div>
                </header>

                <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
                    <!-- Gerenciar Posts -->
                    <div class="glass p-6 rounded-2xl overflow-hidden">
                        <h2 class="text-lg font-bold mb-6 flex items-center gap-2">POSTS_ <span class="text-xs opacity-50 font-normal">Sincronizado em tempo real</span></h2>
                        <div class="space-y-3 max-h-[500px] overflow-y-auto pr-2">
                            ${State.data.posts.map(p => `
                                <div class="flex items-center justify-between p-4 bg-white dark:bg-slate-900/50 rounded-xl border border-slate-200 dark:border-slate-800">
                                    <div class="truncate">
                                        <p class="font-bold truncate">${p.title}</p>
                                        <p class="text-[10px] opacity-50 uppercase">${p.category}</p>
                                    </div>
                                    <div class="flex gap-2">
                                        <button onclick="editItem('post', '${p.id}')" class="p-2 hover:bg-blue-100 dark:hover:bg-blue-900 rounded-lg text-blue-500">✎</button>
                                        <button onclick="deleteItem('posts', '${p.id}')" class="p-2 hover:bg-red-100 dark:hover:bg-red-900 rounded-lg text-red-500">🗑</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Gerenciar Categorias -->
                    <div class="glass p-6 rounded-2xl">
                        <h2 class="text-lg font-bold mb-6">CATEGORIAS_ANINHADAS</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${State.data.categories.map(c => `
                                <div class="p-4 bg-slate-100 dark:bg-slate-800/50 rounded-xl">
                                    <div class="flex justify-between items-start mb-2">
                                        <span class="font-bold text-blue-500">${c.name}</span>
                                        <div class="flex gap-1">
                                            <button onclick="editItem('category', '${c.id}')" class="text-xs opacity-50 hover:opacity-100">EDIT</button>
                                            <button onclick="deleteItem('categories', '${c.id}')" class="text-xs text-red-500 opacity-50 hover:opacity-100">DEL</button>
                                        </div>
                                    </div>
                                    <div class="text-[10px] opacity-70">
                                        ${c.subs ? c.subs.split(',').map(s => `<span class="inline-block bg-white dark:bg-slate-900 px-1.5 py-0.5 rounded m-0.5">${s.trim()}</span>`).join('') : 'Sem subcategorias'}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                     <!-- Gerenciar Quizzes -->
                     <div class="xl:col-span-2 glass p-6 rounded-2xl">
                        <h2 class="text-lg font-bold mb-6">GERENCIADOR_DE_QUIZZES</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${State.data.quizzes.map(q => `
                                <div class="border border-slate-200 dark:border-slate-800 p-5 rounded-xl flex flex-col justify-between">
                                    <div>
                                        <p class="font-bold text-lg">${q.title}</p>
                                        <p class="text-sm opacity-60 mb-4">${q.questions?.length || 0} Questões cadastradas</p>
                                    </div>
                                    <div class="flex gap-3">
                                        <button onclick="editItem('quiz', '${q.id}')" class="flex-grow py-2 bg-blue-500/10 text-blue-500 rounded font-bold text-xs">EDITAR</button>
                                        <button onclick="deleteItem('quizzes', '${q.id}')" class="p-2 text-red-500 hover:bg-red-500/10 rounded">🗑</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            </div>
        `;

        const renderModal = () => {
            const { editingPost, editingCategory, editingQuiz } = State.ui;
            let title = "ADICIONAR ITEM";
            let content = "";

            if (State.ui.modalType === 'post') {
                title = editingPost ? "EDITAR POST" : "CRIAR NOVO POST";
                content = `
                    <input type="text" id="postTitle" value="${editingPost?.title || ''}" placeholder="Título do Post" class="w-full bg-slate-100 dark:bg-slate-800 p-3 rounded mb-4">
                    <select id="postCategory" class="w-full bg-slate-100 dark:bg-slate-800 p-3 rounded mb-4">
                        <option value="Geral">Geral</option>
                        ${State.data.categories.map(c => `<option value="${c.name}" ${editingPost?.category === c.name ? 'selected' : ''}>${c.name}</option>`)}
                    </select>
                    <textarea id="postContent" placeholder="Conteúdo (use *bold*, _italic_, ^code^)" class="w-full bg-slate-100 dark:bg-slate-800 p-3 rounded h-64 mb-4 font-mono text-sm">${editingPost?.content || ''}</textarea>
                    <button onclick="savePost()" class="w-full bg-blue-600 text-white font-bold py-3 rounded">SALVAR POST</button>
                `;
            } else if (State.ui.modalType === 'category') {
                title = editingCategory ? "EDITAR CATEGORIA" : "CRIAR CATEGORIA";
                content = `
                    <input type="text" id="catName" value="${editingCategory?.name || ''}" placeholder="Nome da Categoria" class="w-full bg-slate-100 dark:bg-slate-800 p-3 rounded mb-4">
                    <input type="text" id="catSubs" value="${editingCategory?.subs || ''}" placeholder="Subcategorias (separadas por vírgula)" class="w-full bg-slate-100 dark:bg-slate-800 p-3 rounded mb-4">
                    <button onclick="saveCategory()" class="w-full bg-slate-800 text-white font-bold py-3 rounded">SALVAR CATEGORIA</button>
                `;
            } else if (State.ui.modalType === 'quiz') {
                title = editingQuiz ? "EDITAR QUIZ" : "CRIAR QUIZ";
                // Simplificado para exemplo: JSON editor para o array de objetos
                const quizJson = editingQuiz ? JSON.stringify(editingQuiz.questions, null, 2) : '[]';
                content = `
                    <input type="text" id="quizTitle" value="${editingQuiz?.title || ''}" placeholder="Título do Quiz" class="w-full bg-slate-100 dark:bg-slate-800 p-3 rounded mb-4">
                    <label class="text-[10px] uppercase opacity-50 mb-1 block">Questões (Formato JSON Array de Objetos)</label>
                    <textarea id="quizQuestions" class="w-full bg-slate-100 dark:bg-slate-800 p-3 rounded h-64 mb-4 font-mono text-xs">${quizJson}</textarea>
                    <p class="text-[9px] mb-4 opacity-50 italic">Ex: [{"q": "Cor do céu?", "a": ["Azul", "Roxo"], "c": 0}]</p>
                    <button onclick="saveQuiz()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded">SALVAR QUIZ</button>
                `;
            }

            return `
                <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                    <div class="bg-white dark:bg-slate-900 w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl border border-white/10">
                        <div class="flex justify-between items-center p-6 border-b border-slate-200 dark:border-slate-800">
                            <h3 class="font-black text-xl">${title}</h3>
                            <button onclick="closeModal()" class="text-2xl opacity-50 hover:opacity-100">&times;</button>
                        </div>
                        <div class="p-6">
                            ${content}
                        </div>
                    </div>
                </div>
            `;
        };

        const renderFooter = () => `
            <footer class="p-8 border-t border-slate-200 dark:border-slate-800 opacity-40 text-[10px] text-center uppercase tracking-[4px]">
                High-Tech SPA Engine &copy; 2024 • Build v2.4.0
            </footer>
        `;

        // --- Logica de Negócio & Firestore ---

        window.setView = (view) => {
            if (view === 'admin' && !State.isAdmin) return;
            State.currentView = view;
            render();
        };

        window.toggleTheme = () => {
            State.theme = State.theme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', State.theme);
            render();
        };

        window.handleLogout = () => {
            signOut(auth);
        };

        window.openModal = (type) => {
            State.ui.modalType = type;
            State.ui.isModalOpen = true;
            render();
        };

        window.closeModal = () => {
            State.ui.isModalOpen = false;
            State.ui.editingPost = null;
            State.ui.editingCategory = null;
            State.ui.editingQuiz = null;
            render();
        };

        window.editItem = (type, id) => {
            if (type === 'post') State.ui.editingPost = State.data.posts.find(p => p.id === id);
            if (type === 'category') State.ui.editingCategory = State.data.categories.find(c => c.id === id);
            if (type === 'quiz') State.ui.editingQuiz = State.data.quizzes.find(q => q.id === id);
            openModal(type);
        };

        // --- Operações CRUD (Firestore RULE 1 Compliance) ---
        
        const getCollPath = (name) => collection(db, 'artifacts', appId, 'public', 'data', name);

        window.savePost = async () => {
            const post = {
                title: document.getElementById('postTitle').value,
                category: document.getElementById('postCategory').value,
                content: document.getElementById('postContent').value,
                createdAt: State.ui.editingPost?.createdAt || Date.now(),
                updatedAt: Date.now()
            };

            try {
                if (State.ui.editingPost) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'posts', State.ui.editingPost.id), post);
                } else {
                    await addDoc(getCollPath('posts'), post);
                }
                closeModal();
            } catch (e) { console.error(e); }
        };

        window.saveCategory = async () => {
            const cat = {
                name: document.getElementById('catName').value,
                subs: document.getElementById('catSubs').value
            };
            try {
                if (State.ui.editingCategory) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'categories', State.ui.editingCategory.id), cat);
                } else {
                    await addDoc(getCollPath('categories'), cat);
                }
                closeModal();
            } catch (e) { console.error(e); }
        };

        window.saveQuiz = async () => {
            try {
                const quiz = {
                    title: document.getElementById('quizTitle').value,
                    questions: JSON.parse(document.getElementById('quizQuestions').value)
                };
                if (State.ui.editingQuiz) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'quizzes', State.ui.editingQuiz.id), quiz);
                } else {
                    await addDoc(getCollPath('quizzes'), quiz);
                }
                closeModal();
            } catch (e) { 
                alert("Erro no JSON das questões. Verifique o formato.");
                console.error(e); 
            }
        };

        window.deleteItem = async (coll, id) => {
            if (confirm("Deseja realmente excluir este item?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', coll, id));
            }
        };

        // --- Inicialização e Sincronização ---
        
        async function attachEvents() {
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.onsubmit = async (e) => {
                    e.preventDefault();
                    // Simulação para este ambiente: Auth Real requer configuração completa
                    // No sistema real, usar signInWithEmailAndPassword. 
                    // Aqui usaremos o mecanismo anônimo ou token injetado se disponível.
                    const email = document.getElementById('email').value;
                    try {
                        // Forçamos a auth anônima para persistir, mas checamos privilégio pelo email inputado
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                        // Salvamos o email na sessão para controle de UI
                        localStorage.setItem('auth_email', email);
                        State.isAdmin = email.endsWith('@admin.com');
                        render();
                    } catch (err) { console.error(err); }
                };
            }
        }

        function initSync() {
            if (!State.user) return;

            // Sincronizar Posts
            onSnapshot(getCollPath('posts'), (snap) => {
                State.data.posts = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => b.createdAt - a.createdAt);
                render();
            }, (err) => console.log(err));

            // Sincronizar Categorias
            onSnapshot(getCollPath('categories'), (snap) => {
                State.data.categories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            }, (err) => console.log(err));

            // Sincronizar Quizzes
            onSnapshot(getCollPath('quizzes'), (snap) => {
                State.data.quizzes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            }, (err) => console.log(err));
        }

        onAuthStateChanged(auth, (user) => {
            State.user = user;
            if (user) {
                const storedEmail = localStorage.getItem('auth_email') || '';
                State.isAdmin = storedEmail.endsWith('@admin.com');
                State.currentView = 'dashboard';
                initSync();
            } else {
                State.currentView = 'auth';
                State.isAdmin = false;
            }
            render();
        });

        // Start
        render();
    </script>
</body>
</html>
