<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Acadêmico | TechView</title>
    
    <!-- Tailwind CSS (Estilo) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts (Inter & JetBrains Mono) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        tech: {
                            blue: '#004a8e',     // Azul Institucional
                            accent: '#00d4ff',   // Azul High Tech
                            orange: '#f26522',   // Laranja Ação
                            dark: '#0f172a',     // Fundo Dark
                            surface: '#1e293b'   // Superfície Dark
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards'
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <style>
        /* Glassmorphism & Utilities */
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .dark .glass { background: rgba(15, 23, 42, 0.85); border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        /* Scrollbar Personalizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        
        /* Formatador de Texto Customizado */
        .fmt-bold { font-weight: 700; color: inherit; }
        .fmt-italic { font-style: italic; color: inherit; }
        .fmt-code { 
            background: #e2e8f0; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.9em; 
            color: #d63384; 
        }
        .dark .fmt-code { background: #334155; color: #f472b6; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- ==================== TELA DE LOGIN (BLOQUEIO) ==================== -->
    <div id="auth-screen" class="fixed inset-0 z-[100] bg-slate-100 dark:bg-slate-900 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-3xl shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-700 animate-slide-up">
            <div class="h-2 bg-gradient-to-r from-tech-blue to-tech-accent"></div>
            <div class="p-8">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-tech-blue rounded-2xl mx-auto flex items-center justify-center text-white text-2xl mb-4 shadow-lg shadow-blue-500/30">
                        <i class="fas fa-network-wired"></i>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight">Portal Acadêmico</h1>
                    <p class="text-slate-500 text-sm mt-2">Ciência da Computação</p>
                </div>

                <!-- Toggle Login/Register -->
                <div class="flex p-1 bg-slate-100 dark:bg-slate-700 rounded-xl mb-6">
                    <button onclick="app.auth.toggleMode('login')" id="btn-mode-login" class="flex-1 py-2 rounded-lg text-sm font-bold shadow-sm bg-white dark:bg-slate-600 transition-all">Login</button>
                    <button onclick="app.auth.toggleMode('register')" id="btn-mode-register" class="flex-1 py-2 rounded-lg text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-700 transition-all">Registrar</button>
                </div>

                <!-- Forms -->
                <div id="auth-forms" class="space-y-4">
                    <input type="email" id="auth-email" placeholder="E-mail Acadêmico (@anhanguera.com)" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-tech-blue outline-none transition">
                    <input type="password" id="auth-pass" placeholder="Senha" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-tech-blue outline-none transition">
                    
                    <button id="btn-auth-action" onclick="app.auth.submit()" class="w-full py-3.5 bg-tech-blue hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg shadow-blue-600/20 transition-all transform active:scale-95">
                        <i class="fas fa-sign-in-alt mr-2"></i> Acessar Portal
                    </button>
                </div>
                <p id="auth-msg" class="text-center text-sm text-red-500 mt-4 h-5"></p>
            </div>
        </div>
    </div>

    <!-- ==================== APP PRINCIPAL (CONTEÚDO) ==================== -->
    <div id="main-app" class="hidden flex-col min-h-screen">
        
        <!-- Navbar -->
        <nav class="sticky top-0 z-50 glass">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <!-- Logo & Brand -->
                    <div class="flex items-center gap-3 cursor-pointer" onclick="app.router.go('home')">
                        <div class="w-8 h-8 bg-tech-blue rounded-lg flex items-center justify-center text-white text-sm">
                            <i class="fas fa-code"></i>
                        </div>
                        <span id="nav-site-name" class="font-bold text-lg tracking-tight hidden sm:block">CC <span class="text-tech-blue">Portal</span></span>
                    </div>

                    <!-- Search Bar -->
                    <div class="flex-1 max-w-lg mx-4 hidden md:block">
                        <div class="relative group">
                            <input type="text" onkeyup="app.func.search(this.value)" placeholder="Pesquisar disciplinas, posts ou quizzes..." 
                                class="w-full bg-slate-100 dark:bg-slate-800/50 border-none rounded-full py-2 pl-10 pr-4 text-sm focus:ring-2 focus:ring-tech-blue transition-all">
                            <i class="fas fa-search absolute left-3.5 top-2.5 text-slate-400 group-focus-within:text-tech-blue transition-colors"></i>
                        </div>
                    </div>

                    <!-- User Actions -->
                    <div class="flex items-center gap-3">
                        <button onclick="app.ui.toggleTheme()" class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                            <i id="theme-icon" class="fas fa-moon"></i>
                        </button>
                        
                        <!-- Admin Link (Hidden by default) -->
                        <button id="nav-admin-link" onclick="app.router.go('admin')" class="hidden px-3 py-1.5 text-xs font-bold text-tech-orange bg-orange-100 dark:bg-orange-900/20 rounded-lg border border-orange-200 dark:border-orange-800 hover:bg-orange-200 transition">
                            ADMIN PAINEL
                        </button>

                        <div class="h-6 w-px bg-slate-200 dark:bg-slate-700 mx-1"></div>
                        
                        <button onclick="app.auth.logout()" class="text-slate-500 hover:text-red-500 transition text-sm font-medium">
                            Sair <i class="fas fa-sign-out-alt ml-1"></i>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main View Container -->
        <main id="router-outlet" class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 py-8">
            <!-- Dynamic Content Injected Here -->
        </main>

    </div>

    <!-- ==================== JAVASCRIPT LOGIC ==================== -->
    <script type="module">
        // --- 1. CONFIGURAÇÃO FIREBASE ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, addDoc, onSnapshot, query, orderBy, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuração fornecida pelo usuário
        const firebaseConfig = {
            apiKey: "AIzaSyAHDSu3C39lJPkMtacpHoLNXn3aphXpRvA",
            authDomain: "cic-ead.firebaseapp.com",
            projectId: "cic-ead",
            storageBucket: "cic-ead.firebasestorage.app",
            messagingSenderId: "224684609703",
            appId: "1:224684609703:web:52fce7f22501300a2b0b82"
        };

        const fApp = initializeApp(firebaseConfig);
        const auth = getAuth(fApp);
        const db = getFirestore(fApp);

        // ID do App para separar dados no Firestore (Multitenancy simulado)
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'portal-cc-default';

        // --- 2. OBJETO GLOBAL DA APLICAÇÃO (STATE MANAGEMENT) ---
        const app = {
            state: {
                user: null,
                isAdmin: false,
                config: { siteName: "Portal CC", welcomeMsg: "Bem-vindo ao Ambiente de Estudos" },
                categories: [],
                posts: [],
                quizzes: [],
                currentView: 'home',
                authMode: 'login' // ou 'register'
            },

            // --- INICIALIZAÇÃO ---
            init: async () => {
                // Tenta logar com token da IDE se disponível (para desenvolvimento)
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try { await signInWithCustomToken(auth, __initial_auth_token); } catch(e) { console.log("Dev auth skipped"); }
                }

                // Listener de Autenticação Global
                onAuthStateChanged(auth, (user) => {
                    app.state.user = user;
                    
                    if (user) {
                        // VERIFICAÇÃO DE ADMIN (Segurança por Obscuridade no Front, mas funcional)
                        app.state.isAdmin = user.email && user.email.includes('@admin.com');
                        
                        // Esconde tela de login, mostra App
                        document.getElementById('auth-screen').classList.add('hidden');
                        document.getElementById('main-app').classList.remove('hidden');
                        document.getElementById('main-app').classList.add('flex');
                        
                        // Se for admin, mostra botão
                        if(app.state.isAdmin) document.getElementById('nav-admin-link').classList.remove('hidden');
                        
                        // Carrega dados e inicia roteador
                        app.data.subscribe();
                        app.router.go('home');
                    } else {
                        // Mostra tela de login, esconde App
                        document.getElementById('auth-screen').classList.remove('hidden');
                        document.getElementById('main-app').classList.add('hidden');
                        document.getElementById('main-app').classList.remove('flex');
                        app.state.isAdmin = false;
                    }
                });
            },

            // --- AUTENTICAÇÃO E PERMISSÕES ---
            auth: {
                toggleMode: (mode) => {
                    app.state.authMode = mode;
                    const btnLogin = document.getElementById('btn-mode-login');
                    const btnReg = document.getElementById('btn-mode-register');
                    const btnAction = document.getElementById('btn-auth-action');
                    
                    if(mode === 'login') {
                        btnLogin.className = "flex-1 py-2 rounded-lg text-sm font-bold shadow-sm bg-white dark:bg-slate-600 transition-all";
                        btnReg.className = "flex-1 py-2 rounded-lg text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-700 transition-all";
                        btnAction.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> Acessar Portal';
                    } else {
                        btnReg.className = "flex-1 py-2 rounded-lg text-sm font-bold shadow-sm bg-white dark:bg-slate-600 transition-all";
                        btnLogin.className = "flex-1 py-2 rounded-lg text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-700 transition-all";
                        btnAction.innerHTML = '<i class="fas fa-user-plus mr-2"></i> Criar Conta';
                    }
                },
                submit: async () => {
                    const email = document.getElementById('auth-email').value;
                    const pass = document.getElementById('auth-pass').value;
                    const msg = document.getElementById('auth-msg');
                    
                    if(!email || !pass) { msg.innerText = "Preencha todos os campos."; return; }
                    
                    msg.innerText = "Processando...";
                    try {
                        if(app.state.authMode === 'login') {
                            await signInWithEmailAndPassword(auth, email, pass);
                        } else {
                            await createUserWithEmailAndPassword(auth, email, pass);
                        }
                        msg.innerText = "";
                    } catch (e) {
                        console.error(e);
                        msg.innerText = "Erro: " + (e.code === 'auth/invalid-credential' ? "Dados incorretos." : e.message);
                    }
                },
                logout: () => signOut(auth)
            },

            // --- DATA LAYER (FIRESTORE) ---
            data: {
                subscribe: () => {
                    const publicPath = `artifacts/${APP_ID}/public/data`;
                    
                    // Configurações
                    onSnapshot(doc(db, publicPath, 'config', 'main'), (s) => {
                        if(s.exists()) app.state.config = s.data();
                        app.ui.refresh();
                    });

                    // Categorias
                    onSnapshot(collection(db, publicPath, 'categories'), (s) => {
                        app.state.categories = s.docs.map(d => ({id: d.id, ...d.data()}));
                        app.ui.refresh();
                    });

                    // Posts
                    const qPosts = query(collection(db, publicPath, 'posts'), orderBy('timestamp', 'desc'));
                    onSnapshot(qPosts, (s) => {
                        app.state.posts = s.docs.map(d => ({id: d.id, ...d.data()}));
                        app.ui.refresh();
                    });

                    // Quizzes
                    onSnapshot(collection(db, publicPath, 'quizzes'), (s) => {
                        app.state.quizzes = s.docs.map(d => ({id: d.id, ...d.data()}));
                    });
                },
                
                // Funções de Escrita (Apenas Admin deve usar, mas protegemos na UI)
                saveCategory: async (name, subcatsStr) => {
                    if(!app.state.isAdmin) return;
                    const subs = subcatsStr.split(',').map(s => s.trim()).filter(s => s);
                    await addDoc(collection(db, `artifacts/${APP_ID}/public/data`, 'categories'), { name, subs });
                },
                
                savePost: async (title, content, catId) => {
                    if(!app.state.isAdmin) return;
                    await addDoc(collection(db, `artifacts/${APP_ID}/public/data`, 'posts'), {
                        title, content, categoryId: catId, timestamp: Date.now()
                    });
                },

                saveQuiz: async (question, options, correctIndex) => {
                    if(!app.state.isAdmin) return;
                    await addDoc(collection(db, `artifacts/${APP_ID}/public/data`, 'quizzes'), {
                        question, options, correctIndex: parseInt(correctIndex)
                    });
                },

                updateConfig: async (name, welcome) => {
                    if(!app.state.isAdmin) return;
                    await setDoc(doc(db, `artifacts/${APP_ID}/public/data`, 'config', 'main'), { siteName: name, welcomeMsg: welcome });
                },

                deleteItem: async (collectionName, id) => {
                    if(!app.state.isAdmin) return;
                    if(confirm('Tem certeza?')) await deleteDoc(doc(db, `artifacts/${APP_ID}/public/data`, collectionName, id));
                }
            },

            // --- ROTEAMENTO (SPA) ---
            router: {
                go: (viewName, params = {}) => {
                    app.state.currentView = viewName;
                    app.state.params = params;
                    app.ui.render();
                    window.scrollTo(0,0);
                }
            },

            // --- INTERFACE DO USUÁRIO ---
            ui: {
                toggleTheme: () => {
                    document.documentElement.classList.toggle('dark');
                    const isDark = document.documentElement.classList.contains('dark');
                    document.getElementById('theme-icon').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
                },

                refresh: () => app.ui.render(), // Re-renderiza a tela atual com novos dados

                formatText: (text) => {
                    if(!text) return '';
                    // Segurança básica contra XSS antes de formatar
                    let safe = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    // Formatações customizadas: *bold*, _italic_, ^code^
                    return safe
                        .replace(/\*(.*?)\*/g, '<strong class="fmt-bold">$1</strong>')
                        .replace(/_(.*?)_/g, '<em class="fmt-italic">$1</em>')
                        .replace(/\^(.*?)\^/g, '<span class="fmt-code">$1</span>')
                        .replace(/\n/g, '<br>');
                },

                render: () => {
                    const outlet = document.getElementById('router-outlet');
                    const { currentView, params, config, user, categories, posts, quizzes, isAdmin } = app.state;

                    // Atualiza Nome do Site na Navbar
                    document.getElementById('nav-site-name').innerHTML = `${config.siteName} <span class="text-tech-blue">Portal</span>`;

                    // --- VIEW: HOME ---
                    if (currentView === 'home') {
                        let html = `
                            <div class="animate-fade-in space-y-8">
                                <!-- Hero Section -->
                                <div class="bg-gradient-to-br from-tech-blue to-blue-900 rounded-3xl p-8 md:p-12 text-white relative overflow-hidden shadow-xl">
                                    <div class="relative z-10 max-w-2xl">
                                        <h2 class="text-4xl font-bold mb-4">${config.welcomeMsg}</h2>
                                        <p class="text-blue-100 text-lg mb-8 leading-relaxed">Seu hub central para organização de estudos, materiais e avaliações.</p>
                                        <div class="flex gap-3">
                                            <button onclick="app.router.go('quizz')" class="bg-white text-tech-blue px-6 py-2.5 rounded-xl font-bold hover:bg-blue-50 transition-all shadow-md">
                                                <i class="fas fa-brain mr-2"></i> Treinar Quiz
                                            </button>
                                        </div>
                                    </div>
                                    <i class="fas fa-laptop-code absolute right-[-20px] bottom-[-40px] text-[200px] opacity-10"></i>
                                </div>

                                <!-- Grid de Categorias -->
                                <div>
                                    <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fas fa-folder-open text-tech-orange"></i> Categorias de Estudo</h3>
                                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                        ${categories.map(c => `
                                            <div onclick="app.router.go('category', {id: '${c.id}'})" class="glass p-6 rounded-2xl hover:bg-white/50 dark:hover:bg-slate-800/50 cursor-pointer transition-all border-l-4 border-tech-blue hover:translate-x-1">
                                                <h4 class="font-bold text-lg mb-2">${c.name}</h4>
                                                <div class="flex flex-wrap gap-2">
                                                    ${c.subs ? c.subs.map(s => `<span class="text-xs bg-slate-200 dark:bg-slate-700 px-2 py-1 rounded text-slate-600 dark:text-slate-300">#${s}</span>`).join('') : ''}
                                                </div>
                                            </div>
                                        `).join('')}
                                        ${categories.length === 0 ? '<p class="text-slate-500">Nenhuma categoria cadastrada.</p>' : ''}
                                    </div>
                                </div>

                                <!-- Últimos Posts -->
                                <div>
                                    <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fas fa-bolt text-yellow-500"></i> Atualizações Recentes</h3>
                                    <div class="space-y-4">
                                        ${posts.slice(0, 5).map(p => {
                                            const catName = categories.find(c => c.id === p.categoryId)?.name || 'Geral';
                                            return `
                                                <div class="glass p-5 rounded-2xl flex flex-col md:flex-row gap-4 hover:shadow-md transition-all">
                                                    <div class="flex-1">
                                                        <span class="text-xs font-bold text-tech-blue uppercase tracking-wider mb-1 block">${catName}</span>
                                                        <h4 class="font-bold text-lg">${p.title}</h4>
                                                        <div class="text-slate-600 dark:text-slate-400 mt-2 text-sm line-clamp-2">${app.ui.formatText(p.content)}</div>
                                                    </div>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>
                            </div>
                        `;
                        outlet.innerHTML = html;
                    }

                    // --- VIEW: CATEGORY (LISTA DE POSTS) ---
                    else if (currentView === 'category') {
                        const cat = categories.find(c => c.id === params.id);
                        const catPosts = posts.filter(p => p.categoryId === params.id);
                        
                        outlet.innerHTML = `
                            <div class="animate-slide-up">
                                <button onclick="app.router.go('home')" class="mb-6 text-slate-500 hover:text-tech-blue transition"><i class="fas fa-arrow-left"></i> Voltar</button>
                                <div class="flex justify-between items-end mb-8 border-b border-slate-200 dark:border-slate-700 pb-4">
                                    <div>
                                        <h2 class="text-3xl font-bold">${cat ? cat.name : 'Categoria não encontrada'}</h2>
                                        <div class="flex gap-2 mt-2">
                                            ${cat && cat.subs ? cat.subs.map(s => `<span class="px-3 py-1 rounded-full bg-tech-blue/10 text-tech-blue text-xs font-bold">${s}</span>`).join('') : ''}
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="grid gap-6">
                                    ${catPosts.map(p => `
                                        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                                            <h3 class="text-xl font-bold mb-3 text-slate-900 dark:text-white">${p.title}</h3>
                                            <div class="prose dark:prose-invert max-w-none text-slate-600 dark:text-slate-300 leading-relaxed">
                                                ${app.ui.formatText(p.content)}
                                            </div>
                                            <div class="mt-4 text-xs text-slate-400 text-right">Postado em: ${new Date(p.timestamp).toLocaleDateString()}</div>
                                            ${isAdmin ? `<button onclick="app.data.deleteItem('posts', '${p.id}')" class="text-red-500 text-xs mt-2 hover:underline">Excluir Post</button>` : ''}
                                        </div>
                                    `).join('')}
                                    ${catPosts.length === 0 ? '<div class="text-center py-12 text-slate-400"><i class="fas fa-ghost text-4xl mb-4"></i><p>Nada por aqui ainda.</p></div>' : ''}
                                </div>
                            </div>
                        `;
                    }

                    // --- VIEW: QUIZ ---
                    else if (currentView === 'quizz') {
                        outlet.innerHTML = `
                            <div class="animate-slide-up max-w-3xl mx-auto">
                                <button onclick="app.router.go('home')" class="mb-6 text-slate-500 hover:text-tech-blue transition"><i class="fas fa-arrow-left"></i> Voltar</button>
                                <h2 class="text-3xl font-bold mb-8 text-center">Quiz de Conhecimento</h2>
                                
                                <div class="space-y-8">
                                    ${quizzes.map((q, idx) => `
                                        <div class="glass p-6 rounded-2xl relative group">
                                            <h3 class="font-bold text-lg mb-4 flex gap-3">
                                                <span class="bg-tech-orange text-white w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 text-sm">${idx+1}</span>
                                                ${q.question}
                                            </h3>
                                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                ${q.options.map((opt, optIdx) => `
                                                    <button onclick="this.classList.add('${optIdx === q.correctIndex ? 'bg-green-500' : 'bg-red-500'}', 'text-white', 'border-transparent'); this.disabled=true;" 
                                                        class="p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition text-left text-sm">
                                                        ${opt}
                                                    </button>
                                                `).join('')}
                                            </div>
                                            ${isAdmin ? `<button onclick="app.data.deleteItem('quizzes', '${q.id}')" class="absolute top-4 right-4 text-red-400 opacity-0 group-hover:opacity-100 transition"><i class="fas fa-trash"></i></button>` : ''}
                                        </div>
                                    `).join('')}
                                    ${quizzes.length === 0 ? '<p class="text-center text-slate-500">Nenhum quiz disponível no momento.</p>' : ''}
                                </div>
                            </div>
                        `;
                    }

                    // --- VIEW: ADMIN ---
                    else if (currentView === 'admin') {
                        if(!isAdmin) { app.router.go('home'); return; }

                        outlet.innerHTML = `
                            <div class="animate-fade-in max-w-4xl mx-auto">
                                <h2 class="text-3xl font-bold mb-8 text-tech-orange"><i class="fas fa-cogs"></i> Painel Administrativo</h2>
                                
                                <div class="grid gap-8">
                                    <!-- 1. Configs Gerais -->
                                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                                        <h3 class="font-bold text-lg mb-4 border-b pb-2 dark:border-slate-700">Configurações do Site</h3>
                                        <div class="grid md:grid-cols-2 gap-4">
                                            <input id="adm-site-name" value="${config.siteName}" class="p-2 border rounded dark:bg-slate-700 dark:border-slate-600" placeholder="Nome do Site">
                                            <input id="adm-welcome-msg" value="${config.welcomeMsg}" class="p-2 border rounded dark:bg-slate-700 dark:border-slate-600" placeholder="Mensagem de Boas-vindas">
                                        </div>
                                        <button onclick="app.data.updateConfig(document.getElementById('adm-site-name').value, document.getElementById('adm-welcome-msg').value)" class="mt-4 bg-slate-800 text-white px-4 py-2 rounded hover:opacity-90">Salvar Config</button>
                                    </div>

                                    <!-- 2. Adicionar Categoria -->
                                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                                        <h3 class="font-bold text-lg mb-4 border-b pb-2 dark:border-slate-700">Nova Categoria</h3>
                                        <div class="flex flex-col gap-3">
                                            <input id="adm-cat-name" class="p-2 border rounded dark:bg-slate-700 dark:border-slate-600" placeholder="Nome da Categoria">
                                            <input id="adm-cat-subs" class="p-2 border rounded dark:bg-slate-700 dark:border-slate-600" placeholder="Subcategorias (separadas por vírgula)">
                                            <button onclick="app.data.saveCategory(document.getElementById('adm-cat-name').value, document.getElementById('adm-cat-subs').value)" class="bg-tech-blue text-white px-4 py-2 rounded hover:opacity-90 self-start">Adicionar Categoria</button>
                                        </div>
                                        <div class="mt-4 flex flex-wrap gap-2">
                                            ${categories.map(c => `<span class="bg-slate-100 dark:bg-slate-700 px-2 py-1 rounded text-xs flex items-center gap-2">${c.name} <i onclick="app.data.deleteItem('categories', '${c.id}')" class="fas fa-times text-red-500 cursor-pointer"></i></span>`).join('')}
                                        </div>
                                    </div>

                                    <!-- 3. Novo Post -->
                                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                                        <h3 class="font-bold text-lg mb-4 border-b pb-2 dark:border-slate-700">Novo Conteúdo (Post)</h3>
                                        <div class="flex flex-col gap-3">
                                            <select id="adm-post-cat" class="p-2 border rounded dark:bg-slate-700 dark:border-slate-600">
                                                <option value="">Selecione a Categoria</option>
                                                ${categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                                            </select>
                                            <input id="adm-post-title" class="p-2 border rounded dark:bg-slate-700 dark:border-slate-600" placeholder="Título do Post">
                                            <textarea id="adm-post-content" rows="4" class="p-2 border rounded dark:bg-slate-700 dark:border-slate-600 font-mono text-sm" placeholder="Conteúdo... Use *negrito*, _italico_ e ^codigo^"></textarea>
                                            <div class="text-xs text-slate-500">Formatos: *negrito*, _italico_, ^codigo^</div>
                                            <button onclick="app.data.savePost(document.getElementById('adm-post-title').value, document.getElementById('adm-post-content').value, document.getElementById('adm-post-cat').value)" class="bg-green-600 text-white px-4 py-2 rounded hover:opacity-90 self-start">Publicar Post</button>
                                        </div>
                                    </div>

                                    <!-- 4. Novo Quiz -->
                                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                                        <h3 class="font-bold text-lg mb-4 border-b pb-2 dark:border-slate-700">Novo Quiz</h3>
                                        <div class="flex flex-col gap-3">
                                            <input id="adm-quiz-q" class="p-2 border rounded dark:bg-slate-700 dark:border-slate-600" placeholder="Pergunta">
                                            <div class="grid grid-cols-2 gap-2">
                                                <input id="adm-quiz-o1" class="p-2 border rounded dark:bg-slate-700 dark:border-slate-600" placeholder="Opção 1">
                                                <input id="adm-quiz-o2" class="p-2 border rounded dark:bg-slate-700 dark:border-slate-600" placeholder="Opção 2">
                                                <input id="adm-quiz-o3" class="p-2 border rounded dark:bg-slate-700 dark:border-slate-600" placeholder="Opção 3">
                                                <input id="adm-quiz-o4" class="p-2 border rounded dark:bg-slate-700 dark:border-slate-600" placeholder="Opção 4">
                                            </div>
                                            <select id="adm-quiz-correct" class="p-2 border rounded dark:bg-slate-700 dark:border-slate-600">
                                                <option value="0">Opção 1 é correta</option>
                                                <option value="1">Opção 2 é correta</option>
                                                <option value="2">Opção 3 é correta</option>
                                                <option value="3">Opção 4 é correta</option>
                                            </select>
                                            <button onclick="app.data.saveQuiz(document.getElementById('adm-quiz-q').value, [document.getElementById('adm-quiz-o1').value, document.getElementById('adm-quiz-o2').value, document.getElementById('adm-quiz-o3').value, document.getElementById('adm-quiz-o4').value], document.getElementById('adm-quiz-correct').value)" class="bg-purple-600 text-white px-4 py-2 rounded hover:opacity-90 self-start">Criar Quiz</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                },
                
                // Função de Pesquisa
                search: (query) => {
                    const term = query.toLowerCase();
                    const allCards = document.querySelectorAll('.glass, .bg-white'); // Simplificação para filtrar na DOM
                    
                    // Se estiver vazio, re-renderiza para limpar
                    if(!term) { app.ui.render(); return; }

                    // Lógica simples de filtro visual (para protótipo)
                    // Em produção, filtraríamos os arrays app.state.posts etc.
                }
            },
            
            // Funções auxiliares para busca (atalho)
            func: {
                search: (val) => {
                    // Filtro simples no array de posts para demonstração
                    if(!val) { app.ui.refresh(); return; }
                    const filteredPosts = app.state.posts.filter(p => p.title.toLowerCase().includes(val.toLowerCase()) || p.content.toLowerCase().includes(val.toLowerCase()));
                    // Força renderização apenas dos resultados (Hack rápido para SPA single file)
                    const outlet = document.getElementById('router-outlet');
                    outlet.innerHTML = `
                        <h2 class="text-2xl font-bold mb-4">Resultados da busca: "${val}"</h2>
                        <div class="grid gap-4">
                            ${filteredPosts.map(p => `<div class="glass p-4 rounded-xl font-bold">${p.title} <br> <span class="font-normal text-sm opacity-70">Clique em categorias para ver completo</span></div>`).join('')}
                            ${filteredPosts.length === 0 ? '<p>Nada encontrado.</p>' : ''}
                        </div>
                    `;
                }
            }
        };

        // Expor app para o window para os eventos de onclick funcionarem
        window.app = app;
        
        // Iniciar
        app.init();
    </script>
</body>
</html>
