<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIC Fácil - Apoio Acadêmico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        :root { --bg-main: #f8fafc; --text-main: #0f172a; --card-bg: #ffffff; }
        .dark-mode { --bg-main: #0f172a; --text-main: #f1f5f9; --card-bg: #1e293b; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); transition: background-color 0.3s, color 0.3s; }
        .glass-effect { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .dark-mode .glass-effect { background: rgba(30, 41, 59, 0.8); }
        .card { background-color: var(--card-bg); transition: transform 0.2s; }
        .category-pill { cursor: pointer; transition: all 0.2s; }
        .category-active { background-color: #4f46e5 !important; color: white !important; }
        .whitespace-pre-line { white-space: pre-line; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <div id="auth-screen" class="fixed inset-0 z-[200] bg-slate-900 flex items-center justify-center p-6">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl w-full max-w-md shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-center dark:text-white">Acesse o Portal CIC Fácil</h2>
            <div class="space-y-4">
                <input type="email" id="auth-email" placeholder="E-mail" class="w-full p-4 bg-slate-100 dark:bg-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white">
                <input type="password" id="auth-password" placeholder="Senha" class="w-full p-4 bg-slate-100 dark:bg-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white">
                <button id="btn-login" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700">Entrar</button>
                <button id="btn-register" class="w-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold py-4 rounded-xl">Criar Conta</button>
            </div>
            <p id="auth-error" class="text-rose-500 text-xs mt-4 text-center hidden"></p>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <header class="border-b border-slate-200 mb-8 sticky top-0 z-50 glass-effect">
            <div class="max-w-5xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <div class="bg-indigo-600 p-2 rounded-lg text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h6"/><path d="M8 11h8"/></svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight">CIC Fácil</h1>
                        <p class="text-slate-500 text-xs">Apoio Acadêmico - Ciência da Computação</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <input type="text" id="search-input" oninput="window.handleSearch(this.value)" placeholder="Buscar assunto..." class="bg-slate-100 dark:bg-slate-800 border-none rounded-full px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none w-full md:w-64 dark:text-white">
                    <button onclick="window.toggleDarkMode()" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="dark:text-amber-400"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                    </button>
                    <button id="admin-btn" onclick="window.toggleAdminPanel()" class="hidden bg-rose-600 text-white px-4 py-2 rounded-full text-xs font-bold">PAINEL ADMIN</button>
                    <div onclick="window.toggleApoio()" class="bg-amber-100 text-amber-700 px-4 py-2 rounded-full text-xs font-bold cursor-pointer hover:bg-amber-200">📌 GUIA RÁPIDO</div>
                    <button id="btn-logout" class="text-slate-400 hover:text-rose-500 transition"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
                </div>
            </div>
        </header>

        <main class="max-w-5xl mx-auto px-6">
            <section id="admin-panel" class="hidden bg-indigo-50 dark:bg-slate-800 border-2 border-indigo-200 dark:border-indigo-900 rounded-3xl p-6 mb-8">
                <h3 class="font-bold text-indigo-800 dark:text-indigo-300 mb-4">Novo Post (Firebase)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <input type="text" id="new-post-title" placeholder="Título" class="p-3 rounded-xl border dark:bg-slate-700">
                    <input type="text" id="new-post-category" placeholder="Categoria" class="p-3 rounded-xl border dark:bg-slate-700">
                </div>
                <textarea id="new-post-content" placeholder="Conteúdo" class="w-full p-4 rounded-xl border dark:bg-slate-700 h-32 mb-4"></textarea>
                <button id="btn-publish" class="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold">Publicar</button>
            </section>

            <div id="apoio-box" class="hidden bg-amber-50 border-2 border-amber-200 rounded-2xl p-6 mb-8 dark:bg-slate-800 dark:border-amber-900/30">
                <h3 class="text-amber-800 font-bold mb-4 dark:text-amber-400">Termos que você PRECISA saber</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="p-3 bg-white/50 rounded-xl dark:bg-slate-700/50"><span class="font-bold text-amber-900 block text-xs uppercase dark:text-amber-300">Kernel</span><span class="text-sm">O núcleo do S.O.</span></div>
                    <div class="p-3 bg-white/50 rounded-xl dark:bg-slate-700/50"><span class="font-bold text-amber-900 block text-xs uppercase dark:text-amber-300">Shell</span><span class="text-sm">Interface de comando.</span></div>
                    <div class="p-3 bg-white/50 rounded-xl dark:bg-slate-700/50"><span class="font-bold text-amber-900 block text-xs uppercase dark:text-amber-300">Thread</span><span class="text-sm">Unidade de processamento.</span></div>
                </div>
            </div>

            <div class="flex flex-wrap gap-2 mb-8" id="category-list"></div>
            <div id="posts-feed" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </main>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-[100] backdrop-blur-sm" onclick="window.closeModal()">
        <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-3xl w-full shadow-2xl overflow-hidden relative border dark:border-slate-700 flex flex-col max-h-[90vh]" onclick="event.stopPropagation()">
            <div class="flex justify-end p-4 border-b border-slate-100 dark:border-slate-800">
                <button onclick="window.closeModal()" class="text-slate-400 hover:text-rose-500 text-2xl w-10 h-10">✕</button>
            </div>
            <div id="modal-content" class="p-8 overflow-y-auto whitespace-pre-line"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzUc7VESjFy61_YPrrXBImEgDe--drGfQ",
            authDomain: "cic-facil.firebaseapp.com",
            projectId: "cic-facil",
            storageBucket: "cic-facil.firebasestorage.app",
            messagingSenderId: "775994873568",
            appId: "1:775994873568:web:da4f1da5b1054f97d3e285"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- DADOS ORIGINAIS ---
        const POSTS_ESTATICOS = [
            { id: "s1", titulo: "Introdução ao S.O", categoria: "Sistema Operacional", data: "31 Jan, 2026", alerta: "⚠️ Cai na Prova!", resumo: "Visão geral sobre software e hardware.", conteudo: `1. Definição Técnica\nO S.O. é uma camada entre o hardware e o usuário.\n\nTanenbaum define duas funções: Gerenciador de Recursos e Máquina Estendida.` },
            { id: "s2", titulo: "Funções Principais do S.O", categoria: "Sistema Operacional", data: "01 Fev, 2026", alerta: "🔥 Importante", resumo: "Os quatro pilares operacionais.", conteudo: `Gerenciamento de Processos, Memória, Arquivos e Dispositivos (E/S).` },
            { id: "s3", titulo: "Evolução Histórica", categoria: "Sistema Operacional", data: "01 Fev, 2026", alerta: "⚠️ Cai na Prova!", resumo: "Das válvulas aos PCs modernos.", conteudo: `1ª Geração (Válvulas), 2ª (Transistores), 3ª (Chips/Multiprogramação), 4ª (LSI/PCs).` },
            { id: "s4", titulo: "Monoprogramação vs Multiprogramação", categoria: "Sistema Operacional", data: "01 Fev, 2026", alerta: "⚠️ Cai na Prova!", resumo: "A eficiência do processamento.", conteudo: `Monoprogramação: CPU ociosa. Multiprogramação: CPU sempre ocupada com vários processos na memória.` },
            { id: "s5", titulo: "Camadas do Sistema", categoria: "Sistema Operacional", data: "01 Fev, 2026", alerta: "⚠️ Cai na Prova!", resumo: "Hardware, S.O, Utilitários e Aplicações.", conteudo: `1. Hardware\n2. Sistema Operacional\n3. Programas de Sistema\n4. Programas de Aplicação.` }
        ];

        let postsBanco = [];
        let userProgress = { lidos: [] };
        let categoriaAtiva = "Todas";
        let buscaAtiva = "";

        // --- FUNÇÕES DE AUTH (EXPORTADAS PARA WINDOW) ---
        document.getElementById('btn-login').onclick = () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            signInWithEmailAndPassword(auth, email, pass).catch(err => alert(err.message));
        };

        document.getElementById('btn-register').onclick = () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            createUserWithEmailAndPassword(auth, email, pass).catch(err => alert(err.message));
        };

        document.getElementById('btn-logout').onclick = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                if(user.email.includes('admin@')) document.getElementById('admin-btn').classList.remove('hidden');

                onSnapshot(doc(db, 'usuarios', user.uid), (snap) => {
                    if(snap.exists()) userProgress = snap.data();
                    window.renderPosts();
                });

                onSnapshot(collection(db, 'posts'), (snap) => {
                    postsBanco = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    window.renderCategories();
                    window.renderPosts();
                });
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        });

        // --- LÓGICA DO APP (EXPORTADA) ---
        window.renderCategories = () => {
            const cats = ["Todas", "Sistema Operacional", "Gestão de Projetos", "Arquitetura", "Geral"];
            document.getElementById('category-list').innerHTML = cats.map(c => {
                const active = categoriaAtiva === c ? "category-active" : "bg-white dark:bg-slate-800 border";
                return `<span onclick="window.filtrar('${c}')" class="category-pill px-5 py-2 rounded-full text-sm font-semibold ${active}">${c}</span>`;
            }).join('');
        };

        window.renderPosts = () => {
            const feed = document.getElementById('posts-feed');
            const todos = [...POSTS_ESTATICOS, ...postsBanco];
            let filtrados = todos.filter(p => (categoriaAtiva === "Todas" || p.categoria === categoriaAtiva) && p.titulo.toLowerCase().includes(buscaAtiva));

            feed.innerHTML = filtrados.map(p => `
                <article class="card p-6 rounded-3xl border dark:border-slate-800 relative">
                    <div class="flex justify-between mb-4">
                        <span class="text-[10px] font-black uppercase text-indigo-600">${p.categoria}</span>
                        <button onclick="window.mark('${p.id}', event)" class="text-xs ${userProgress.lidos?.includes(p.id) ? 'text-green-500' : 'text-slate-300'}">
                            ${userProgress.lidos?.includes(p.id) ? '✅ Lido' : '⚪ Marcar'}
                        </button>
                    </div>
                    <div class="cursor-pointer" onclick="window.openPost('${p.id}')">
                        <h2 class="text-xl font-bold mb-2">${p.titulo}</h2>
                        <p class="text-slate-500 text-sm line-clamp-2">${p.resumo}</p>
                    </div>
                    ${p.alerta ? `<div class="absolute -top-2 -right-2 bg-rose-500 text-white text-[9px] px-2 py-1 rounded-lg">${p.alerta}</div>` : ''}
                </article>
            `).join('');
        };

        window.openPost = (id) => {
            const p = [...POSTS_ESTATICOS, ...postsBanco].find(x => x.id === id);
            document.getElementById('modal-content').innerHTML = `<h2 class="text-3xl font-black mb-4">${p.titulo}</h2><div>${p.conteudo}</div>`;
            document.getElementById('modal').classList.replace('hidden', 'flex');
        };

        window.mark = async (id, e) => {
            e.stopPropagation();
            let lidos = [...(userProgress.lidos || [])];
            lidos = lidos.includes(id) ? lidos.filter(i => i !== id) : [...lidos, id];
            await setDoc(doc(db, 'usuarios', auth.currentUser.uid), { lidos }, { merge: true });
        };

        document.getElementById('btn-publish').onclick = async () => {
            const post = {
                titulo: document.getElementById('new-post-title').value,
                categoria: document.getElementById('new-post-category').value,
                conteudo: document.getElementById('new-post-content').value,
                data: new Date().toLocaleDateString(),
                resumo: document.getElementById('new-post-content').value.substring(0, 100) + "..."
            };
            await addDoc(collection(db, 'posts'), post);
            alert("Postado!");
        };

        window.closeModal = () => document.getElementById('modal').classList.replace('flex', 'hidden');
        window.filtrar = (c) => { categoriaAtiva = c; window.renderCategories(); window.renderPosts(); };
        window.handleSearch = (v) => { buscaAtiva = v.toLowerCase(); window.renderPosts(); };
        window.toggleDarkMode = () => document.body.classList.toggle('dark-mode');
        window.toggleAdminPanel = () => document.getElementById('admin-panel').classList.toggle('hidden');
        window.toggleApoio = () => document.getElementById('apoio-box').classList.toggle('hidden');
    </script>
</body>
</html>
