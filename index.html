<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIC EAD Platform</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config for High Tech Theme -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        tech: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9', // Sky Blue
                            600: '#0284c7',
                            800: '#075985',
                            900: '#0c4a6e',
                            dark: '#0f172a', // Slate 900
                            darker: '#020617', // Slate 950
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        
        /* Text Format Classes */
        .fmt-bold { font-weight: 700; color: inherit; }
        .fmt-italic { font-style: italic; color: inherit; }
        .fmt-code { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: rgba(14, 165, 233, 0.15); 
            padding: 2px 6px; 
            border-radius: 4px; 
            color: #0ea5e9;
            font-size: 0.9em;
        }
        
        body { transition: background-color 0.3s, color 0.3s; }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 dark:bg-tech-darker dark:text-slate-100 h-screen overflow-hidden selection:bg-tech-500 selection:text-white">

    <div id="root"></div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import React from "https://esm.sh/react@18";
        import ReactDOM from "https://esm.sh/react-dom@18/client";
        import { createRoot } from "https://esm.sh/react-dom@18/client";
        import * as LucideReact from "https://esm.sh/lucide-react@0.263.1";

        // Configuração Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAHDSu3C39lJPkMtacpHoLNXn3aphXpRvA",
            authDomain: "cic-ead.firebaseapp.com",
            projectId: "cic-ead",
            storageBucket: "cic-ead.firebasestorage.app",
            messagingSenderId: "224684609703",
            appId: "1:224684609703:web:52fce7f22501300a2b0b82"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // ID global do App para o caminho do Firestore (strict path rule)
        const APP_ID = "cic_ead_platform_v1";

        // --- Componentes React ---

        const { useState, useEffect, useMemo } = React;
        const { 
            LayoutDashboard, BookOpen, Layers, Settings, Moon, Sun, 
            LogOut, Search, Plus, Trash2, Save, Edit3, X, Check,
            ChevronRight, GraduationCap, Menu, User
        } = LucideReact;

        // Formatação de texto personalizada (*negrito*, _italico_, ^codigo^)
        const FormattedText = ({ text }) => {
            if (!text) return null;
            
            // Regex para dividir o texto mantendo os delimitadores
            const parts = text.split(/(\*[^*]+\*|_{^_]+_|\^[^\^]+\^)/g);

            return (
                <span>
                    {parts.map((part, index) => {
                        if (part.startsWith('*') && part.endsWith('*')) {
                            return <strong key={index} className="fmt-bold">{part.slice(1, -1)}</strong>;
                        } else if (part.startsWith('_') && part.endsWith('_')) {
                            return <em key={index} className="fmt-italic">{part.slice(1, -1)}</em>;
                        } else if (part.startsWith('^') && part.endsWith('^')) {
                            return <code key={index} className="fmt-code">{part.slice(1, -1)}</code>;
                        }
                        return part;
                    })}
                </span>
            );
        };

        const LoadingSpinner = () => (
            <div className="flex items-center justify-center h-full w-full">
                <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-tech-500"></div>
            </div>
        );

        // --- Página de Login/Registro ---
        const AuthPage = ({ onLogin }) => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    if (isLogin) {
                        await signInWithEmailAndPassword(auth, email, password);
                    } else {
                        await createUserWithEmailAndPassword(auth, email, password);
                    }
                } catch (err) {
                    setError(err.message.replace('Firebase: ', ''));
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex min-h-screen items-center justify-center bg-gray-100 dark:bg-tech-darker p-4">
                    <div className="w-full max-w-md bg-white dark:bg-tech-dark rounded-2xl shadow-xl border border-gray-200 dark:border-gray-800 p-8">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-tech-600 dark:text-tech-500 mb-2">CIC EAD</h1>
                            <p className="text-gray-500 dark:text-gray-400">Plataforma de Ensino High Tech</p>
                        </div>

                        {error && (
                            <div className="bg-red-100 text-red-600 p-3 rounded-lg mb-4 text-sm text-center">
                                {error}
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
                                <input 
                                    type="email" 
                                    required
                                    className="w-full px-4 py-2 rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-tech-500 text-gray-900 dark:text-white transition-all"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Senha</label>
                                <input 
                                    type="password" 
                                    required
                                    className="w-full px-4 py-2 rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-tech-500 text-gray-900 dark:text-white transition-all"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                />
                            </div>
                            <button 
                                type="submit" 
                                disabled={loading}
                                className="w-full bg-tech-600 hover:bg-tech-500 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-200 flex items-center justify-center"
                            >
                                {loading ? <div className="animate-spin h-5 w-5 border-2 border-white rounded-full border-t-transparent"></div> : (isLogin ? 'Entrar' : 'Registrar')}
                            </button>
                        </form>

                        <div className="mt-6 text-center">
                            <button 
                                onClick={() => setIsLogin(!isLogin)}
                                className="text-sm text-tech-600 dark:text-tech-400 hover:underline"
                            >
                                {isLogin ? 'Não tem conta? Crie agora' : 'Já tem conta? Faça login'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Componente de Quiz ---
        const QuizArea = ({ quizzes, isAdmin, onSaveQuiz, onDeleteQuiz }) => {
            const [activeQuiz, setActiveQuiz] = useState(null);
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [score, setScore] = useState(0);
            const [finished, setFinished] = useState(false);
            const [editing, setEditing] = useState(false);
            
            // Estado para criar/editar quiz
            const [newQuestion, setNewQuestion] = useState({
                question: '',
                options: ['', '', '', ''],
                correct: 0
            });

            const handleAnswer = (optionIndex) => {
                if (activeQuiz.options[optionIndex] === activeQuiz.options[activeQuiz.correct]) {
                    setScore(score + 1);
                }
                
                // Como este app simula múltiplos quizzes, mas a estrutura simplificada é um array de perguntas
                // Vamos tratar cada pergunta como um mini-quiz para este exemplo, ou iterar.
                // Para simplificar a UX: O usuário responde perguntas aleatórias do banco.
                
                const nextQ = currentQuestion + 1;
                if (nextQ < quizzes.length) {
                    setCurrentQuestion(nextQ);
                    setActiveQuiz(quizzes[nextQ]);
                } else {
                    setFinished(true);
                }
            };

            const startQuiz = () => {
                if (quizzes.length === 0) return;
                setScore(0);
                setCurrentQuestion(0);
                setFinished(false);
                setActiveQuiz(quizzes[0]);
            };

            const handleAddQuestion = () => {
                onSaveQuiz(newQuestion);
                setNewQuestion({ question: '', options: ['', '', '', ''], correct: 0 });
                setEditing(false);
            };

            if (editing) {
                return (
                    <div className="p-6 bg-white dark:bg-gray-800 rounded-xl shadow-sm animate-fade-in">
                        <h2 className="text-xl font-bold mb-4">Adicionar Pergunta</h2>
                        <input 
                            className="w-full mb-3 p-2 border rounded dark:bg-gray-700 dark:border-gray-600"
                            placeholder="A Pergunta"
                            value={newQuestion.question}
                            onChange={e => setNewQuestion({...newQuestion, question: e.target.value})}
                        />
                        <div className="grid grid-cols-1 gap-2 mb-4">
                            {newQuestion.options.map((opt, idx) => (
                                <div key={idx} className="flex gap-2 items-center">
                                    <input 
                                        type="radio" 
                                        name="correct" 
                                        checked={newQuestion.correct === idx}
                                        onChange={() => setNewQuestion({...newQuestion, correct: idx})}
                                    />
                                    <input 
                                        className="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600"
                                        placeholder={`Opção ${idx + 1}`}
                                        value={opt}
                                        onChange={e => {
                                            const newOpts = [...newQuestion.options];
                                            newOpts[idx] = e.target.value;
                                            setNewQuestion({...newQuestion, options: newOpts});
                                        }}
                                    />
                                </div>
                            ))}
                        </div>
                        <div className="flex gap-2">
                            <button onClick={handleAddQuestion} className="px-4 py-2 bg-green-600 text-white rounded">Salvar</button>
                            <button onClick={() => setEditing(false)} className="px-4 py-2 bg-gray-500 text-white rounded">Cancelar</button>
                        </div>
                    </div>
                );
            }

            if (finished) {
                return (
                    <div className="text-center p-10 bg-white dark:bg-gray-800 rounded-xl shadow-lg">
                        <GraduationCap size={64} className="mx-auto text-tech-500 mb-4" />
                        <h2 className="text-2xl font-bold mb-2">Quiz Finalizado!</h2>
                        <p className="text-xl">Você acertou <span className="text-tech-600 font-bold">{score}</span> de {quizzes.length}</p>
                        <button onClick={startQuiz} className="mt-6 px-6 py-2 bg-tech-600 text-white rounded-lg hover:bg-tech-700">Tentar Novamente</button>
                    </div>
                );
            }

            if (activeQuiz) {
                return (
                    <div className="max-w-2xl mx-auto">
                        <div className="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700">
                            <div className="flex justify-between items-center mb-6">
                                <span className="text-sm font-mono text-gray-500">Questão {currentQuestion + 1}/{quizzes.length}</span>
                                <span className="text-sm font-bold text-tech-500">Quiz</span>
                            </div>
                            <h3 className="text-xl font-bold mb-8 text-gray-800 dark:text-gray-100">{activeQuiz.question}</h3>
                            <div className="space-y-3">
                                {activeQuiz.options.map((opt, idx) => (
                                    <button 
                                        key={idx}
                                        onClick={() => handleAnswer(idx)}
                                        className="w-full text-left p-4 rounded-xl border border-gray-200 dark:border-gray-600 hover:border-tech-500 hover:bg-tech-50 dark:hover:bg-tech-900 transition-all flex items-center group"
                                    >
                                        <div className="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center mr-4 group-hover:bg-tech-500 group-hover:text-white transition-colors">
                                            {['A','B','C','D'][idx]}
                                        </div>
                                        <span>{opt}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            // Tela Inicial do Quiz
            return (
                <div className="space-y-6">
                    <div className="bg-gradient-to-r from-tech-600 to-tech-800 rounded-2xl p-8 text-white flex justify-between items-center">
                        <div>
                            <h2 className="text-3xl font-bold mb-2">Teste seus Conhecimentos</h2>
                            <p className="opacity-90">Responda a perguntas para testar seu aprendizado.</p>
                        </div>
                        <BookOpen size={48} className="opacity-50" />
                    </div>

                    <div className="flex justify-between items-center">
                        <h3 className="text-xl font-bold dark:text-white">Perguntas Disponíveis ({quizzes.length})</h3>
                        {isAdmin && (
                            <button 
                                onClick={() => setEditing(true)}
                                className="flex items-center gap-2 px-4 py-2 bg-tech-100 dark:bg-tech-900 text-tech-700 dark:text-tech-300 rounded-lg hover:bg-tech-200"
                            >
                                <Plus size={18} /> Nova Pergunta
                            </button>
                        )}
                    </div>

                    {quizzes.length > 0 ? (
                        <div className="grid gap-4">
                            {quizzes.map((q, i) => (
                                <div key={q.id} className="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm flex justify-between items-center border-l-4 border-tech-500">
                                    <div>
                                        <p className="font-semibold">{q.question}</p>
                                        <p className="text-xs text-gray-500 mt-1">{q.options.length} opções • Resposta correta: {['A','B','C','D'][q.correct]}</p>
                                    </div>
                                    <div className="flex gap-2">
                                        {isAdmin ? (
                                            <button onClick={() => onDeleteQuiz(q.id)} className="p-2 text-red-500 hover:bg-red-50 rounded-lg">
                                                <Trash2 size={18} />
                                            </button>
                                        ) : null}
                                    </div>
                                </div>
                            ))}
                            <button 
                                onClick={startQuiz}
                                className="w-full py-4 bg-tech-600 hover:bg-tech-700 text-white font-bold rounded-xl shadow-lg transform hover:scale-[1.01] transition-all mt-4"
                            >
                                Começar Quiz Agora
                            </button>
                        </div>
                    ) : (
                        <div className="text-center py-10 text-gray-500">
                            Nenhuma pergunta cadastrada ainda.
                        </div>
                    )}
                </div>
            );
        };

        // --- Componente Principal ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('home'); // home, post, category, quiz, admin
            const [selectedId, setSelectedId] = useState(null);
            const [darkMode, setDarkMode] = useState(false);
            const [sidebarOpen, setSidebarOpen] = useState(true);
            
            // Dados
            const [siteConfig, setSiteConfig] = useState({ title: 'CIC EAD' });
            const [categories, setCategories] = useState([]);
            const [posts, setPosts] = useState([]);
            const [quizzes, setQuizzes] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');

            // Admin Logic
            const isAdmin = user?.email?.endsWith('@admin.com');

            // Toggle Theme
            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            // Auth Listener
            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // Data Listeners
            useEffect(() => {
                // Config
                const unsubConfig = onSnapshot(doc(db, 'artifacts', APP_ID, 'public', 'config'), (snap) => {
                    if (snap.exists()) setSiteConfig(snap.data());
                });

                // Categories
                const qCats = query(collection(db, 'artifacts', APP_ID, 'public', 'categories'), orderBy('name'));
                const unsubCats = onSnapshot(qCats, (snap) => {
                    setCategories(snap.docs.map(d => ({id: d.id, ...d.data()})));
                });

                // Posts
                const qPosts = query(collection(db, 'artifacts', APP_ID, 'public', 'posts'), orderBy('createdAt', 'desc'));
                const unsubPosts = onSnapshot(qPosts, (snap) => {
                    setPosts(snap.docs.map(d => ({id: d.id, ...d.data()})));
                });

                // Quizzes
                const qQuiz = query(collection(db, 'artifacts', APP_ID, 'public', 'quizzes'));
                const unsubQuiz = onSnapshot(qQuiz, (snap) => {
                    setQuizzes(snap.docs.map(d => ({id: d.id, ...d.data()})));
                });

                return () => { unsubConfig(); unsubCats(); unsubPosts(); unsubQuiz(); };
            }, []);

            // Handlers
            const handleLogout = () => signOut(auth);

            // CRUD Handlers (Admin Only)
            const saveConfig = async (newTitle) => {
                await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'config'), { title: newTitle }, { merge: true });
            };

            const addCategory = async (name, parentId = null) => {
                const ref = doc(collection(db, 'artifacts', APP_ID, 'public', 'categories'));
                await setDoc(ref, { name, parentId, createdAt: serverTimestamp() });
            };
            
            const deleteCategory = async (id) => {
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'categories', id));
            };

            const savePost = async (postData) => {
                const ref = postData.id 
                    ? doc(db, 'artifacts', APP_ID, 'public', 'posts', postData.id)
                    : doc(collection(db, 'artifacts', APP_ID, 'public', 'posts'));
                
                await setDoc(ref, { ...postData, createdAt: postData.createdAt || serverTimestamp() }, { merge: true });
            };

            const deletePost = async (id) => {
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'posts', id));
            };

            const saveQuiz = async (quizData) => {
                const ref = doc(collection(db, 'artifacts', APP_ID, 'public', 'quizzes'));
                await setDoc(ref, quizData);
            };

            const deleteQuiz = async (id) => {
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'quizzes', id));
            };

            // Filtragem
            const filteredPosts = useMemo(() => {
                return posts.filter(p => 
                    p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    p.content.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }, [posts, searchQuery]);

            // --- Renderização da Página Principal ---

            if (loading) return <div className="h-screen bg-gray-50 dark:bg-gray-900"><LoadingSpinner /></div>;
            if (!user) return <AuthPage onLogin={() => {}} />;

            return (
                <div className="flex h-screen bg-gray-50 dark:bg-tech-darker transition-colors duration-300">
                    
                    {/* Sidebar */}
                    <aside className={`${sidebarOpen ? 'w-64' : 'w-20'} bg-white dark:bg-tech-dark border-r border-gray-200 dark:border-gray-800 transition-all duration-300 flex flex-col z-20`}>
                        <div className="p-4 h-16 flex items-center justify-between border-b border-gray-100 dark:border-gray-800">
                            {sidebarOpen && <h1 className="font-bold text-xl text-tech-600 truncate">{siteConfig.title}</h1>}
                            <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800">
                                <Menu size={20} />
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto py-4 space-y-1">
                            <NavItem icon={LayoutDashboard} label="Início" active={view === 'home'} onClick={() => setView('home')} open={sidebarOpen} />
                            <NavItem icon={GraduationCap} label="Quiz" active={view === 'quiz'} onClick={() => setView('quiz')} open={sidebarOpen} />
                            
                            {sidebarOpen && <div className="px-4 py-2 mt-4 text-xs font-semibold text-gray-400 uppercase">Categorias</div>}
                            
                            {categories.filter(c => !c.parentId).map(cat => (
                                <div key={cat.id}>
                                    <NavItem 
                                        icon={Layers} 
                                        label={cat.name} 
                                        active={view === 'category' && selectedId === cat.id}
                                        onClick={() => { setView('category'); setSelectedId(cat.id); }}
                                        open={sidebarOpen}
                                    />
                                    {/* Subcategories */}
                                    {sidebarOpen && categories.filter(sub => sub.parentId === cat.id).map(sub => (
                                        <button 
                                            key={sub.id}
                                            onClick={() => { setView('category'); setSelectedId(sub.id); }}
                                            className={`w-full text-left pl-12 pr-4 py-2 text-sm transition-colors ${selectedId === sub.id && view === 'category' ? 'text-tech-600 font-medium' : 'text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-200'}`}
                                        >
                                            {sub.name}
                                        </button>
                                    ))}
                                </div>
                            ))}

                            {isAdmin && (
                                <>
                                    <div className="my-4 border-t border-gray-200 dark:border-gray-800"></div>
                                    <NavItem icon={Settings} label="Admin" active={view === 'admin'} onClick={() => setView('admin')} open={sidebarOpen} />
                                </>
                            )}
                        </div>

                        <div className="p-4 border-t border-gray-200 dark:border-gray-800">
                            <div className="flex items-center gap-3 mb-4 overflow-hidden">
                                <div className="w-8 h-8 rounded-full bg-tech-100 text-tech-600 flex items-center justify-center flex-shrink-0">
                                    <User size={16} />
                                </div>
                                {sidebarOpen && (
                                    <div className="flex-1 min-w-0">
                                        <p className="text-sm font-medium truncate dark:text-gray-200">{user.email}</p>
                                        <p className="text-xs text-gray-500 truncate">{isAdmin ? 'Administrador' : 'Aluno'}</p>
                                    </div>
                                )}
                            </div>
                            <button onClick={handleLogout} className={`flex items-center gap-3 w-full p-2 text-red-500 hover:bg-red-50 rounded-lg transition-colors ${!sidebarOpen && 'justify-center'}`}>
                                <LogOut size={20} />
                                {sidebarOpen && <span>Sair</span>}
                            </button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col h-full overflow-hidden bg-gray-50 dark:bg-tech-darker relative">
                        {/* Header */}
                        <header className="h-16 bg-white dark:bg-tech-dark border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-6 z-10">
                            <div className="flex items-center bg-gray-100 dark:bg-gray-800 rounded-lg px-3 py-2 w-96">
                                <Search size={18} className="text-gray-400 mr-2" />
                                <input 
                                    type="text" 
                                    placeholder="Pesquisar posts, aulas..." 
                                    className="bg-transparent border-none outline-none text-sm w-full dark:text-white"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                            </div>
                            <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition-colors">
                                {darkMode ? <Sun size={20} /> : <Moon size={20} />}
                            </button>
                        </header>

                        {/* Content Area */}
                        <div className="flex-1 overflow-y-auto p-6 scroll-smooth">
                            
                            {/* VIEW: HOME */}
                            {view === 'home' && (
                                <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                    <div className="mb-8">
                                        <h2 className="text-2xl font-bold dark:text-white">Bem-vindo(a) ao {siteConfig.title}</h2>
                                        <p className="text-gray-500 dark:text-gray-400">Selecione um tópico ou explore as novidades abaixo.</p>
                                    </div>

                                    {searchQuery ? (
                                        <div>
                                            <h3 className="text-lg font-semibold mb-4 dark:text-gray-200">Resultados da busca:</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                {filteredPosts.map(post => (
                                                    <PostCard key={post.id} post={post} onClick={() => { setView('post'); setSelectedId(post.id); }} />
                                                ))}
                                                {filteredPosts.length === 0 && <p className="text-gray-500">Nenhum resultado encontrado.</p>}
                                            </div>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                                <div className="bg-gradient-to-br from-blue-500 to-blue-600 rounded-2xl p-6 text-white shadow-lg shadow-blue-500/20">
                                                    <BookOpen className="mb-4 opacity-80" />
                                                    <h3 className="text-2xl font-bold">{posts.length}</h3>
                                                    <p className="text-blue-100">Aulas Disponíveis</p>
                                                </div>
                                                <div className="bg-gradient-to-br from-indigo-500 to-indigo-600 rounded-2xl p-6 text-white shadow-lg shadow-indigo-500/20">
                                                    <Layers className="mb-4 opacity-80" />
                                                    <h3 className="text-2xl font-bold">{categories.length}</h3>
                                                    <p className="text-indigo-100">Categorias</p>
                                                </div>
                                                <div className="bg-gradient-to-br from-teal-500 to-teal-600 rounded-2xl p-6 text-white shadow-lg shadow-teal-500/20">
                                                    <GraduationCap className="mb-4 opacity-80" />
                                                    <h3 className="text-2xl font-bold">{quizzes.length}</h3>
                                                    <p className="text-teal-100">Quizzes</p>
                                                </div>
                                            </div>

                                            <h3 className="text-xl font-bold mb-4 dark:text-white flex items-center gap-2">
                                                <span className="w-2 h-8 bg-tech-500 rounded-full"></span>
                                                Últimas Postagens
                                            </h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                {posts.slice(0, 6).map(post => (
                                                    <PostCard key={post.id} post={post} onClick={() => { setView('post'); setSelectedId(post.id); }} />
                                                ))}
                                            </div>
                                        </>
                                    )}
                                </div>
                            )}

                            {/* VIEW: CATEGORY */}
                            {view === 'category' && (
                                <div className="animate-in fade-in duration-300">
                                    <button onClick={() => setView('home')} className="mb-4 text-sm text-gray-500 hover:text-tech-500 flex items-center gap-1">
                                        &larr; Voltar
                                    </button>
                                    <h2 className="text-3xl font-bold mb-6 dark:text-white">
                                        {categories.find(c => c.id === selectedId)?.name || 'Categoria'}
                                    </h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {posts.filter(p => p.categoryId === selectedId).map(post => (
                                            <PostCard key={post.id} post={post} onClick={() => { setView('post'); setSelectedId(post.id); }} />
                                        ))}
                                    </div>
                                    {posts.filter(p => p.categoryId === selectedId).length === 0 && (
                                        <div className="text-center py-20 text-gray-400">Nenhum post nesta categoria.</div>
                                    )}
                                </div>
                            )}

                            {/* VIEW: POST */}
                            {view === 'post' && (
                                <div className="max-w-4xl mx-auto animate-in fade-in slide-in-from-bottom-8 duration-500 bg-white dark:bg-tech-dark p-8 rounded-2xl shadow-sm">
                                    <button onClick={() => setView('home')} className="mb-6 text-sm text-gray-500 hover:text-tech-500 flex items-center gap-1">
                                        &larr; Voltar ao Início
                                    </button>
                                    
                                    {posts.find(p => p.id === selectedId) ? (
                                        <>
                                            <h1 className="text-4xl font-bold mb-4 dark:text-white text-tech-900 leading-tight">
                                                {posts.find(p => p.id === selectedId).title}
                                            </h1>
                                            <div className="flex items-center gap-4 text-sm text-gray-500 mb-8 border-b border-gray-100 dark:border-gray-800 pb-4">
                                                <span>{categories.find(c => c.id === posts.find(p => p.id === selectedId).categoryId)?.name || 'Geral'}</span>
                                                <span>•</span>
                                                <span>{new Date(posts.find(p => p.id === selectedId).createdAt?.seconds * 1000).toLocaleDateString()}</span>
                                            </div>
                                            <div className="prose dark:prose-invert max-w-none text-lg leading-relaxed text-gray-700 dark:text-gray-300">
                                                {/* Rendering Rich Text Logic */}
                                                {posts.find(p => p.id === selectedId).content.split('\n').map((para, i) => (
                                                    <p key={i} className="mb-4"><FormattedText text={para} /></p>
                                                ))}
                                            </div>
                                        </>
                                    ) : <p>Carregando...</p>}
                                </div>
                            )}

                            {/* VIEW: QUIZ */}
                            {view === 'quiz' && (
                                <div className="animate-in fade-in duration-300 max-w-4xl mx-auto">
                                    <QuizArea 
                                        quizzes={quizzes} 
                                        isAdmin={isAdmin} 
                                        onSaveQuiz={saveQuiz}
                                        onDeleteQuiz={deleteQuiz}
                                    />
                                </div>
                            )}

                            {/* VIEW: ADMIN */}
                            {view === 'admin' && isAdmin && (
                                <AdminPanel 
                                    siteConfig={siteConfig}
                                    categories={categories}
                                    posts={posts}
                                    onSaveConfig={saveConfig}
                                    onAddCategory={addCategory}
                                    onDeleteCategory={deleteCategory}
                                    onSavePost={savePost}
                                    onDeletePost={deletePost}
                                />
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        // --- Componentes Auxiliares ---

        const NavItem = ({ icon: Icon, label, active, onClick, open }) => (
            <button 
                onClick={onClick}
                className={`w-full flex items-center gap-3 p-3 rounded-lg transition-all duration-200 ${
                    active 
                    ? 'bg-tech-50 text-tech-600 dark:bg-tech-900 dark:text-tech-400 font-medium shadow-sm' 
                    : 'text-gray-500 hover:bg-gray-50 hover:text-gray-900 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-gray-200'
                } ${!open && 'justify-center'}`}
            >
                <Icon size={20} />
                {open && <span className="truncate">{label}</span>}
            </button>
        );

        const PostCard = ({ post, onClick }) => (
            <div 
                onClick={onClick}
                className="group bg-white dark:bg-tech-dark p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800 hover:shadow-md hover:border-tech-200 dark:hover:border-tech-800 transition-all cursor-pointer flex flex-col h-full"
            >
                <h3 className="font-bold text-lg mb-2 dark:text-gray-100 group-hover:text-tech-600 transition-colors line-clamp-2">{post.title}</h3>
                <p className="text-gray-500 dark:text-gray-400 text-sm mb-4 line-clamp-3 flex-1">
                    {post.content.replace(/[*_^]/g, '')}
                </p>
                <div className="flex items-center text-tech-500 text-sm font-medium mt-auto">
                    Ler mais <ChevronRight size={16} className="ml-1 group-hover:translate-x-1 transition-transform" />
                </div>
            </div>
        );

        // --- Painel Admin ---
        const AdminPanel = ({ siteConfig, categories, posts, onSaveConfig, onAddCategory, onDeleteCategory, onSavePost, onDeletePost }) => {
            const [tab, setTab] = useState('general'); // general, cats, posts
            const [postForm, setPostForm] = useState(null);

            // Estados locais para formulários
            const [newCatName, setNewCatName] = useState('');
            const [newCatParent, setNewCatParent] = useState('');
            const [configTitle, setConfigTitle] = useState(siteConfig.title);

            // Form de Postagem
            const handleEditPost = (post) => {
                setPostForm(post || { title: '', content: '', categoryId: categories[0]?.id || '' });
                setTab('editor');
            };

            const submitPost = () => {
                onSavePost(postForm);
                setPostForm(null);
                setTab('posts');
            };

            return (
                <div className="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden animate-fade-in">
                    <div className="flex border-b border-gray-200 dark:border-gray-700">
                        <button onClick={() => setTab('general')} className={`px-6 py-4 font-medium ${tab === 'general' ? 'text-tech-600 border-b-2 border-tech-600' : 'text-gray-500'}`}>Geral</button>
                        <button onClick={() => setTab('cats')} className={`px-6 py-4 font-medium ${tab === 'cats' ? 'text-tech-600 border-b-2 border-tech-600' : 'text-gray-500'}`}>Categorias</button>
                        <button onClick={() => setTab('posts')} className={`px-6 py-4 font-medium ${tab === 'posts' ? 'text-tech-600 border-b-2 border-tech-600' : 'text-gray-500'}`}>Postagens</button>
                    </div>

                    <div className="p-6">
                        {/* TAB: GERAL */}
                        {tab === 'general' && (
                            <div className="max-w-md">
                                <label className="block mb-2 font-medium dark:text-gray-300">Nome do Site</label>
                                <div className="flex gap-2">
                                    <input 
                                        className="flex-1 px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                        value={configTitle}
                                        onChange={(e) => setConfigTitle(e.target.value)}
                                    />
                                    <button 
                                        onClick={() => onSaveConfig(configTitle)}
                                        className="bg-tech-600 text-white px-4 py-2 rounded-lg hover:bg-tech-700"
                                    >
                                        Salvar
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* TAB: CATEGORIAS */}
                        {tab === 'cats' && (
                            <div>
                                <div className="flex gap-2 mb-6 max-w-xl">
                                    <input 
                                        placeholder="Nome da Categoria"
                                        className="flex-1 px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                        value={newCatName}
                                        onChange={(e) => setNewCatName(e.target.value)}
                                    />
                                    <select 
                                        className="px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                        value={newCatParent}
                                        onChange={(e) => setNewCatParent(e.target.value)}
                                    >
                                        <option value="">Raiz (Sem pai)</option>
                                        {categories.filter(c => !c.parentId).map(c => (
                                            <option key={c.id} value={c.id}>{c.name}</option>
                                        ))}
                                    </select>
                                    <button 
                                        onClick={() => {
                                            if(newCatName) {
                                                onAddCategory(newCatName, newCatParent || null);
                                                setNewCatName('');
                                            }
                                        }}
                                        className="bg-tech-600 text-white px-4 py-2 rounded-lg hover:bg-tech-700 flex items-center"
                                    >
                                        <Plus size={18} />
                                    </button>
                                </div>

                                <div className="grid gap-2 max-w-2xl">
                                    {categories.map(cat => (
                                        <div key={cat.id} className="flex justify-between items-center p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                                            <div>
                                                <span className="font-medium dark:text-gray-200">{cat.name}</span>
                                                {cat.parentId && <span className="ml-2 text-xs text-gray-500 px-2 py-1 bg-gray-200 dark:bg-gray-800 rounded-full">Sub-categoria</span>}
                                            </div>
                                            <button onClick={() => onDeleteCategory(cat.id)} className="text-red-500 hover:bg-red-50 p-2 rounded"><Trash2 size={16}/></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB: POSTS */}
                        {tab === 'posts' && (
                            <div>
                                <button 
                                    onClick={() => handleEditPost(null)}
                                    className="mb-6 bg-tech-600 text-white px-4 py-2 rounded-lg hover:bg-tech-700 flex items-center gap-2"
                                >
                                    <Plus size={18} /> Novo Post
                                </button>
                                <div className="space-y-2">
                                    {posts.map(post => (
                                        <div key={post.id} className="flex justify-between items-center p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg border border-gray-100 dark:border-gray-700">
                                            <div>
                                                <p className="font-bold dark:text-white">{post.title}</p>
                                                <p className="text-sm text-gray-500">{new Date(post.createdAt?.seconds * 1000).toLocaleDateString()}</p>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => handleEditPost(post)} className="p-2 text-blue-500 hover:bg-blue-50 rounded"><Edit3 size={18} /></button>
                                                <button onClick={() => onDeletePost(post.id)} className="p-2 text-red-500 hover:bg-red-50 rounded"><Trash2 size={18} /></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB: EDITOR */}
                        {tab === 'editor' && postForm && (
                            <div className="space-y-4">
                                <input 
                                    className="w-full text-xl font-bold px-4 py-2 border-b border-gray-200 dark:border-gray-700 bg-transparent outline-none dark:text-white placeholder-gray-400"
                                    placeholder="Título da Postagem"
                                    value={postForm.title}
                                    onChange={e => setPostForm({...postForm, title: e.target.value})}
                                />
                                
                                <div className="flex gap-4">
                                    <select 
                                        className="px-4 py-2 border rounded-lg bg-white dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                        value={postForm.categoryId}
                                        onChange={e => setPostForm({...postForm, categoryId: e.target.value})}
                                    >
                                        <option value="">Selecione a Categoria</option>
                                        {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                    <div className="text-xs text-gray-400 flex items-center gap-2">
                                        Dica: Use *negrito*, _italico_ e ^codigo^
                                    </div>
                                </div>

                                <textarea 
                                    className="w-full h-64 p-4 border rounded-lg bg-gray-50 dark:bg-gray-900 dark:border-gray-700 dark:text-gray-300 font-mono text-sm focus:ring-2 focus:ring-tech-500 outline-none"
                                    placeholder="Escreva seu conteúdo aqui..."
                                    value={postForm.content}
                                    onChange={e => setPostForm({...postForm, content: e.target.value})}
                                ></textarea>

                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setTab('posts')} className="px-4 py-2 text-gray-500">Cancelar</button>
                                    <button onClick={submitPost} className="px-6 py-2 bg-tech-600 text-white rounded-lg hover:bg-tech-700 font-medium">Salvar Postagem</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
