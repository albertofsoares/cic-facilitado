<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIC Fácil - Portal Acadêmico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        
        :root {
            --bg-main: #f8fafc;
            --text-main: #0f172a;
            --card-bg: #ffffff;
            --accent: #4f46e5;
        }

        .dark-mode {
            --bg-main: #0f172a;
            --text-main: #f1f5f9;
            --card-bg: #1e293b;
            --accent: #818cf8;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .glass-effect { 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(12px); 
        }

        .dark-mode .glass-effect {
            background: rgba(30, 41, 59, 0.8);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 1.5rem;
        }

        .category-pill { cursor: pointer; transition: all 0.2s; }
        .category-active { background-color: var(--accent) !important; color: white !important; }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #06b6d4);
            transition: width 0.5s ease;
        }

        #auth-screen { display: flex; }
        #main-app { display: none; }
        .hidden { display: none !important; }

        /* Loader */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4f46e5;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen">

    <!-- TELA DE AUTENTICAÇÃO (LOGIN/CADASTRO) -->
    <div id="auth-screen" class="fixed inset-0 z-[200] bg-slate-900 flex items-center justify-center p-6">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl w-full max-w-md shadow-2xl">
            <div class="text-center mb-8">
                <div class="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center text-white mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <h2 id="auth-title" class="text-2xl font-bold">CIC Fácil</h2>
                <p id="auth-subtitle" class="text-slate-500">Acesse seu material de apoio</p>
            </div>
            
            <div class="space-y-4">
                <input type="email" id="auth-email" placeholder="E-mail acadêmico" class="w-full p-4 bg-slate-100 dark:bg-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                <input type="password" id="auth-password" placeholder="Sua senha" class="w-full p-4 bg-slate-100 dark:bg-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                
                <button id="btn-login" onclick="handleAuth('login')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition flex justify-center items-center gap-2">
                    <span id="login-text">Entrar</span>
                </button>
                <button id="btn-register" onclick="handleAuth('register')" class="w-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold py-4 rounded-xl transition">
                    <span id="register-text">Criar conta gratuita</span>
                </button>
            </div>
            
            <div id="auth-error" class="mt-4 text-rose-500 text-sm text-center hidden p-3 bg-rose-50 dark:bg-rose-900/20 rounded-lg"></div>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="main-app">
        <!-- Barra de Progresso Superior -->
        <div class="fixed top-0 left-0 w-full h-1 z-[60] bg-slate-200 dark:bg-slate-700">
            <div id="top-progress-fill" class="progress-fill" style="width: 0%"></div>
        </div>

        <header class="border-b border-slate-200 sticky top-0 z-50 glass-effect">
            <div class="max-w-5xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <div class="bg-indigo-600 p-2 rounded-lg text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/></svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight">CIC Fácil</h1>
                        <p id="user-display" class="text-slate-500 text-xs">Carregando...</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Buscar assunto..." class="bg-slate-100 border-none rounded-full px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none w-full md:w-64 dark:bg-slate-800">
                    
                    <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                        <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                    </button>

                    <button id="admin-panel-btn" onclick="toggleAdminPanel()" class="hidden bg-slate-800 text-white px-4 py-2 rounded-full text-xs font-bold">ADMIN</button>
                    <button onclick="handleSignOut()" class="text-slate-400 hover:text-rose-500 p-2"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
                </div>
            </div>
        </header>

        <main class="max-w-5xl mx-auto px-6 pt-8 pb-20">
            <!-- Estatísticas Pessoais -->
            <div class="mb-8 p-6 card">
                <div class="flex justify-between items-end mb-2">
                    <div>
                        <h3 class="font-bold">Seu Progresso Individual</h3>
                        <p class="text-xs text-slate-500">Total de assuntos concluídos</p>
                    </div>
                    <span id="progress-text" class="text-indigo-600 font-black text-2xl">0%</span>
                </div>
                <div class="h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                    <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                </div>
            </div>

            <!-- Painel Admin (Apenas para o professor/líder) -->
            <section id="admin-section" class="mb-10 p-6 bg-indigo-50 dark:bg-slate-800 rounded-3xl border-2 border-dashed border-indigo-200 dark:border-indigo-900 hidden">
                <h2 class="text-xl font-bold mb-4">🚀 Novo Assunto da Turma</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <input type="text" id="post-title" placeholder="Título" class="p-3 rounded-xl border-none outline-none dark:bg-slate-700">
                    <input type="text" id="post-category" placeholder="Categoria (ex: Arquitetura)" class="p-3 rounded-xl border-none outline-none dark:bg-slate-700">
                </div>
                <div id="post-content" contenteditable="true" class="bg-white dark:bg-slate-700 p-4 rounded-xl min-h-[100px] mb-4 outline-none border focus:border-indigo-500"></div>
                <button onclick="createNewPost()" class="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold">Publicar para Todos</button>
            </section>

            <!-- Filtros -->
            <div class="flex flex-wrap gap-2 mb-8" id="category-list"></div>

            <!-- Feed -->
            <div id="posts-feed" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </main>
    </div>

    <!-- Modal de Conteúdo -->
    <div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-[100] backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-3xl w-full shadow-2xl overflow-hidden relative flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-4 border-b dark:border-slate-800">
                <div id="modal-category" class="text-xs font-black uppercase text-indigo-500 ml-4"></div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-rose-500 text-2xl w-10 h-10">✕</button>
            </div>
            <div class="p-8 overflow-y-auto" id="modal-body">
                <h2 id="modal-title" class="text-3xl font-black mb-6"></h2>
                <div id="modal-text" class="prose dark:prose-invert max-w-none mb-10 text-slate-600 dark:text-slate-300"></div>
                
                <!-- Área de Anotações Pessoais -->
                <div class="mt-8 border-t dark:border-slate-800 pt-8">
                    <h3 class="font-bold flex items-center gap-2 mb-4 text-indigo-600">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        Minhas Anotações (Privado)
                    </h3>
                    <textarea id="personal-note" oninput="saveNoteLocally()" class="w-full h-32 p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl border-none outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="O que você aprendeu sobre esse assunto? Suas anotações são salvas apenas para você..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cic-facil-app';

        let currentUser = null;
        let userProgress = { lidos: [], notas: {} };
        let allPosts = [];
        let currentPostId = null;

        // --- AUTENTICAÇÃO ---
        window.handleAuth = async (type) => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errorEl = document.getElementById('auth-error');
            const loginBtn = document.getElementById('btn-login');
            const registerBtn = document.getElementById('btn-register');
            
            errorEl.classList.add('hidden');
            if(!email || !password) {
                errorEl.innerText = "Preencha e-mail e senha.";
                errorEl.classList.remove('hidden');
                return;
            }

            // Desabilita botões durante o processo
            loginBtn.disabled = true;
            registerBtn.disabled = true;
            const originalLoginText = document.getElementById('login-text').innerText;
            const originalRegisterText = document.getElementById('register-text').innerText;

            try {
                if(type === 'login') {
                    document.getElementById('login-text').innerText = "Acessando...";
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    document.getElementById('register-text').innerText = "Criando conta...";
                    await createUserWithEmailAndPassword(auth, email, password);
                    // Opcional: Avisar que a conta foi criada com sucesso antes de logar
                }
            } catch (error) {
                console.error("Erro na autenticação:", error.code);
                let message = "Ocorreu um erro inesperado.";
                
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        message = "Este e-mail já está em uso.";
                        break;
                    case 'auth/invalid-email':
                        message = "E-mail inválido.";
                        break;
                    case 'auth/weak-password':
                        message = "A senha deve ter pelo menos 6 caracteres.";
                        break;
                    case 'auth/user-not-found':
                    case 'auth/wrong-password':
                    case 'auth/invalid-credential':
                        message = "E-mail ou senha incorretos.";
                        break;
                    default:
                        message = "Erro ao processar: " + error.message;
                }
                
                errorEl.innerText = message;
                errorEl.classList.remove('hidden');
                
                // Restaura textos em caso de erro
                document.getElementById('login-text').innerText = originalLoginText;
                document.getElementById('register-text').innerText = originalRegisterText;
            } finally {
                loginBtn.disabled = false;
                registerBtn.disabled = false;
            }
        };

        window.handleSignOut = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('user-display').innerText = `Logado como: ${user.email}`;
                
                const userDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'progress');
                
                // Primeiro tenta ler o documento uma vez
                const docSnap = await getDoc(userDocRef);
                if (!docSnap.exists()) {
                    await setDoc(userDocRef, { lidos: [], notas: {} });
                }

                // Inicia o listener de tempo real
                onSnapshot(userDocRef, (doc) => {
                    if (doc.exists()) {
                        userProgress = doc.data();
                    }
                    renderApp();
                }, (error) => console.error("Erro ao ler progresso:", error));

                const postsRef = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
                onSnapshot(postsRef, (snapshot) => {
                    allPosts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderApp();
                }, (error) => console.error("Erro ao ler posts:", error));

                if(user.email.includes('admin@')) {
                    document.getElementById('admin-panel-btn').classList.remove('hidden');
                }

            } else {
                currentUser = null;
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('main-app').style.display = 'none';
                // Reset de formulários
                document.getElementById('login-text').innerText = "Entrar";
                document.getElementById('register-text').innerText = "Criar conta gratuita";
            }
        });

        // --- FUNÇÕES DE DADOS ---
        window.createNewPost = async () => {
            const title = document.getElementById('post-title').value;
            const cat = document.getElementById('post-category').value;
            const content = document.getElementById('post-content').innerHTML;

            if(!title || !content) return;

            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), {
                titulo: title,
                categoria: cat || "Geral",
                conteudo: content,
                data: new Date().toLocaleDateString('pt-BR'),
                resumo: content.replace(/<[^>]*>/g, '').substring(0, 100) + '...'
            });

            document.getElementById('post-title').value = '';
            document.getElementById('post-category').value = '';
            document.getElementById('post-content').innerHTML = '';
            toggleAdminPanel();
        };

        window.togglePostStatus = async (postId, event) => {
            if(event) event.stopPropagation();
            if(!currentUser) return;

            let lidos = [...(userProgress.lidos || [])];
            if(lidos.includes(postId)) {
                lidos = lidos.filter(id => id !== postId);
            } else {
                lidos.push(postId);
            }

            const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'settings', 'progress');
            await updateDoc(userDocRef, { lidos: lidos });
        };

        window.saveNoteLocally = async () => {
            if(!currentPostId || !currentUser) return;
            const noteText = document.getElementById('personal-note').value;
            
            const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'settings', 'progress');
            const newNotas = { ...(userProgress.notas || {}) };
            newNotas[currentPostId] = noteText;
            
            await updateDoc(userDocRef, { notas: newNotas });
        };

        // --- RENDERIZAÇÃO ---
        window.renderApp = () => {
            renderCategories();
            renderPosts();
            updateProgress();
        };

        function renderCategories() {
            const cats = ["Todas", ...new Set(allPosts.map(p => p.categoria))];
            document.getElementById('category-list').innerHTML = cats.map(cat => `
                <span onclick="window.filtrarCategoria('${cat}')" class="category-pill px-5 py-2 rounded-full text-sm font-semibold border ${window.categoriaAtiva === cat ? 'category-active' : 'bg-white dark:bg-slate-800'}">${cat}</span>
            `).join('');
        }

        function renderPosts() {
            const feed = document.getElementById('posts-feed');
            let filtrados = allPosts;
            if(window.categoriaAtiva && window.categoriaAtiva !== "Todas") filtrados = filtrados.filter(p => p.categoria === window.categoriaAtiva);
            if(window.buscaAtiva) filtrados = filtrados.filter(p => p.titulo.toLowerCase().includes(window.buscaAtiva));

            if (filtrados.length === 0) {
                feed.innerHTML = `<div class="col-span-full p-10 text-center text-slate-400">Nenhum assunto encontrado.</div>`;
                return;
            }

            feed.innerHTML = filtrados.map(post => {
                const lido = (userProgress.lidos || []).includes(post.id);
                return `
                    <div class="card p-6 shadow-sm hover:shadow-lg transition-all cursor-pointer group" onclick="window.openPost('${post.id}')">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[10px] font-black uppercase px-2 py-1 rounded bg-indigo-50 text-indigo-600 dark:bg-indigo-900/30">${post.categoria}</span>
                            <button onclick="window.togglePostStatus('${post.id}', event)" class="text-xs ${lido ? 'text-green-500 font-bold' : 'text-slate-300'}">
                                ${lido ? '✅ Concluído' : '⚪ Marcar'}
                            </button>
                        </div>
                        <h3 class="text-xl font-bold mb-2 group-hover:text-indigo-600">${post.titulo}</h3>
                        <p class="text-slate-500 text-sm line-clamp-2 mb-4">${post.resumo}</p>
                        <div class="flex justify-between items-center text-[10px] text-slate-400">
                            <span>${post.data}</span>
                            <span class="font-bold text-indigo-500">LER AGORA →</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateProgress() {
            const total = allPosts.length;
            const concluidos = (userProgress.lidos || []).length;
            const perc = total === 0 ? 0 : Math.round((concluidos / total) * 100);
            
            document.getElementById('progress-fill').style.width = perc + '%';
            document.getElementById('top-progress-fill').style.width = perc + '%';
            document.getElementById('progress-text').innerText = perc + '%';
        }

        window.openPost = (id) => {
            const post = allPosts.find(p => p.id === id);
            if(!post) return;
            currentPostId = id;
            document.getElementById('modal-title').innerText = post.titulo;
            document.getElementById('modal-category').innerText = post.categoria;
            document.getElementById('modal-text').innerHTML = post.conteudo;
            document.getElementById('personal-note').value = (userProgress.notas || {})[id] || "";
            
            document.getElementById('modal').classList.replace('hidden', 'flex');
            document.body.style.overflow = 'hidden';
        };

        window.closeModal = () => {
            document.getElementById('modal').classList.replace('flex', 'hidden');
            document.body.style.overflow = 'auto';
            currentPostId = null;
        };

        window.filtrarCategoria = (cat) => {
            window.categoriaAtiva = cat;
            renderApp();
        };

        window.handleSearch = (val) => {
            window.buscaAtiva = val.toLowerCase();
            renderPosts();
        };

        window.toggleAdminPanel = () => {
            document.getElementById('admin-section').classList.toggle('hidden');
        };

        window.toggleDarkMode = () => {
            document.body.classList.toggle('dark-mode');
        };
    </script>
</body>
</html>
