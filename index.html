<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Study Hub</title>
    
    <!-- Tailwind CSS (Framework de Estilo) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Rajdhani (Tech) e Inter (Leitura) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Ícones (Phosphor Icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Configuração do Tailwind para Cores Personalizadas -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        tech: ['Rajdhani', 'sans-serif'],
                    },
                    colors: {
                        tech: {
                            light: '#f0f9ff', // Azul claríssimo para fundo claro
                            dark: '#0f172a',  // Azul escuro profundo para fundo escuro
                            accent: '#0ea5e9', // Azul elétrico
                            darkAccent: '#22d3ee' // Ciano neon
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Estilos globais e utilitários */
        body {
            transition: background-color 0.3s, color 0.3s;
        }
        /* Classe para preservar quebras de linha e espaços nos posts */
        .rich-text {
            white-space: pre-wrap; 
            line-height: 1.6;
        }
        /* Animação suave para o modal */
        .modal-enter {
            opacity: 0;
            transform: scale(0.95);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: all 0.2s ease-out;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col">

    <!-- ================================================================== -->
    <!-- TELA DE LOGIN -->
    <!-- ================================================================== -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-100 dark:bg-slate-900 transition-opacity duration-500">
        <div class="w-full max-w-md p-8 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700">
            <h1 class="text-4xl font-tech font-bold text-center text-blue-600 dark:text-cyan-400 mb-2">CS STUDY HUB</h1>
            <p class="text-center text-gray-500 dark:text-gray-400 mb-8 font-tech text-lg">Ambiente de Estudo Colaborativo</p>
            
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" id="email" class="w-full p-3 rounded-lg bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="seu@email.com" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Senha</label>
                    <input type="password" id="password" class="w-full p-3 rounded-lg bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="******" required>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" id="btn-login" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-tech font-bold transition">ENTRAR</button>
                    <button type="button" id="btn-signup" class="flex-1 py-3 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-lg font-tech font-bold transition">CADASTRAR</button>
                </div>
                <p id="auth-error" class="text-red-500 text-center text-sm hidden"></p>
                <p class="text-xs text-center text-gray-400 mt-4">Use @admin.com para acesso administrativo.</p>
            </form>
        </div>
    </div>

    <!-- ================================================================== -->
    <!-- APLICAÇÃO PRINCIPAL (Escondida até login) -->
    <!-- ================================================================== -->
    <div id="app-container" class="hidden flex flex-col min-h-screen">
        
        <!-- CABEÇALHO -->
        <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200 dark:border-slate-700">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <!-- Logo -->
                <div class="flex items-center gap-2">
                    <i class="ph ph-cpu text-3xl text-blue-600 dark:text-cyan-400"></i>
                    <span id="header-title" class="font-tech text-2xl font-bold tracking-wide">CS HUB</span>
                </div>

                <!-- Controles -->
                <div class="flex items-center gap-4">
                    <!-- Menu Importante -->
                    <div class="relative group">
                        <button id="btn-important" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400 font-tech font-bold hover:brightness-95 transition">
                            <i class="ph ph-warning-circle text-lg"></i>
                            IMPORTANTE
                        </button>
                        
                        <!-- Dropdown Importante -->
                        <div id="important-dropdown" class="hidden absolute top-full right-0 mt-2 w-80 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-600 p-4 z-50">
                            <h3 class="font-tech text-lg font-bold mb-3 text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-700 pb-2">Conceitos Chave</h3>
                            <div id="important-list" class="space-y-3 max-h-64 overflow-y-auto custom-scrollbar">
                                <!-- Lista de itens importantes será inserida aqui via JS -->
                            </div>
                            
                            <!-- Área Admin para adicionar notas -->
                            <div id="admin-important-controls" class="hidden mt-3 pt-3 border-t border-slate-200 dark:border-slate-700">
                                <input type="text" id="new-note-input" placeholder="Novo conceito: Descrição" class="w-full text-sm p-2 rounded bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 mb-2">
                                <button onclick="addImportantNote()" class="w-full py-1 bg-green-600 text-white text-xs rounded font-bold hover:bg-green-700">ADICIONAR NOTA</button>
                            </div>
                        </div>
                    </div>

                    <!-- Botão Tema -->
                    <button id="theme-toggle" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition text-slate-600 dark:text-slate-300">
                        <i class="ph ph-moon text-xl dark:hidden"></i>
                        <i class="ph ph-sun text-xl hidden dark:block"></i>
                    </button>
                    
                    <!-- Botão Sair -->
                    <button id="btn-logout" class="text-sm font-tech font-bold text-red-500 hover:text-red-600">SAIR</button>
                </div>
            </div>
        </header>

        <!-- BARRA DE PROGRESSO -->
        <div class="bg-slate-200 dark:bg-slate-950 h-1.5 w-full">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-blue-500 to-cyan-400 w-0 transition-all duration-500"></div>
        </div>
        <div class="text-center text-xs text-slate-500 dark:text-slate-400 py-1 bg-slate-100 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 font-tech">
            Progresso do Estudo: <span id="progress-text">0%</span>
        </div>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-1 max-w-7xl mx-auto px-4 py-8 w-full">
            
            <!-- Painel Admin (Apenas Visível para Admins) -->
            <div id="admin-panel" class="hidden mb-12 bg-white dark:bg-slate-800 p-6 rounded-2xl border-l-4 border-blue-500 shadow-lg">
                <h2 class="text-2xl font-tech font-bold mb-4 flex items-center gap-2">
                    <i class="ph ph-pencil-simple-line"></i> Painel do Administrador
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="post-title" placeholder="Título do Post" class="p-3 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 outline-none">
                    <input type="text" id="post-category" placeholder="Categoria (ex: Algoritmos, Hardware)" class="p-3 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 outline-none">
                    <input type="text" id="post-summary" placeholder="Breve Resumo (aparece no card)" class="md:col-span-2 p-3 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 outline-none">
                    <textarea id="post-content" rows="6" placeholder="Conteúdo Completo.&#10;Use Enter para pular linhas.&#10;Espaços são respeitados." class="md:col-span-2 p-3 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 outline-none font-mono text-sm"></textarea>
                </div>
                <div class="mt-4 flex justify-end gap-3">
                    <button onclick="clearAdminForm()" class="px-4 py-2 text-slate-500 hover:text-slate-700 font-tech font-bold">LIMPAR</button>
                    <button onclick="savePost()" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-tech font-bold shadow-lg shadow-blue-500/30">PUBLICAR POST</button>
                </div>
            </div>

            <!-- Filtros de Categoria -->
            <div id="category-filters" class="flex flex-wrap gap-2 mb-8 justify-center">
                <!-- Botões de categoria gerados dinamicamente aqui -->
            </div>

            <!-- Grid de Posts -->
            <div id="posts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Posts serão inseridos aqui -->
                <div class="col-span-full text-center py-20 text-slate-400 dark:text-slate-600 animate-pulse">
                    Carregando conteúdo do grupo...
                </div>
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-6 text-center">
            <p class="font-tech text-slate-500 dark:text-slate-400">Desenvolvido para Turma de CC &bull; Anhanguera</p>
        </footer>
    </div>

    <!-- ================================================================== -->
    <!-- MODAL DE LEITURA (Janela Flutuante) -->
    <!-- ================================================================== -->
    <div id="read-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm" onclick="closeModal(event)">
        <div class="bg-white dark:bg-slate-800 w-full max-w-4xl max-h-[85vh] rounded-2xl shadow-2xl overflow-hidden flex flex-col relative" onclick="event.stopPropagation()">
            
            <!-- Header do Modal -->
            <div class="p-6 border-b border-slate-200 dark:border-slate-700 flex justify-between items-start bg-slate-50 dark:bg-slate-900/50">
                <div>
                    <span id="modal-category" class="text-xs font-bold uppercase tracking-wider text-blue-500 dark:text-cyan-400 mb-1 block">Categoria</span>
                    <h2 id="modal-title" class="text-3xl font-tech font-bold text-slate-800 dark:text-white">Título do Post</h2>
                </div>
                <button onclick="closeModal(null)" class="p-2 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full transition">
                    <i class="ph ph-x text-2xl"></i>
                </button>
            </div>

            <!-- Corpo do Modal (Scrollável) -->
            <div class="p-8 overflow-y-auto custom-scrollbar bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                <div id="modal-content" class="rich-text text-lg">
                    <!-- Conteúdo completo injetado aqui -->
                </div>
            </div>

            <!-- Footer do Modal -->
            <div class="p-4 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 flex justify-end">
                <button onclick="closeModal(null)" class="px-6 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-lg font-bold transition">Fechar</button>
            </div>
        </div>
    </div>

    <!-- ================================================================== -->
    <!-- JAVASCRIPT & FIREBASE -->
    <!-- ================================================================== -->
    <script type="module">
        // ------------------------------------------------------------------
        // CONFIGURAÇÃO FÁCIL (EDITAR AQUI TÍTULOS E CORES BÁSICAS)
        // ------------------------------------------------------------------
        const APP_CONFIG = {
            siteName: "CC STUDY HUB",
            adminDomain: "@admin.com" // Usuários com este domínio serão admins
        };

        document.getElementById('header-title').innerText = APP_CONFIG.siteName;

        // ------------------------------------------------------------------
        // IMPORTAÇÕES DO FIREBASE (CDN)
        // ------------------------------------------------------------------
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURAÇÃO DO FIREBASE (A SUA CONFIGURAÇÃO)
        const firebaseConfig = {
            apiKey: "AIzaSyAHDSu3C39lJPkMtacpHoLNXn3aphXpRvA",
            authDomain: "cic-ead.firebaseapp.com",
            projectId: "cic-ead",
            storageBucket: "cic-ead.firebasestorage.app",
            messagingSenderId: "224684609703",
            appId: "1:224684609703:web:52fce7f22501300a2b0b82"
        };

        // INICIALIZANDO APP
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // VARIÁVEIS DE ESTADO GLOBAIS
        let currentUser = null;
        let allPosts = [];
        let allNotes = [];

        // ------------------------------------------------------------------
        // SISTEMA DE AUTENTICAÇÃO
        // ------------------------------------------------------------------
        const loginScreen = document.getElementById('login-screen');
        const appContainer = document.getElementById('app-container');
        const adminPanel = document.getElementById('admin-panel');
        const adminImportantControls = document.getElementById('admin-important-controls');

        // Monitorar estado do login
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => loginScreen.style.display = 'none', 500);
                appContainer.classList.remove('hidden');
                
                // Verificar Admin
                if (user.email.endsWith(APP_CONFIG.adminDomain)) {
                    adminPanel.classList.remove('hidden');
                    adminImportantControls.classList.remove('hidden');
                } else {
                    adminPanel.classList.add('hidden');
                    adminImportantControls.classList.add('hidden');
                }
                
                // Carregar dados
                loadPosts();
                loadImportantNotes();
                updateProgressBar();
            } else {
                currentUser = null;
                loginScreen.style.display = 'flex';
                loginScreen.classList.remove('opacity-0', 'pointer-events-none');
                appContainer.classList.add('hidden');
            }
        });

        // Login
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                showError("Erro ao entrar: " + error.message);
            }
        });

        // Cadastro
        document.getElementById('btn-signup').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
                alert("Conta criada com sucesso!");
            } catch (error) {
                showError("Erro ao cadastrar: " + error.message);
            }
        });

        // Logout
        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        function showError(msg) {
            const errEl = document.getElementById('auth-error');
            errEl.innerText = msg;
            errEl.classList.remove('hidden');
        }

        // ------------------------------------------------------------------
        // LÓGICA DE POSTS (LEITURA E ADMIN)
        // ------------------------------------------------------------------
        
        // Carregar Posts do Firestore
        function loadPosts() {
            const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));
            
            onSnapshot(q, (snapshot) => {
                const postsGrid = document.getElementById('posts-grid');
                postsGrid.innerHTML = ''; // Limpar
                allPosts = [];
                const categories = new Set();

                snapshot.forEach((docSnap) => {
                    const post = { id: docSnap.id, ...docSnap.data() };
                    allPosts.push(post);
                    categories.add(post.category);
                    renderPostCard(post, postsGrid);
                });

                if(allPosts.length === 0) {
                    postsGrid.innerHTML = '<div class="col-span-full text-center text-slate-500">Nenhum post encontrado.</div>';
                }

                updateCategoryFilters(categories);
                updateProgressBar(); // Recalcular barra baseada no total de posts
            });
        }

        // Renderizar Card do Post
        function renderPostCard(post, container) {
            const isRead = localStorage.getItem(`read_${post.id}`) === 'true';
            const isAdmin = currentUser && currentUser.email.endsWith(APP_CONFIG.adminDomain);

            const card = document.createElement('div');
            card.className = `bg-white dark:bg-slate-800 rounded-xl p-6 shadow-md hover:shadow-xl transition border border-slate-100 dark:border-slate-700 flex flex-col h-full relative group ${isRead ? 'opacity-75' : ''}`;
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-bold uppercase text-blue-500 dark:text-cyan-400 bg-blue-50 dark:bg-slate-900 px-2 py-1 rounded">${post.category}</span>
                    <input type="checkbox" onchange="toggleRead('${post.id}', this)" ${isRead ? 'checked' : ''} class="w-5 h-5 cursor-pointer accent-green-500" title="Marcar como lido">
                </div>
                <h3 class="text-xl font-tech font-bold text-slate-800 dark:text-white mb-2 leading-tight">${post.title}</h3>
                <p class="text-slate-600 dark:text-slate-400 text-sm mb-4 flex-1">${post.summary}</p>
                
                <div class="flex gap-2 mt-auto">
                    <button onclick="openModal('${post.id}')" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg text-sm font-bold transition">
                        LER CONTEÚDO
                    </button>
                    ${isAdmin ? `
                        <button onclick="deletePost('${post.id}')" class="px-3 py-2 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-lg hover:bg-red-200 dark:hover:bg-red-900/50 transition">
                            <i class="ph ph-trash"></i>
                        </button>
                    ` : ''}
                </div>
            `;
            container.appendChild(card);
        }

        // Função Global para Salvar Post (Admin)
        window.savePost = async function() {
            const title = document.getElementById('post-title').value;
            const category = document.getElementById('post-category').value;
            const summary = document.getElementById('post-summary').value;
            const content = document.getElementById('post-content').value;

            if (!title || !content) return alert("Título e Conteúdo são obrigatórios.");

            try {
                await addDoc(collection(db, "posts"), {
                    title, category, summary, content,
                    timestamp: Date.now()
                });
                clearAdminForm();
                alert("Post publicado com sucesso!");
            } catch (e) {
                console.error("Erro ao salvar:", e);
                alert("Erro ao salvar post.");
            }
        };

        // Função Global para Deletar Post
        window.deletePost = async function(id) {
            if(confirm("Tem certeza que deseja deletar este post?")) {
                await deleteDoc(doc(db, "posts", id));
            }
        };

        window.clearAdminForm = function() {
            document.getElementById('post-title').value = '';
            document.getElementById('post-category').value = '';
            document.getElementById('post-summary').value = '';
            document.getElementById('post-content').value = '';
        }

        // Gerar Filtros
        function updateCategoryFilters(categories) {
            const container = document.getElementById('category-filters');
            container.innerHTML = `<button onclick="filterPosts('all')" class="px-4 py-1 rounded-full bg-blue-600 text-white font-tech text-sm hover:opacity-90">TODOS</button>`;
            
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "px-4 py-1 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-tech text-sm hover:bg-blue-100 dark:hover:bg-slate-600 transition";
                btn.innerText = cat.toUpperCase();
                btn.onclick = () => filterPosts(cat);
                container.appendChild(btn);
            });
        }

        window.filterPosts = function(category) {
            const postsGrid = document.getElementById('posts-grid');
            postsGrid.innerHTML = '';
            
            const filtered = category === 'all' ? allPosts : allPosts.filter(p => p.category === category);
            filtered.forEach(post => renderPostCard(post, postsGrid));
        }

        // ------------------------------------------------------------------
        // SISTEMA DE MODAL (JANELA FLUTUANTE)
        // ------------------------------------------------------------------
        window.openModal = function(postId) {
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;

            document.getElementById('modal-title').innerText = post.title;
            document.getElementById('modal-category').innerText = post.category;
            // O conteúdo é injetado como texto para segurança, mas preservando formatação via CSS
            document.getElementById('modal-content').innerText = post.content;

            const modal = document.getElementById('read-modal');
            modal.classList.remove('hidden');
            modal.classList.add('modal-enter-active');
        }

        window.closeModal = function(e) {
            // Se e for null, fechamento forçado pelo botão. Se não, verifica se clicou no fundo
            if (e && e.target !== e.currentTarget) return;
            
            document.getElementById('read-modal').classList.add('hidden');
        }

        // ------------------------------------------------------------------
        // BARRA DE PROGRESSO & CHECKLIST
        // ------------------------------------------------------------------
        window.toggleRead = function(id, checkbox) {
            localStorage.setItem(`read_${id}`, checkbox.checked);
            updateProgressBar();
            // Atualiza visualmente o card sem recarregar tudo
            const card = checkbox.closest('.group');
            if(checkbox.checked) card.classList.add('opacity-75');
            else card.classList.remove('opacity-75');
        }

        function updateProgressBar() {
            if (allPosts.length === 0) return;
            
            let readCount = 0;
            allPosts.forEach(post => {
                if(localStorage.getItem(`read_${post.id}`) === 'true') readCount++;
            });

            const percentage = Math.round((readCount / allPosts.length) * 100);
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-text').innerText = `${percentage}% Concluído`;
        }

        // ------------------------------------------------------------------
        // MENU IMPORTANTE & TEMA
        // ------------------------------------------------------------------
        
        // Toggle Dropdown Importante
        const btnImportant = document.getElementById('btn-important');
        const dropdownImportant = document.getElementById('important-dropdown');
        
        btnImportant.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownImportant.classList.toggle('hidden');
        });

        // Fechar dropdown ao clicar fora
        document.addEventListener('click', (e) => {
            if (!dropdownImportant.contains(e.target) && e.target !== btnImportant) {
                dropdownImportant.classList.add('hidden');
            }
        });

        // Carregar Notas Importantes
        function loadImportantNotes() {
            const q = query(collection(db, "important_notes"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('important-list');
                list.innerHTML = '';
                snapshot.forEach(docSnap => {
                    const note = docSnap.data();
                    const item = document.createElement('div');
                    item.className = "p-2 bg-slate-50 dark:bg-slate-700/50 rounded border border-slate-100 dark:border-slate-700 text-sm relative group";
                    item.innerHTML = `
                        <p class="text-slate-700 dark:text-slate-300">${note.text}</p>
                        ${currentUser && currentUser.email.endsWith(APP_CONFIG.adminDomain) ? `
                            <button onclick="deleteNote('${docSnap.id}')" class="absolute top-1 right-1 text-red-400 opacity-0 group-hover:opacity-100 transition"><i class="ph ph-x-circle"></i></button>
                        ` : ''}
                    `;
                    list.appendChild(item);
                });
            });
        }

        window.addImportantNote = async function() {
            const input = document.getElementById('new-note-input');
            const text = input.value;
            if(!text) return;
            
            await addDoc(collection(db, "important_notes"), { text, timestamp: Date.now() });
            input.value = '';
        }

        window.deleteNote = async function(id) {
            await deleteDoc(doc(db, "important_notes", id));
        }

        // Alternar Tema (Dark/Light)
        const themeBtn = document.getElementById('theme-toggle');
        
        // Checar preferência salva ou do sistema
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        themeBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                localStorage.theme = 'dark';
            } else {
                localStorage.theme = 'light';
            }
        });

    </script>
</body>
</html>
