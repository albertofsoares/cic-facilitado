<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIC EAD</title>
    <!-- Fontes Tech e Leitura -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        techBlue: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                            950: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js" type="module"></script>
    <style>
        body { font-family: 'Inter', sans-serif; letter-spacing: -0.01em; }
        .modal-overlay { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); }
        .post-content { white-space: pre-wrap; line-height: 1.8; }
        .progress-bar { transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        /* High Tech Glassmorphism */
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .dark .glass { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(30, 58, 138, 0.3); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#f8fafc] dark:bg-[#020617] min-h-screen text-slate-900 dark:text-slate-100 transition-colors duration-500">

    <!-- LOGIN SCREEN -->
    <div id="auth-screen" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-techBlue-50 dark:bg-techBlue-950">
        <div class="max-w-md w-full glass p-10 rounded-[3rem] shadow-2xl text-center">
            <div class="mb-6 flex justify-center">
                <div class="w-20 h-20 bg-techBlue-600 rounded-3xl flex items-center justify-center text-4xl shadow-lg shadow-blue-500/30">🎓</div>
            </div>
            <h2 class="text-4xl font-black tracking-tighter mb-2">CIC Cloud</h2>
            <p class="text-slate-500 dark:text-slate-400 font-medium mb-8">Repositório de Inteligência Acadêmica</p>
            <form id="auth-form" class="space-y-4">
                <input type="email" id="email" placeholder="E-mail" required class="w-full px-6 py-4 rounded-2xl border-2 border-slate-200 dark:border-techBlue-900 bg-white dark:bg-slate-900 focus:border-techBlue-600 outline-none transition-all font-semibold">
                <input type="password" id="password" placeholder="Senha" required class="w-full px-6 py-4 rounded-2xl border-2 border-slate-200 dark:border-techBlue-900 bg-white dark:bg-slate-900 focus:border-techBlue-600 outline-none transition-all font-semibold">
                <button type="submit" id="auth-btn" class="w-full bg-techBlue-600 text-white py-4 rounded-2xl font-black text-lg hover:bg-techBlue-700 hover:shadow-xl hover:shadow-blue-500/20 active:scale-95 transition-all uppercase tracking-widest">Entrar no Terminal</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app" class="hidden">
        <header class="sticky top-0 z-50 glass border-b">
            <div class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-techBlue-600 rounded-xl flex items-center justify-center font-black text-white shadow-lg">CIC</div>
                    <div>
                        <h1 class="text-lg font-black leading-tight uppercase tracking-tighter">Material de Apoio</h1>
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Ciência da Computação - EAD</span>
                        </div>
                    </div>
                </div>

                <!-- MENU DE AÇÕES (LADO DIREITO) -->
                <div class="flex items-center gap-3">
                    <!-- MENU IMPORTANTE REPOSICIONADO -->
                    <div class="relative group">
                        <button id="important-menu-btn" class="flex items-center gap-2 bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300 px-5 py-2 rounded-full font-black text-xs uppercase tracking-widest hover:scale-105 transition-all">
                            <span>⚡</span> Importante
                        </button>
                        <!-- Dropdown Balão -->
                        <div id="important-dropdown" class="hidden absolute top-full right-0 mt-4 w-72 glass rounded-[2rem] shadow-2xl p-6 border-amber-200 dark:border-amber-900/50">
                            <div class="flex justify-between items-center mb-4">
                                <h4 class="font-black text-[10px] uppercase tracking-widest">Conceitos Chave</h4>
                                <button id="add-important-btn" class="hidden text-amber-600 font-bold text-lg">+</button>
                            </div>
                            <div id="important-list" class="space-y-4 max-h-60 overflow-y-auto pr-2">
                                <!-- Itens de importância aqui -->
                            </div>
                        </div>
                    </div>

                    <button id="theme-toggle" class="w-11 h-11 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-xl border">🌙</button>
                    
                    <div class="hidden sm:block text-right border-l pl-3 dark:border-slate-800">
                        <p id="user-display" class="text-[9px] font-black opacity-50 truncate max-w-[120px]"></p>
                        <button id="logout-btn" class="text-[10px] font-black text-rose-500 uppercase tracking-widest hover:underline">Sair</button>
                    </div>
                </div>
            </div>
            <!-- Barra de Progresso High-Tech -->
            <div class="w-full bg-slate-100 dark:bg-slate-900 h-1 relative">
                <div id="main-progress" class="progress-bar absolute h-full bg-techBlue-600 shadow-[0_0_15px_#2563eb]"></div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-6 py-10 grid grid-cols-1 lg:grid-cols-12 gap-10">
            <!-- SIDEBAR -->
            <aside class="lg:col-span-3 space-y-8">
                <!-- BUSCA -->
                <div class="relative group">
                    <input type="text" id="search-input" placeholder="Buscar material..." class="w-full bg-white dark:bg-slate-900 border-2 border-slate-100 dark:border-techBlue-900/50 rounded-2xl px-6 py-4 pl-12 outline-none focus:border-techBlue-600 transition-all font-bold text-sm shadow-sm group-hover:shadow-md">
                    <span class="absolute left-5 top-1/2 -translate-y-1/2 opacity-30 group-focus-within:opacity-100 transition-opacity">🔍</span>
                </div>

                <div id="admin-panel" class="hidden bg-techBlue-950 p-8 rounded-[2.5rem] shadow-2xl border border-techBlue-800/50">
                    <h3 class="text-white font-black text-xs uppercase tracking-[0.2em] mb-6 flex items-center gap-2">
                        <span class="w-2 h-2 bg-indigo-500 rounded-full"></span> Admin Console
                    </h3>
                    <button id="open-post-modal" class="w-full bg-techBlue-600 text-white py-4 rounded-2xl font-black text-xs tracking-widest hover:bg-techBlue-50 transition-all shadow-lg">
                        + NOVO REGISTRO
                    </button>
                </div>

                <nav class="space-y-4">
                    <h3 class="font-black text-[10px] text-slate-400 uppercase tracking-[0.3em] ml-2">Módulos</h3>
                    <div id="category-filters" class="flex flex-col gap-2">
                        <!-- Filtros injetados aqui -->
                    </div>
                </nav>
            </aside>

            <!-- FEED -->
            <section class="lg:col-span-9">
                <div id="posts-container" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Cards High Tech -->
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL DE LEITURA (ESTILO KINDLE TECH) -->
    <div id="view-modal" class="modal-overlay fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div id="view-modal-content-wrapper" class="bg-white dark:bg-slate-900 w-full max-w-5xl h-[90vh] rounded-[3rem] overflow-hidden relative shadow-2xl flex flex-col border dark:border-techBlue-900/40">
            <div class="p-10 border-b dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/30">
                <div class="space-y-1">
                    <span id="modal-category" class="text-[10px] font-black uppercase text-techBlue-600 tracking-widest"></span>
                    <h2 id="modal-title" class="text-3xl font-black tracking-tighter"></h2>
                </div>
                <button class="close-modal w-12 h-12 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 flex items-center justify-center text-3xl font-light transition-all">&times;</button>
            </div>
            <div class="p-12 overflow-y-auto flex-1 font-sans text-xl">
                <div id="modal-content" class="post-content max-w-3xl mx-auto opacity-90 leading-relaxed tracking-tight"></div>
            </div>
        </div>
    </div>

    <!-- MODAL DO EDITOR -->
    <div id="edit-modal" class="modal-overlay fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div id="edit-modal-content-wrapper" class="bg-white dark:bg-slate-900 w-full max-w-4xl rounded-[3rem] shadow-2xl overflow-hidden border">
            <div class="bg-techBlue-950 p-8 text-white flex justify-between items-center">
                <h2 class="font-black uppercase tracking-widest text-sm">System Architect Mode</h2>
                <button class="close-modal text-3xl font-light opacity-50 hover:opacity-100">&times;</button>
            </div>
            <form id="post-form" class="p-10 space-y-6">
                <input type="hidden" id="edit-id">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Título do Dado</label>
                        <input type="text" id="post-title" required class="w-full bg-slate-50 dark:bg-slate-800 p-5 rounded-2xl outline-none border-2 border-transparent focus:border-techBlue-600 font-bold transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Classificação</label>
                        <input type="text" id="post-category" required class="w-full bg-slate-50 dark:bg-slate-800 p-5 rounded-2xl outline-none border-2 border-transparent focus:border-techBlue-600 font-bold transition-all">
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Metadado (Resumo)</label>
                    <input type="text" id="post-summary" required class="w-full bg-slate-50 dark:bg-slate-800 p-5 rounded-2xl outline-none border-2 border-transparent focus:border-techBlue-600 font-semibold transition-all">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Conteúdo Base</label>
                    <textarea id="post-body" rows="8" required class="w-full bg-slate-50 dark:bg-slate-800 p-5 rounded-3xl outline-none border-2 border-transparent focus:border-techBlue-600 font-medium transition-all"></textarea>
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="submit" class="flex-1 bg-techBlue-600 text-white py-5 rounded-2xl font-black uppercase tracking-[0.2em] hover:bg-techBlue-700 transition-all shadow-xl">Comitar Alterações</button>
                    <button type="button" id="delete-post-btn" class="hidden px-10 bg-rose-500/10 text-rose-500 py-5 rounded-2xl font-black uppercase hover:bg-rose-500 hover:text-white transition-all">Deletar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL EDITOR IMPORTANTE -->
    <div id="important-modal" class="modal-overlay fixed inset-0 z-[60] hidden flex items-center justify-center p-4">
        <div id="important-modal-content-wrapper" class="bg-white dark:bg-slate-900 w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl">
            <h3 class="font-black uppercase tracking-widest text-sm mb-6">Editar Conceito Chave</h3>
            <form id="important-form" class="space-y-4">
                <input type="hidden" id="important-id">
                <input type="text" id="important-term" placeholder="Termo (Ex: Kernel)" required class="w-full bg-slate-50 dark:bg-slate-800 p-4 rounded-xl border focus:border-techBlue-600 outline-none">
                <textarea id="important-desc" placeholder="Definição..." required class="w-full bg-slate-50 dark:bg-slate-800 p-4 rounded-xl border focus:border-techBlue-600 outline-none"></textarea>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-amber-500 text-white py-4 rounded-xl font-bold">Salvar</button>
                    <button type="button" id="close-important-modal" class="px-6 bg-slate-100 dark:bg-slate-800 rounded-xl">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, setDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAHDSu3C39lJPkMtacpHoLNXn3aphXpRvA",
            authDomain: "cic-ead.firebaseapp.com",
            projectId: "cic-ead",
            storageBucket: "cic-ead.firebasestorage.app",
            messagingSenderId: "224684609703",
            appId: "1:224684609703:web:52fce7f22501300a2b0b82"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "cic-anhanguera-main";

        let currentUser = null;
        let isAdmin = false;
        let allPosts = [];
        let allImportant = [];
        let readStatus = {};
        let currentFilter = 'all';
        let searchQuery = '';

        // Tema
        const themeToggle = document.getElementById('theme-toggle');
        function updateThemeUI() {
            const isDark = document.documentElement.classList.contains('dark');
            themeToggle.innerText = isDark ? '☀️' : '🌙';
        }
        themeToggle.onclick = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            updateThemeUI();
        };
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        updateThemeUI();

        // Formatação Customizada
        function formatContent(text) {
            if (!text) return "";
            return text
                .replace(/\*(.*?)\*/g, '<strong class="text-techBlue-600 dark:text-techBlue-500 font-extrabold">$1</strong>')
                .replace(/_(.*?)_/g, '<em class="italic opacity-80">$1</em>')
                .replace(/\n/g, '<br>');
        }

        // Auth
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                isAdmin = user.email.toLowerCase().endsWith('@admin.com');
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('user-display').innerText = user.email;
                if (isAdmin) {
                    document.getElementById('admin-panel').classList.remove('hidden');
                    document.getElementById('add-important-btn').classList.remove('hidden');
                }
                initData();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app').classList.add('hidden');
            }
        });

        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                if (err.code.includes('user-not-found')) await createUserWithEmailAndPassword(auth, email, password);
                else alert("Acesso negado.");
            }
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // Data Sync
        async function initData() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), (snap) => {
                allPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderFilters();
                renderPosts();
                updateProgressBar();
            });

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'important'), (snap) => {
                allImportant = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderImportant();
            });

            onSnapshot(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'progress', 'status'), (docSnap) => {
                if (docSnap.exists()) {
                    readStatus = docSnap.data();
                    renderPosts();
                    updateProgressBar();
                }
            });
        }

        // Render Posts
        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            let filtered = currentFilter === 'all' ? allPosts : allPosts.filter(p => p.category === currentFilter);
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(p => p.title.toLowerCase().includes(q) || p.summary.toLowerCase().includes(q) || p.body.toLowerCase().includes(q));
            }
            filtered.sort((a,b) => b.timestamp - a.timestamp).forEach(post => {
                const isRead = readStatus[post.id] || false;
                const card = document.createElement('div');
                card.className = `glass p-8 rounded-[3rem] shadow-sm border-2 ${isRead ? 'border-emerald-500/20' : 'border-transparent'} hover:shadow-2xl transition-all group animate-fadeIn`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <span class="text-[9px] font-black uppercase tracking-[0.2em] bg-techBlue-600 text-white px-3 py-1 rounded-full">${post.category}</span>
                        <div class="flex items-center gap-3">
                            <input type="checkbox" ${isRead ? 'checked' : ''} class="read-toggle w-6 h-6 accent-emerald-500 rounded-lg cursor-pointer" data-id="${post.id}">
                            ${isAdmin ? `<button class="edit-btn opacity-0 group-hover:opacity-100 transition-opacity" data-id="${post.id}">✏️</button>` : ''}
                        </div>
                    </div>
                    <h3 class="text-2xl font-black mb-3 tracking-tighter">${post.title}</h3>
                    <p class="text-slate-400 font-medium text-sm mb-8 line-clamp-2">${post.summary}</p>
                    <button class="view-btn w-full bg-slate-900 dark:bg-techBlue-600 text-white py-5 rounded-2xl font-black text-xs tracking-[0.2em] hover:scale-[1.03] active:scale-95 transition-all shadow-lg" data-id="${post.id}">ABRIR TERMINAL</button>
                `;
                container.appendChild(card);
            });
            document.querySelectorAll('.view-btn').forEach(b => b.onclick = () => openViewer(b.dataset.id));
            document.querySelectorAll('.edit-btn').forEach(b => b.onclick = () => openEditor(b.dataset.id));
            document.querySelectorAll('.read-toggle').forEach(t => t.onchange = (e) => toggleRead(t.dataset.id, e.target.checked));
        }

        // Menu Importante
        const importantBtn = document.getElementById('important-menu-btn');
        const importantDropdown = document.getElementById('important-dropdown');
        importantBtn.onclick = (e) => {
            e.stopPropagation();
            importantDropdown.classList.toggle('hidden');
        };
        window.onclick = (e) => {
            importantDropdown.classList.add('hidden');
            // Fechamento de modais ao clicar fora
            const modais = ['view-modal', 'edit-modal', 'important-modal'];
            modais.forEach(id => {
                const modal = document.getElementById(id);
                const wrapper = document.getElementById(`${id}-content-wrapper`);
                if (!modal.classList.contains('hidden') && e.target === modal) {
                    modal.classList.add('hidden');
                }
            });
        };
        importantDropdown.onclick = (e) => e.stopPropagation();

        function renderImportant() {
            const list = document.getElementById('important-list');
            list.innerHTML = '';
            allImportant.forEach(item => {
                const div = document.createElement('div');
                div.className = "group border-b dark:border-slate-800 pb-3";
                div.innerHTML = `
                    <div class="flex justify-between">
                        <p class="text-xs font-black text-techBlue-600 uppercase mb-1">${item.term}</p>
                        ${isAdmin ? `<div class="flex gap-2 opacity-0 group-hover:opacity-100">
                            <button class="edit-imp text-[10px]" data-id="${item.id}">✏️</button>
                            <button class="del-imp text-[10px]" data-id="${item.id}">🗑️</button>
                        </div>` : ''}
                    </div>
                    <p class="text-[11px] font-medium leading-relaxed opacity-70">${item.desc}</p>
                `;
                list.appendChild(div);
            });
            document.querySelectorAll('.edit-imp').forEach(b => b.onclick = () => openImportantEditor(b.dataset.id));
            document.querySelectorAll('.del-imp').forEach(b => b.onclick = () => deleteImportant(b.dataset.id));
        }

        // CRUD Importante
        function openImportantEditor(id = null) {
            const modal = document.getElementById('important-modal');
            const form = document.getElementById('important-form');
            form.reset();
            document.getElementById('important-id').value = id || '';
            if(id) {
                const item = allImportant.find(i => i.id === id);
                document.getElementById('important-term').value = item.term;
                document.getElementById('important-desc').value = item.desc;
            }
            modal.classList.remove('hidden');
        }

        document.getElementById('important-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('important-id').value;
            const data = { term: document.getElementById('important-term').value, desc: document.getElementById('important-desc').value };
            if(id) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'important', id), data);
            else await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'important'), data);
            document.getElementById('important-modal').classList.add('hidden');
        };

        async function deleteImportant(id) { if(confirm("Remover conceito?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'important', id)); }
        document.getElementById('add-important-btn').onclick = () => openImportantEditor();
        document.getElementById('close-important-modal').onclick = () => document.getElementById('important-modal').classList.add('hidden');

        // Pesquisa e Filtros
        document.getElementById('search-input').oninput = (e) => {
            searchQuery = e.target.value;
            renderPosts();
        };

        function renderFilters() {
            const cats = [...new Set(allPosts.map(p => p.category))].sort();
            const container = document.getElementById('category-filters');
            container.innerHTML = `<button data-cat="all" class="filter-btn text-left px-5 py-3 rounded-2xl font-black text-xs uppercase tracking-widest transition-all ${currentFilter === 'all' ? 'bg-techBlue-600 text-white shadow-lg' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}">Todas as Matérias</button>`;
            cats.forEach(c => {
                const btn = document.createElement('button');
                btn.className = `filter-btn text-left px-5 py-3 rounded-2xl font-black text-xs uppercase tracking-widest transition-all ${currentFilter === c ? 'bg-techBlue-600 text-white shadow-lg' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}`;
                btn.innerText = c;
                btn.onclick = () => { currentFilter = c; renderFilters(); renderPosts(); };
                container.appendChild(btn);
            });
            container.firstChild.onclick = () => { currentFilter = 'all'; renderFilters(); renderPosts(); };
        }

        // Modais
        function openViewer(id) {
            const p = allPosts.find(x => x.id === id);
            document.getElementById('modal-title').innerText = p.title;
            document.getElementById('modal-category').innerText = p.category;
            document.getElementById('modal-content').innerHTML = formatContent(p.body);
            document.getElementById('view-modal').classList.remove('hidden');
        }

        function openEditor(id = null) {
            const f = document.getElementById('post-form'); f.reset();
            document.getElementById('edit-id').value = id || '';
            document.getElementById('delete-post-btn').classList.toggle('hidden', !id);
            if(id) {
                const p = allPosts.find(x => x.id === id);
                document.getElementById('post-title').value = p.title;
                document.getElementById('post-category').value = p.category;
                document.getElementById('post-summary').value = p.summary;
                document.getElementById('post-body').value = p.body;
            }
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        document.getElementById('post-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const data = {
                title: document.getElementById('post-title').value,
                category: document.getElementById('post-category').value,
                summary: document.getElementById('post-summary').value,
                body: document.getElementById('post-body').value,
                timestamp: Date.now()
            };
            if(id) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'posts', id), data);
            else await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), data);
            document.getElementById('edit-modal').classList.add('hidden');
        };

        async function toggleRead(id, status) {
            readStatus[id] = status;
            await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'progress', 'status'), readStatus);
        }

        function updateProgressBar() {
            if(!allPosts.length) return;
            const done = Object.values(readStatus).filter(v => v).length;
            document.getElementById('main-progress').style.width = `${(done / allPosts.length) * 100}%`;
        }

        document.querySelectorAll('.close-modal').forEach(b => b.onclick = () => {
            document.getElementById('view-modal').classList.add('hidden');
            document.getElementById('edit-modal').classList.add('hidden');
        });

        document.getElementById('open-post-modal').onclick = () => openEditor();
        document.getElementById('delete-post-btn').onclick = async () => {
            if(confirm("Excluir dado permanentemente?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'posts', document.getElementById('edit-id').value));
                document.getElementById('edit-modal').classList.add('hidden');
            }
        };

    </script>
</body>
</html>
