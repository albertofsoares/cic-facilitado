<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIC-EAD | Plataforma de Ensino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --tech-blue: #0070f3;
            --tech-dark: #0a0a0a;
            --tech-light: #ffffff;
        }
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        .font-tech { font-family: 'Orbitron', sans-serif; }
        .dark { background-color: var(--tech-dark); color: #e5e7eb; }
        .light { background-color: #f3f4f6; color: #1f2937; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .light .glass-card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--tech-blue); border-radius: 10px; }

        .btn-tech {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .btn-tech:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0, 112, 243, 0.3); }

        /* Loader */
        .loader {
            border: 3px solid rgba(0, 112, 243, 0.1);
            border-top: 3px solid var(--tech-blue);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="light min-h-screen flex flex-col">

    <div id="app" class="flex flex-col min-h-screen">
        <!-- Navegação será injetada aqui -->
        <header id="navbar" class="sticky top-0 z-50 transition-colors duration-300"></header>

        <!-- Main Content -->
        <main id="main-content" class="flex-grow container mx-auto px-4 py-8">
            <div id="loading-overlay" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] hidden">
                <div class="loader"></div>
            </div>
            <div id="view-container"></div>
        </main>

        <footer class="border-t border-gray-200 dark:border-gray-800 py-6 text-center text-sm opacity-60">
            <p id="footer-text">© 2024 CIC-EAD - Sistema Educativo High-Tech</p>
        </footer>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, onSnapshot, updateDoc, deleteDoc, addDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuração fornecida
        const firebaseConfig = {
            apiKey: "AIzaSyAHDSu3C39lJPkMtacpHoLNXn3aphXpRvA",
            authDomain: "cic-ead.firebaseapp.com",
            projectId: "cic-ead",
            storageBucket: "cic-ead.firebasestorage.app",
            messagingSenderId: "224684609703",
            appId: "1:224684609703:web:52fce7f22501300a2b0b82"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "cic-ead-v1"; // ID interno para isolamento de dados

        // --- Estado Global ---
        let state = {
            user: null,
            isAdmin: false,
            settings: { siteName: "CIC-EAD", theme: "light" },
            categories: [],
            posts: [],
            quizzes: [],
            currentView: 'home',
            searchQuery: '',
            selectedCategory: null,
            selectedSubCategory: null,
            currentPost: null
        };

        // --- Utilitários ---
        const formatText = (text) => {
            if (!text) return "";
            return text
                .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
                .replace(/_(.*?)_/g, '<em>$1</em>')
                .replace(/\^(.*?)\^/g, '<code class="bg-gray-200 dark:bg-gray-700 px-1 rounded font-mono">$1</code>')
                .replace(/\n/g, '<br>');
        };

        const toggleTheme = () => {
            state.settings.theme = state.settings.theme === 'light' ? 'dark' : 'light';
            document.body.className = state.settings.theme;
            renderNavbar();
            saveSettings();
        };

        const navigate = (view, params = {}) => {
            state.currentView = view;
            Object.assign(state, params);
            render();
            window.scrollTo(0, 0);
        };

        const showLoading = (show) => {
            document.getElementById('loading-overlay').classList.toggle('hidden', !show);
        };

        const notify = (msg) => {
            // Toast simples sem alert()
            const toast = document.createElement('div');
            toast.className = "fixed bottom-4 right-4 bg-blue-600 text-white px-6 py-3 rounded-lg shadow-xl z-50 animate-bounce";
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        // --- Firebase Firestore Operations ---
        const getPublicPath = (coll) => `artifacts/${appId}/public/data/${coll}`;
        
        const syncData = () => {
            // Site Settings
            onSnapshot(doc(db, getPublicPath('settings'), 'general'), (doc) => {
                if (doc.exists()) {
                    state.settings = { ...state.settings, ...doc.data() };
                    document.body.className = state.settings.theme;
                    render();
                }
            });

            // Categories
            onSnapshot(collection(db, getPublicPath('categories')), (snapshot) => {
                state.categories = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            });

            // Posts
            onSnapshot(collection(db, getPublicPath('posts')), (snapshot) => {
                state.posts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            });

            // Quizzes
            onSnapshot(collection(db, getPublicPath('quizzes')), (snapshot) => {
                state.quizzes = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            });
        };

        const saveSettings = async () => {
            if (!state.isAdmin) return;
            await setDoc(doc(db, getPublicPath('settings'), 'general'), state.settings);
        };

        // --- Renderização de Componentes ---

        const renderNavbar = () => {
            const navbar = document.getElementById('navbar');
            navbar.className = `glass-card border-b py-4 transition-all ${state.settings.theme === 'dark' ? 'border-gray-800' : 'border-gray-200'}`;
            navbar.innerHTML = `
                <div class="container mx-auto px-4 flex justify-between items-center">
                    <div class="flex items-center gap-8">
                        <h1 class="font-tech text-2xl font-bold text-blue-500 cursor-pointer" onclick="window.appNavigate('home')">
                            ${state.settings.siteName}
                        </h1>
                        <div class="hidden md:flex relative">
                            <input type="text" placeholder="Pesquisar conteúdo..." id="search-input" 
                                class="bg-gray-100 dark:bg-gray-800 border-none rounded-full px-5 py-2 w-64 focus:ring-2 ring-blue-500 transition-all outline-none"
                                value="${state.searchQuery}">
                            <i data-lucide="search" class="absolute right-4 top-2.5 w-4 h-4 text-gray-400"></i>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <button onclick="window.toggleTheme()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors">
                            <i data-lucide="${state.settings.theme === 'light' ? 'moon' : 'sun'}" class="w-5 h-5"></i>
                        </button>
                        ${state.isAdmin ? `<button onclick="window.appNavigate('admin')" class="hidden sm:block text-sm font-semibold text-blue-500 hover:underline">Painel Admin</button>` : ''}
                        ${state.user ? `
                            <div class="flex items-center gap-3">
                                <span class="hidden lg:block text-xs opacity-70">${state.user.email}</span>
                                <button onclick="window.appSignOut()" class="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg">
                                    <i data-lucide="log-out" class="w-5 h-5"></i>
                                </button>
                            </div>
                        ` : `
                            <button onclick="window.appNavigate('login')" class="bg-blue-600 text-white px-6 py-2 rounded-full text-sm font-semibold btn-tech">Login</button>
                        `}
                    </div>
                </div>
            `;
            
            lucide.createIcons();
            
            const searchInput = document.getElementById('search-input');
            if(searchInput) {
                searchInput.addEventListener('input', (e) => {
                    state.searchQuery = e.target.value.toLowerCase();
                    if(state.currentView !== 'home') navigate('home');
                    else renderContent();
                });
            }
        };

        const renderHome = () => {
            const filteredPosts = state.posts.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(state.searchQuery) || p.content.toLowerCase().includes(state.searchQuery);
                const matchesCategory = state.selectedCategory ? p.categoryId === state.selectedCategory : true;
                const matchesSub = state.selectedSubCategory ? p.subCategoryName === state.selectedSubCategory : true;
                return matchesSearch && matchesCategory && matchesSub;
            });

            return `
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
                    <!-- Sidebar Categorias -->
                    <aside class="lg:col-span-1 space-y-6">
                        <div class="glass-card p-6 rounded-2xl">
                            <h3 class="font-tech text-sm mb-4 uppercase tracking-widest text-blue-500 font-bold">Categorias</h3>
                            <div class="space-y-2">
                                <button onclick="window.filterCat(null)" class="w-full text-left px-3 py-2 rounded-lg hover:bg-blue-500/10 transition-colors ${!state.selectedCategory ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' : ''}">Tudo</button>
                                ${state.categories.map(cat => `
                                    <div class="space-y-1">
                                        <button onclick="window.filterCat('${cat.id}')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-blue-500/10 transition-colors ${state.selectedCategory === cat.id ? 'font-bold text-blue-500 border-l-4 border-blue-500' : ''}">
                                            ${cat.name}
                                        </button>
                                        ${state.selectedCategory === cat.id && cat.subcategories ? `
                                            <div class="pl-4 space-y-1 mt-1 border-l border-gray-200 dark:border-gray-800 ml-2">
                                                ${cat.subcategories.map(sub => `
                                                    <button onclick="window.filterSub('${sub}')" class="w-full text-left text-sm px-3 py-1.5 rounded-md hover:bg-blue-500/5 transition-colors ${state.selectedSubCategory === sub ? 'text-blue-600 font-semibold' : 'opacity-70'}">
                                                        ${sub}
                                                    </button>
                                                `).join('')}
                                            </div>
                                        ` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="glass-card p-6 rounded-2xl bg-blue-600/5 border-blue-500/20">
                            <h3 class="font-tech text-sm mb-4 uppercase text-blue-400 font-bold">Quizzes Ativos</h3>
                            <div class="space-y-3">
                                ${state.quizzes.length ? state.quizzes.map(q => `
                                    <button onclick="window.appNavigate('quiz-view', { currentQuiz: ${JSON.stringify(q).replace(/"/g, '&quot;')} })" class="w-full flex items-center justify-between p-3 glass-card rounded-xl hover:scale-105 transition-transform">
                                        <span class="text-sm font-medium">${q.title}</span>
                                        <i data-lucide="play" class="w-4 h-4 text-blue-500"></i>
                                    </button>
                                `).join('') : '<p class="text-xs opacity-50">Nenhum quiz disponível.</p>'}
                            </div>
                        </div>
                    </aside>

                    <!-- Feed de Conteúdo -->
                    <section class="lg:col-span-3 space-y-6">
                        <div class="flex items-center justify-between mb-2">
                            <h2 class="text-xl font-bold flex items-center gap-2">
                                ${state.selectedCategory ? state.categories.find(c => c.id === state.selectedCategory)?.name : 'Recentes'}
                                ${state.selectedSubCategory ? ` <i data-lucide="chevron-right" class="w-4 h-4"></i> ${state.selectedSubCategory}` : ''}
                            </h2>
                            <span class="text-xs opacity-50">${filteredPosts.length} resultados encontrados</span>
                        </div>

                        ${filteredPosts.length ? filteredPosts.map(post => `
                            <article onclick="window.appNavigate('post-view', { currentPost: ${JSON.stringify(post).replace(/"/g, '&quot;')} })" 
                                class="glass-card p-8 rounded-3xl cursor-pointer hover:border-blue-500/50 transition-all group">
                                <div class="flex justify-between items-start mb-4">
                                    <span class="text-xs font-tech bg-blue-500/10 text-blue-500 px-3 py-1 rounded-full">${state.categories.find(c => c.id === post.categoryId)?.name || 'Geral'}</span>
                                    <span class="text-xs opacity-40">${new Date(post.createdAt).toLocaleDateString()}</span>
                                </div>
                                <h3 class="text-2xl font-bold mb-3 group-hover:text-blue-500 transition-colors">${post.title}</h3>
                                <p class="opacity-70 line-clamp-3 mb-4">${post.content.replace(/[*_^]/g, '')}</p>
                                <div class="flex items-center text-blue-500 font-semibold text-sm group-hover:translate-x-2 transition-transform">
                                    Ler mais <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
                                </div>
                            </article>
                        `).join('') : `
                            <div class="text-center py-20 glass-card rounded-3xl opacity-50">
                                <i data-lucide="layers" class="w-12 h-12 mx-auto mb-4 opacity-20"></i>
                                <p>Nenhum conteúdo encontrado para estes filtros.</p>
                            </div>
                        `}
                    </section>
                </div>
            `;
        };

        const renderPostView = () => {
            const p = state.currentPost;
            if(!p) return `<p>Post não encontrado.</p>`;
            return `
                <div class="max-w-4xl mx-auto space-y-8">
                    <button onclick="window.appNavigate('home')" class="flex items-center gap-2 text-sm opacity-50 hover:opacity-100 transition-opacity">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar ao início
                    </button>
                    <header>
                        <div class="flex items-center gap-3 mb-4">
                            <span class="text-xs font-tech text-blue-500 uppercase tracking-widest">${p.subCategoryName || 'Conteúdo'}</span>
                        </div>
                        <h1 class="text-4xl font-bold font-tech mb-6">${p.title}</h1>
                        <div class="flex items-center gap-4 border-b border-gray-200 dark:border-gray-800 pb-6 opacity-60 text-sm">
                            <span>Publicado por Sistema</span>
                            <span>•</span>
                            <span>${new Date(p.createdAt).toLocaleDateString()}</span>
                        </div>
                    </header>
                    <div class="prose dark:prose-invert max-w-none text-lg leading-relaxed">
                        ${formatText(p.content)}
                    </div>
                </div>
            `;
        };

        const renderQuizView = () => {
            const q = state.currentQuiz;
            if(!q) return `<p>Quiz não encontrado.</p>`;
            
            // Lógica interna de estado para o quiz
            if(!window.quizState) {
                window.quizState = { currentStep: 0, score: 0, finished: false };
            }
            const qs = window.quizState;

            if(qs.finished) {
                return `
                    <div class="max-w-xl mx-auto glass-card p-10 rounded-3xl text-center space-y-6">
                        <i data-lucide="award" class="w-16 h-16 text-yellow-500 mx-auto"></i>
                        <h2 class="text-3xl font-bold">Fim do Quiz!</h2>
                        <p class="text-xl opacity-80">Sua pontuação final: <span class="text-blue-500 font-bold">${qs.score}</span> / ${q.questions.length}</p>
                        <button onclick="window.quizState = null; window.appNavigate('home')" class="bg-blue-600 text-white w-full py-4 rounded-2xl font-bold shadow-lg shadow-blue-500/20">Voltar</button>
                    </div>
                `;
            }

            const currentQ = q.questions[qs.currentStep];
            return `
                <div class="max-w-2xl mx-auto space-y-6">
                    <div class="flex justify-between items-center text-sm opacity-60">
                        <span>Questão ${qs.currentStep + 1} de ${q.questions.length}</span>
                        <span>Progresso: ${Math.round((qs.currentStep / q.questions.length) * 100)}%</span>
                    </div>
                    <div class="w-full bg-gray-200 dark:bg-gray-800 h-2 rounded-full overflow-hidden">
                        <div class="bg-blue-600 h-full transition-all duration-500" style="width: ${(qs.currentStep / q.questions.length) * 100}%"></div>
                    </div>
                    <div class="glass-card p-10 rounded-3xl shadow-xl">
                        <h3 class="text-2xl font-bold mb-8">${currentQ.question}</h3>
                        <div class="grid grid-cols-1 gap-4">
                            ${currentQ.options.map((opt, idx) => `
                                <button onclick="window.answerQuiz(${idx})" class="w-full text-left p-5 glass-card rounded-2xl hover:bg-blue-600 hover:text-white transition-all border border-gray-100 dark:border-gray-800">
                                    <span class="inline-block w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 text-center leading-8 mr-4 group-hover:bg-blue-500">${String.fromCharCode(65 + idx)}</span>
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        };

        const renderLogin = () => {
            const isRegister = state.isRegisterMode;
            return `
                <div class="max-w-md mx-auto py-12">
                    <div class="glass-card p-10 rounded-3xl shadow-2xl border-t-4 border-blue-500">
                        <div class="text-center mb-10">
                            <h2 class="text-3xl font-tech font-bold text-blue-500 mb-2">${isRegister ? 'Criar Conta' : 'Acesso Restrito'}</h2>
                            <p class="opacity-60">${isRegister ? 'Junte-se à nossa rede educativa' : 'Identifique-se para continuar'}</p>
                        </div>
                        <form onsubmit="window.handleAuth(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs uppercase font-bold mb-2 opacity-50">Endereço de E-mail</label>
                                <input type="email" id="auth-email" required class="w-full bg-gray-50 dark:bg-gray-800 border-none px-4 py-3 rounded-xl focus:ring-2 ring-blue-500 outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-xs uppercase font-bold mb-2 opacity-50">Senha Secreta</label>
                                <input type="password" id="auth-password" required class="w-full bg-gray-50 dark:bg-gray-800 border-none px-4 py-3 rounded-xl focus:ring-2 ring-blue-500 outline-none transition-all">
                            </div>
                            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-500/30 btn-tech mt-4">
                                ${isRegister ? 'Registrar Agora' : 'Entrar no Sistema'}
                            </button>
                        </form>
                        <div class="mt-8 pt-8 border-t border-gray-100 dark:border-gray-800 text-center">
                            <button onclick="window.toggleAuthMode()" class="text-sm text-blue-500 hover:underline">
                                ${isRegister ? 'Já possui conta? Faça Login' : 'Não tem conta? Registre-se'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };

        const renderAdmin = () => {
            if (!state.isAdmin) return `<p class="text-center py-20">Acesso negado.</p>`;
            return `
                <div class="space-y-8">
                    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <h1 class="text-3xl font-tech font-bold">Painel de Controle</h1>
                        <div class="flex gap-2">
                            <button onclick="window.adminTab = 'settings'; render()" class="px-4 py-2 rounded-lg ${window.adminTab === 'settings' ? 'bg-blue-600 text-white' : 'glass-card'}">Configurações</button>
                            <button onclick="window.adminTab = 'categories'; render()" class="px-4 py-2 rounded-lg ${window.adminTab === 'categories' ? 'bg-blue-600 text-white' : 'glass-card'}">Categorias</button>
                            <button onclick="window.adminTab = 'posts'; render()" class="px-4 py-2 rounded-lg ${window.adminTab === 'posts' ? 'bg-blue-600 text-white' : 'glass-card'}">Posts</button>
                            <button onclick="window.adminTab = 'quizzes'; render()" class="px-4 py-2 rounded-lg ${window.adminTab === 'quizzes' ? 'bg-blue-600 text-white' : 'glass-card'}">Quizzes</button>
                        </div>
                    </header>

                    <div class="glass-card p-8 rounded-3xl min-h-[400px]">
                        ${renderAdminContent()}
                    </div>
                </div>
            `;
        };

        const renderAdminContent = () => {
            const tab = window.adminTab || 'settings';
            
            if(tab === 'settings') {
                return `
                    <div class="max-w-lg space-y-6">
                        <h2 class="text-xl font-bold">Identidade do Site</h2>
                        <div>
                            <label class="block text-sm opacity-60 mb-2">Nome do Website</label>
                            <input type="text" id="admin-sitename" value="${state.settings.siteName}" class="w-full bg-gray-100 dark:bg-gray-800 p-3 rounded-xl border-none">
                        </div>
                        <button onclick="window.adminSaveSettings()" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold">Salvar Alterações</button>
                    </div>
                `;
            }

            if(tab === 'categories') {
                return `
                    <div class="space-y-8">
                        <div class="flex justify-between items-center">
                            <h2 class="text-xl font-bold">Gerenciar Categorias</h2>
                            <button onclick="window.adminAddCategory()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm">+ Nova Categoria</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${state.categories.map(cat => `
                                <div class="glass-card p-4 rounded-2xl flex flex-col gap-3">
                                    <div class="flex justify-between items-center">
                                        <input type="text" value="${cat.name}" onchange="window.adminUpdateCategory('${cat.id}', {name: this.value})" class="bg-transparent font-bold border-b border-gray-500 focus:border-blue-500 outline-none">
                                        <button onclick="window.adminDeleteCategory('${cat.id}')" class="text-red-500 hover:bg-red-500/10 p-2 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                    </div>
                                    <div class="space-y-2">
                                        <p class="text-xs opacity-50 uppercase font-bold">Sub-categorias</p>
                                        ${(cat.subcategories || []).map((sub, i) => `
                                            <div class="flex gap-2">
                                                <input type="text" value="${sub}" onchange="window.adminUpdateSubCategory('${cat.id}', ${i}, this.value)" class="text-sm bg-black/10 dark:bg-white/5 p-1 px-2 rounded w-full">
                                                <button onclick="window.adminDeleteSubCategory('${cat.id}', ${i})" class="text-red-400">×</button>
                                            </div>
                                        `).join('')}
                                        <button onclick="window.adminAddSubCategory('${cat.id}')" class="text-xs text-blue-500 hover:underline">+ Adicionar Sub</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            if(tab === 'posts') {
                return `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <h2 class="text-xl font-bold">Posts e Artigos</h2>
                            <button onclick="window.adminEditPost(null)" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-bold">Criar Novo Post</button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead>
                                    <tr class="opacity-50 text-xs uppercase border-b border-gray-200 dark:border-gray-800">
                                        <th class="py-4">Título</th>
                                        <th class="py-4">Categoria</th>
                                        <th class="py-4">Data</th>
                                        <th class="py-4 text-right">Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${state.posts.map(p => `
                                        <tr class="border-b border-gray-100 dark:border-gray-900 hover:bg-black/5">
                                            <td class="py-4 font-semibold">${p.title}</td>
                                            <td class="py-4 text-sm opacity-70">${state.categories.find(c => c.id === p.categoryId)?.name || 'Geral'}</td>
                                            <td class="py-4 text-sm opacity-70">${new Date(p.createdAt).toLocaleDateString()}</td>
                                            <td class="py-4 text-right">
                                                <button onclick="window.adminEditPost(${JSON.stringify(p).replace(/"/g, '&quot;')})" class="text-blue-500 mr-2">Editar</button>
                                                <button onclick="window.adminDeletePost('${p.id}')" class="text-red-500">Excluir</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                        ${window.editingPost ? renderPostEditor() : ''}
                    </div>
                `;
            }

            if(tab === 'quizzes') {
                return `
                    <div class="space-y-6">
                         <div class="flex justify-between items-center">
                            <h2 class="text-xl font-bold">Quizzes</h2>
                            <button onclick="window.adminEditQuiz(null)" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-bold">Novo Quiz</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${state.quizzes.map(q => `
                                <div class="glass-card p-6 rounded-2xl flex justify-between items-center">
                                    <div>
                                        <h4 class="font-bold">${q.title}</h4>
                                        <p class="text-xs opacity-50">${q.questions.length} Questões</p>
                                    </div>
                                    <div class="flex gap-3">
                                        <button onclick="window.adminEditQuiz(${JSON.stringify(q).replace(/"/g, '&quot;')})" class="text-blue-500 text-sm">Editar</button>
                                        <button onclick="window.adminDeleteQuiz('${q.id}')" class="text-red-500 text-sm">Excluir</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        ${window.editingQuiz ? renderQuizEditor() : ''}
                    </div>
                `;
            }
        };

        const renderPostEditor = () => {
            const p = window.editingPost;
            return `
                <div class="fixed inset-0 bg-black/80 flex items-center justify-center z-[200] p-4 overflow-y-auto">
                    <div class="bg-white dark:bg-gray-900 w-full max-w-4xl p-8 rounded-3xl space-y-4">
                        <h2 class="text-2xl font-bold">${p.id ? 'Editar' : 'Novo'} Post</h2>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="edit-post-title" placeholder="Título do Post" value="${p.title || ''}" class="w-full bg-gray-100 dark:bg-gray-800 p-3 rounded-xl border-none">
                            <select id="edit-post-cat" class="bg-gray-100 dark:bg-gray-800 p-3 rounded-xl border-none" onchange="window.adminUpdateEditorSubs(this.value)">
                                <option value="">Selecionar Categoria</option>
                                ${state.categories.map(c => `<option value="${c.id}" ${p.categoryId === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
                            </select>
                        </div>
                        <select id="edit-post-subcat" class="w-full bg-gray-100 dark:bg-gray-800 p-3 rounded-xl border-none">
                            <option value="">Selecionar Sub-categoria</option>
                            ${(state.categories.find(c => c.id === p.categoryId)?.subcategories || []).map(s => `<option value="${s}" ${p.subCategoryName === s ? 'selected' : ''}>${s}</option>`).join('')}
                        </select>
                        <div class="space-y-2">
                             <div class="flex gap-2 text-xs opacity-60">
                                <span>*negrito*</span> <span>_italico_</span> <span>^codigo^</span>
                            </div>
                            <textarea id="edit-post-content" rows="10" placeholder="Conteúdo do post..." class="w-full bg-gray-100 dark:bg-gray-800 p-4 rounded-xl border-none font-mono text-sm">${p.content || ''}</textarea>
                        </div>
                        <div class="flex justify-end gap-3">
                            <button onclick="window.editingPost = null; render()" class="px-6 py-2">Cancelar</button>
                            <button onclick="window.adminSavePost()" class="bg-blue-600 text-white px-8 py-2 rounded-xl font-bold">Publicar Post</button>
                        </div>
                    </div>
                </div>
            `;
        };

        const renderQuizEditor = () => {
            const q = window.editingQuiz;
            return `
                <div class="fixed inset-0 bg-black/80 flex items-center justify-center z-[200] p-4 overflow-y-auto">
                    <div class="bg-white dark:bg-gray-900 w-full max-w-2xl p-8 rounded-3xl space-y-6">
                        <h2 class="text-2xl font-bold">${q.id ? 'Editar' : 'Novo'} Quiz</h2>
                        <input type="text" id="edit-quiz-title" placeholder="Título do Quiz" value="${q.title || ''}" class="w-full bg-gray-100 dark:bg-gray-800 p-3 rounded-xl border-none">
                        
                        <div id="quiz-questions-editor" class="max-h-[300px] overflow-y-auto space-y-4 pr-2">
                            ${(q.questions || []).map((quest, qIdx) => `
                                <div class="p-4 border border-gray-200 dark:border-gray-800 rounded-xl space-y-3 relative">
                                    <button onclick="window.adminRemoveQuest(${qIdx})" class="absolute top-2 right-2 text-red-500">×</button>
                                    <input type="text" placeholder="Pergunta" value="${quest.question}" class="w-full bg-transparent font-bold" onchange="window.editingQuiz.questions[${qIdx}].question = this.value">
                                    <div class="grid grid-cols-2 gap-2">
                                        ${quest.options.map((opt, oIdx) => `
                                            <input type="text" placeholder="Opção ${oIdx + 1}" value="${opt}" class="text-xs bg-gray-100 dark:bg-gray-800 p-2 rounded" onchange="window.editingQuiz.questions[${qIdx}].options[${oIdx}] = this.value">
                                        `).join('')}
                                    </div>
                                    <select onchange="window.editingQuiz.questions[${qIdx}].correctIndex = parseInt(this.value)" class="text-xs bg-blue-500/10 text-blue-500 p-1 rounded">
                                        ${quest.options.map((_, i) => `<option value="${i}" ${quest.correctIndex === i ? 'selected' : ''}>Opção ${String.fromCharCode(65+i)} Correta</option>`).join('')}
                                    </select>
                                </div>
                            `).join('')}
                        </div>
                        
                        <button onclick="window.adminAddQuest()" class="w-full border-2 border-dashed border-gray-300 py-2 rounded-xl text-xs">+ Adicionar Questão</button>

                        <div class="flex justify-end gap-3 pt-4 border-t border-gray-800">
                            <button onclick="window.editingQuiz = null; render()" class="px-6 py-2">Cancelar</button>
                            <button onclick="window.adminSaveQuiz()" class="bg-blue-600 text-white px-8 py-2 rounded-xl font-bold">Salvar Quiz</button>
                        </div>
                    </div>
                </div>
            `;
        };

        const render = () => {
            renderNavbar();
            const container = document.getElementById('view-container');
            
            // Redirect se não logado
            if(!state.user && state.currentView !== 'login') {
                state.currentView = 'login';
            }

            switch(state.currentView) {
                case 'home': container.innerHTML = renderHome(); break;
                case 'post-view': container.innerHTML = renderPostView(); break;
                case 'quiz-view': container.innerHTML = renderQuizView(); break;
                case 'admin': container.innerHTML = renderAdmin(); break;
                case 'login': container.innerHTML = renderLogin(); break;
            }
            
            lucide.createIcons();
        };

        // --- Funções Globais (Acessíveis pelo HTML) ---
        window.appNavigate = (v, p) => navigate(v, p);
        window.toggleTheme = toggleTheme;
        window.filterCat = (id) => { state.selectedCategory = id; state.selectedSubCategory = null; render(); };
        window.filterSub = (sub) => { state.selectedSubCategory = sub; render(); };
        window.toggleAuthMode = () => { state.isRegisterMode = !state.isRegisterMode; render(); };

        window.handleAuth = async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            showLoading(true);
            try {
                if(state.isRegisterMode) {
                    await createUserWithEmailAndPassword(auth, email, pass);
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
                navigate('home');
            } catch(err) {
                notify("Erro na autenticação: " + err.message);
            }
            showLoading(false);
        };

        window.appSignOut = () => signOut(auth);

        window.answerQuiz = (idx) => {
            const q = state.currentQuiz;
            const qs = window.quizState;
            if(idx === q.questions[qs.currentStep].correctIndex) {
                qs.score++;
                notify("Correto! +1 ponto");
            } else {
                notify("Incorreto.");
            }
            
            if(qs.currentStep < q.questions.length - 1) {
                qs.currentStep++;
            } else {
                qs.finished = true;
            }
            render();
        };

        // --- Admin Actions ---
        window.adminSaveSettings = async () => {
            state.settings.siteName = document.getElementById('admin-sitename').value;
            await saveSettings();
            notify("Configurações salvas!");
            render();
        };

        window.adminAddCategory = async () => {
            await addDoc(collection(db, getPublicPath('categories')), { name: "Nova Categoria", subcategories: [] });
        };

        window.adminUpdateCategory = async (id, data) => {
            await updateDoc(doc(db, getPublicPath('categories'), id), data);
        };

        window.adminDeleteCategory = async (id) => {
            if(confirm("Deseja realmente excluir esta categoria?"))
                await deleteDoc(doc(db, getPublicPath('categories'), id));
        };

        window.adminAddSubCategory = async (id) => {
            const cat = state.categories.find(c => c.id === id);
            cat.subcategories.push("Nova Sub");
            await updateDoc(doc(db, getPublicPath('categories'), id), { subcategories: cat.subcategories });
        };

        window.adminUpdateSubCategory = async (id, idx, val) => {
            const cat = state.categories.find(c => c.id === id);
            cat.subcategories[idx] = val;
            await updateDoc(doc(db, getPublicPath('categories'), id), { subcategories: cat.subcategories });
        };

        window.adminDeleteSubCategory = async (id, idx) => {
            const cat = state.categories.find(c => c.id === id);
            cat.subcategories.splice(idx, 1);
            await updateDoc(doc(db, getPublicPath('categories'), id), { subcategories: cat.subcategories });
        };

        window.adminEditPost = (p) => {
            window.editingPost = p || { title: "", content: "", categoryId: "", subCategoryName: "" };
            render();
        };

        window.adminUpdateEditorSubs = (catId) => {
            window.editingPost.categoryId = catId;
            render();
        };

        window.adminSavePost = async () => {
            const ep = window.editingPost;
            const data = {
                title: document.getElementById('edit-post-title').value,
                content: document.getElementById('edit-post-content').value,
                categoryId: document.getElementById('edit-post-cat').value,
                subCategoryName: document.getElementById('edit-post-subcat').value,
                createdAt: ep.createdAt || new Date().toISOString()
            };
            
            showLoading(true);
            if(ep.id) await updateDoc(doc(db, getPublicPath('posts'), ep.id), data);
            else await addDoc(collection(db, getPublicPath('posts')), data);
            window.editingPost = null;
            showLoading(false);
            notify("Post publicado!");
            render();
        };

        window.adminDeletePost = async (id) => {
            if(confirm("Remover este post permanentemente?")) await deleteDoc(doc(db, getPublicPath('posts'), id));
        };

        window.adminEditQuiz = (q) => {
            window.editingQuiz = q ? JSON.parse(JSON.stringify(q)) : { title: "", questions: [] };
            render();
        };

        window.adminAddQuest = () => {
            window.editingQuiz.questions.push({ question: "Nova Pergunta?", options: ["A", "B", "C", "D"], correctIndex: 0 });
            render();
        };

        window.adminRemoveQuest = (idx) => {
            window.editingQuiz.questions.splice(idx, 1);
            render();
        };

        window.adminSaveQuiz = async () => {
            const eq = window.editingQuiz;
            eq.title = document.getElementById('edit-quiz-title').value;
            showLoading(true);
            if(eq.id) await updateDoc(doc(db, getPublicPath('quizzes'), eq.id), eq);
            else await addDoc(collection(db, getPublicPath('quizzes')), eq);
            window.editingQuiz = null;
            showLoading(false);
            render();
        };

        window.adminDeleteQuiz = async (id) => {
            if(confirm("Excluir quiz?")) await deleteDoc(doc(db, getPublicPath('quizzes'), id));
        };

        // --- Init App ---
        onAuthStateChanged(auth, (user) => {
            state.user = user;
            state.isAdmin = user && user.email.endsWith('@admin.com');
            if(user) {
                syncData();
                if(state.currentView === 'login') navigate('home');
            } else {
                navigate('login');
            }
            render();
        });

    </script>
</body>
</html>
