<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIC-EAD | Portal de Estudos</title>
    <!-- Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Tech-style readability -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0070f3;
            --tech-white: #ffffff;
            --tech-dark: #0a192f;
            --tech-gray: #f0f4f8;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .font-tech { font-family: 'JetBrains Mono', monospace; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary-blue); border-radius: 10px; }

        /* Dark Mode Styles */
        body.dark { background-color: var(--tech-dark); color: var(--tech-white); }
        body.light { background-color: var(--tech-gray); color: #1a202c; }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .dark .card { background: #112240; border-color: #233554; }
        .light .card { background: #ffffff; border-color: #e2e8f0; border: 1px solid; }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.8);
            transition: opacity 0.3s;
        }

        /* Markdown-like formatting helpers */
        .content-body b { font-weight: bold; color: var(--primary-blue); }
        .content-body i { font-style: italic; }
        .content-body p { margin-bottom: 1rem; }
    </style>
</head>
<body class="light">

    <!-- Auth Overlay (Login/Cadastro) -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md text-slate-900">
            <h1 class="text-3xl font-bold mb-6 text-center text-blue-600 font-tech">CIC-EAD LOGIN</h1>
            <div id="auth-error" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded text-sm"></div>
            
            <input type="email" id="email" placeholder="E-mail" class="w-full mb-4 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="password" id="password" placeholder="Senha" class="w-full mb-6 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            
            <button onclick="handleLogin()" id="btn-login" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition mb-3">Entrar</button>
            <button onclick="handleSignup()" id="btn-signup" class="w-full border-2 border-blue-600 text-blue-600 font-bold py-3 rounded-lg hover:bg-blue-50 transition">Criar Conta</button>
            <p class="text-xs text-center mt-4 text-slate-500">Emails @admin.com possuem privilégios de edição.</p>
        </div>
    </div>

    <!-- Main Content (Hidden until auth) -->
    <div id="app-content" class="hidden min-h-screen flex flex-col">
        
        <!-- Header -->
        <header class="sticky top-0 z-40 border-b transition-colors bg-white dark:bg-slate-900 dark:border-slate-800 shadow-sm">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <h1 class="text-2xl font-bold font-tech text-blue-600">CIC-EAD</h1>
                    <div class="hidden md:block h-6 w-px bg-slate-300 dark:bg-slate-700"></div>
                    <span id="user-display" class="hidden md:inline text-sm opacity-70"></span>
                </div>

                <div class="flex items-center space-x-3">
                    <!-- Menu Importante -->
                    <div class="relative">
                        <button onclick="toggleImportantMenu()" class="flex items-center space-x-1 px-3 py-1.5 bg-yellow-500/10 text-yellow-600 dark:text-yellow-400 rounded-full text-sm font-bold hover:bg-yellow-500/20 transition">
                            <span>⚡ Importante</span>
                        </button>
                        <div id="important-dropdown" class="hidden absolute right-0 mt-3 w-72 card shadow-xl p-4 rounded-xl z-50">
                            <div class="flex justify-between items-center mb-3">
                                <h3 class="font-bold border-b border-blue-500 pb-1">Flash Notes</h3>
                                <button id="admin-add-note" class="hidden text-blue-500 text-xs font-bold" onclick="showNoteForm()">+ Adicionar</button>
                            </div>
                            <div id="notes-list" class="space-y-3 max-h-64 overflow-y-auto pr-2">
                                <!-- Notes injected here -->
                            </div>
                        </div>
                    </div>

                    <!-- Theme Toggle -->
                    <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                        <svg id="sun-icon" class="w-6 h-6 hidden text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
                        <svg id="moon-icon" class="w-6 h-6 text-slate-600" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    </button>

                    <button onclick="handleLogout()" class="text-sm text-red-500 hover:underline">Sair</button>
                </div>
            </div>
        </header>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 dark:bg-slate-800 h-2 sticky top-[73px] z-30">
            <div id="study-progress" class="bg-blue-600 h-full transition-all duration-500" style="width: 0%"></div>
        </div>

        <!-- Main Layout -->
        <main class="container mx-auto px-4 py-8 flex-grow">
            
            <!-- Admin Panel (Conditional) -->
            <section id="admin-panel" class="hidden mb-12 animate-in fade-in slide-in-from-top duration-500">
                <div class="card p-6 rounded-2xl shadow-lg border-2 border-blue-500/30">
                    <h2 class="text-xl font-bold mb-4 flex items-center">
                        <span class="mr-2">🛠️</span> Painel de Administração
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="post-title" placeholder="Título do Post" class="p-3 rounded bg-slate-50 dark:bg-slate-800 border dark:border-slate-700">
                        <input type="text" id="post-category" placeholder="Categoria (ex: Algoritmos)" class="p-3 rounded bg-slate-50 dark:bg-slate-800 border dark:border-slate-700">
                        <input type="text" id="post-summary" placeholder="Breve Resumo/Assunto" class="md:col-span-2 p-3 rounded bg-slate-50 dark:bg-slate-800 border dark:border-slate-700">
                        <textarea id="post-content" placeholder="Conteúdo completo (Use Enter para quebras de linha, **texto** para negrito)" class="md:col-span-2 p-3 rounded bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 h-32"></textarea>
                    </div>
                    <div class="mt-4 flex justify-end space-x-2">
                        <button onclick="clearAdminForm()" class="px-6 py-2 rounded-lg opacity-60 hover:opacity-100 transition">Cancelar</button>
                        <button onclick="savePost()" class="bg-blue-600 text-white px-8 py-2 rounded-lg font-bold hover:bg-blue-700 transition">Publicar Conteúdo</button>
                    </div>
                </div>
            </section>

            <!-- Filters & Categories -->
            <div class="flex flex-wrap items-center gap-2 mb-8" id="category-filters">
                <button onclick="filterPosts('all')" class="px-4 py-1 rounded-full bg-blue-600 text-white text-sm font-semibold">Tudo</button>
                <!-- Categorias dinâmicas aqui -->
            </div>

            <!-- Posts Grid -->
            <div id="posts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Posts injetados aqui -->
            </div>
        </main>

        <footer class="p-8 text-center opacity-50 text-sm font-tech">
            © 2026 CIC-EAD - Ciência da Computação
        </footer>
    </div>

    <!-- Modal para leitura de conteúdo -->
    <div id="post-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4">
        <div class="modal-overlay absolute inset-0" onclick="closeModal()"></div>
        <div class="card relative w-full max-w-3xl max-h-[90vh] overflow-y-auto rounded-2xl shadow-2xl p-6 md:p-10 animate-in zoom-in duration-200">
            <button onclick="closeModal()" class="absolute top-4 right-4 p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div id="modal-body">
                <!-- Conteúdo do modal -->
            </div>
            <div class="mt-8 pt-6 border-t dark:border-slate-700 flex justify-between items-center">
                <label class="flex items-center space-x-3 cursor-pointer group">
                    <input type="checkbox" id="modal-read-check" class="w-6 h-6 rounded border-blue-500 text-blue-600 focus:ring-blue-500">
                    <span class="font-semibold group-hover:text-blue-500 transition">Marcar como lido</span>
                </label>
                <button onclick="closeModal()" class="bg-blue-600 text-white px-6 py-2 rounded-lg">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Modal Form Note -->
    <div id="note-modal" class="hidden fixed inset-0 z-[70] flex items-center justify-center p-4">
        <div class="modal-overlay absolute inset-0" onclick="closeNoteForm()"></div>
        <div class="card relative w-full max-w-md rounded-xl p-6 shadow-2xl">
            <h3 class="text-lg font-bold mb-4">Nova Nota Importante</h3>
            <input type="text" id="note-title" placeholder="Termo (ex: Thread)" class="w-full mb-3 p-2 rounded border dark:bg-slate-800 dark:border-slate-700">
            <textarea id="note-text" placeholder="Definição curta" class="w-full mb-4 p-2 rounded border dark:bg-slate-800 dark:border-slate-700"></textarea>
            <div class="flex justify-end space-x-2">
                <button onclick="closeNoteForm()" class="px-4 py-2">Cancelar</button>
                <button onclick="saveNote()" class="bg-blue-600 text-white px-6 py-2 rounded-lg">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, addDoc, getDoc, query, onSnapshot, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config (Fornecida por você)
        const firebaseConfig = {
            apiKey: "AIzaSyAHDSu3C39lJPkMtacpHoLNXn3aphXpRvA",
            authDomain: "cic-ead.firebaseapp.com",
            projectId: "cic-ead",
            storageBucket: "cic-ead.firebasestorage.app",
            messagingSenderId: "224684609703",
            appId: "1:224684609703:web:52fce7f22501300a2b0b82"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "cic-ead-v1"; // ID interno para isolamento de dados

        let currentUser = null;
        let isAdmin = false;
        let allPosts = [];
        let userReadList = [];
        let activeFilter = 'all';

        // --- AUTH LOGIC ---
        window.handleLogin = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('auth-error');
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                errorDiv.innerText = "Erro ao entrar: " + e.message;
                errorDiv.classList.remove('hidden');
            }
        };

        window.handleSignup = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('auth-error');
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                errorDiv.innerText = "Erro ao cadastrar: " + e.message;
                errorDiv.classList.remove('hidden');
            }
        };

        window.handleLogout = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                isAdmin = user.email.endsWith('@admin.com');
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('user-display').innerText = user.email;
                
                if (isAdmin) {
                    document.getElementById('admin-panel').classList.remove('hidden');
                    document.getElementById('admin-add-note').classList.remove('hidden');
                }

                initDataListeners();
            } else {
                currentUser = null;
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-content').classList.add('hidden');
            }
        });

        // --- DATA LISTENERS ---
        function initDataListeners() {
            // Listen to Posts
            const postsCol = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
            onSnapshot(postsCol, (snapshot) => {
                allPosts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderPosts();
                renderCategories();
            }, (err) => console.error("Erro posts:", err));

            // Listen to Important Notes
            const notesCol = collection(db, 'artifacts', appId, 'public', 'data', 'notes');
            onSnapshot(notesCol, (snapshot) => {
                const notes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderNotes(notes);
            }, (err) => console.error("Erro notas:", err));

            // Listen to User Reading Progress
            const userProgressDoc = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'progress', 'lidos');
            onSnapshot(userProgressDoc, (docSnap) => {
                if (docSnap.exists()) {
                    userReadList = docSnap.data().posts || [];
                } else {
                    userReadList = [];
                }
                updateProgressBar();
                renderPosts(); // Refresh status de lido
            });
        }

        // --- POSTS LOGIC ---
        window.savePost = async () => {
            if (!isAdmin) return;
            const title = document.getElementById('post-title').value;
            const category = document.getElementById('post-category').value;
            const summary = document.getElementById('post-summary').value;
            const content = document.getElementById('post-content').value;
            const editId = document.getElementById('post-title').dataset.editId;

            if (!title || !content) return;

            const postData = {
                title,
                category: category || 'Geral',
                summary,
                content,
                updatedAt: serverTimestamp()
            };

            try {
                if (editId) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'posts', editId), postData);
                } else {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), postData);
                }
                clearAdminForm();
            } catch (e) {
                console.error("Erro salvando post:", e);
            }
        };

        window.deletePost = async (id, e) => {
            e.stopPropagation();
            if (confirm("Tem certeza que deseja deletar este post?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'posts', id));
            }
        };

        window.editPost = (id, e) => {
            e.stopPropagation();
            const post = allPosts.find(p => p.id === id);
            document.getElementById('post-title').value = post.title;
            document.getElementById('post-title').dataset.editId = id;
            document.getElementById('post-category').value = post.category;
            document.getElementById('post-summary').value = post.summary;
            document.getElementById('post-content').value = post.content;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.clearAdminForm = () => {
            document.getElementById('post-title').value = '';
            delete document.getElementById('post-title').dataset.editId;
            document.getElementById('post-category').value = '';
            document.getElementById('post-summary').value = '';
            document.getElementById('post-content').value = '';
        };

        // --- NOTES LOGIC ---
        window.saveNote = async () => {
            const title = document.getElementById('note-title').value;
            const text = document.getElementById('note-text').value;
            if (!title || !text) return;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'notes'), { title, text });
            closeNoteForm();
        };

        window.deleteNote = async (id) => {
            if (isAdmin) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'notes', id));
        };

        // --- RENDERING ---
        function formatContent(text) {
            if (!text) return '';
            // Basic formatting
            return text
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                .replace(/\*(.*?)\*/g, '<i>$1</i>');
        }

        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';

            const filtered = activeFilter === 'all' 
                ? allPosts 
                : allPosts.filter(p => p.category === activeFilter);

            filtered.sort((a,b) => (b.updatedAt?.seconds || 0) - (a.updatedAt?.seconds || 0));

            filtered.forEach(post => {
                const isRead = userReadList.includes(post.id);
                const div = document.createElement('div');
                div.className = `card p-5 rounded-xl transition-all hover:shadow-xl cursor-pointer flex flex-col ${isRead ? 'opacity-70' : ''}`;
                div.onclick = () => openModal(post);
                
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-bold font-tech uppercase tracking-widest text-blue-500 bg-blue-500/10 px-2 py-0.5 rounded">${post.category}</span>
                        ${isRead ? '<span class="text-green-500 text-xs font-bold">✓ LIDO</span>' : ''}
                    </div>
                    <h3 class="text-lg font-bold mb-2 leading-tight">${post.title}</h3>
                    <p class="text-sm opacity-70 mb-4 line-clamp-3">${post.summary || 'Sem resumo disponível.'}</p>
                    <div class="mt-auto flex justify-between items-center">
                        <button class="text-blue-500 font-bold text-sm hover:underline">LER CONTEÚDO →</button>
                        ${isAdmin ? `
                            <div class="flex space-x-2">
                                <button onclick="editPost('${post.id}', event)" class="p-1 hover:text-blue-500">✏️</button>
                                <button onclick="deletePost('${post.id}', event)" class="p-1 hover:text-red-500">🗑️</button>
                            </div>
                        ` : ''}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderCategories() {
            const container = document.getElementById('category-filters');
            const cats = [...new Set(allPosts.map(p => p.category))];
            
            container.innerHTML = `<button onclick="window.filterPosts('all')" class="px-4 py-1 rounded-full text-sm font-semibold transition ${activeFilter === 'all' ? 'bg-blue-600 text-white' : 'bg-slate-200 dark:bg-slate-800'}">Tudo</button>`;
            
            cats.forEach(cat => {
                if (!cat) return;
                const btn = document.createElement('button');
                btn.className = `px-4 py-1 rounded-full text-sm font-semibold transition ${activeFilter === cat ? 'bg-blue-600 text-white' : 'bg-slate-200 dark:bg-slate-800'}`;
                btn.innerText = cat;
                btn.onclick = () => window.filterPosts(cat);
                container.appendChild(btn);
            });
        }

        window.filterPosts = (cat) => {
            activeFilter = cat;
            renderCategories();
            renderPosts();
        };

        function renderNotes(notes) {
            const list = document.getElementById('notes-list');
            list.innerHTML = notes.length ? '' : '<p class="text-xs opacity-50 italic">Nenhuma nota importante no momento.</p>';
            notes.forEach(n => {
                const item = document.createElement('div');
                item.className = "group border-l-2 border-blue-500 pl-3 py-1";
                item.innerHTML = `
                    <div class="flex justify-between items-start">
                        <h4 class="text-sm font-bold text-blue-500 font-tech">${n.title}</h4>
                        ${isAdmin ? `<button onclick="deleteNote('${n.id}')" class="hidden group-hover:block text-[10px] text-red-400">Remover</button>` : ''}
                    </div>
                    <p class="text-xs opacity-80">${n.text}</p>
                `;
                list.appendChild(item);
            });
        }

        // --- UI HELPERS ---
        window.toggleTheme = () => {
            const isDark = document.body.classList.contains('dark');
            document.body.classList.toggle('dark', !isDark);
            document.body.classList.toggle('light', isDark);
            document.getElementById('sun-icon').classList.toggle('hidden', isDark);
            document.getElementById('moon-icon').classList.toggle('hidden', !isDark);
        };

        window.toggleImportantMenu = () => {
            document.getElementById('important-dropdown').classList.toggle('hidden');
        };

        window.openModal = (post) => {
            const modal = document.getElementById('post-modal');
            const body = document.getElementById('modal-body');
            const check = document.getElementById('modal-read-check');
            
            body.innerHTML = `
                <div class="mb-4">
                    <span class="text-xs font-bold font-tech text-blue-500 uppercase">${post.category}</span>
                    <h2 class="text-3xl font-bold mt-1">${post.title}</h2>
                    <p class="text-lg opacity-60 mt-2 italic">${post.summary || ''}</p>
                </div>
                <div class="content-body text-lg leading-relaxed pt-6 border-t dark:border-slate-800">
                    <p>${formatContent(post.content)}</p>
                </div>
            `;
            
            check.checked = userReadList.includes(post.id);
            check.onclick = () => toggleReadStatus(post.id);
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };

        window.closeModal = () => {
            document.getElementById('post-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        };

        async function toggleReadStatus(postId) {
            let newList = [...userReadList];
            if (newList.includes(postId)) {
                newList = newList.filter(id => id !== postId);
            } else {
                newList.push(postId);
            }
            
            const ref = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'progress', 'lidos');
            await setDoc(ref, { posts: newList });
        }

        function updateProgressBar() {
            if (allPosts.length === 0) return;
            const percentage = (userReadList.length / allPosts.length) * 100;
            document.getElementById('study-progress').style.width = `${percentage}%`;
        }

        window.showNoteForm = () => document.getElementById('note-modal').classList.remove('hidden');
        window.closeNoteForm = () => document.getElementById('note-modal').classList.add('hidden');

        // Close dropdown when clicking outside
        window.addEventListener('click', (e) => {
            const dropdown = document.getElementById('important-dropdown');
            if (!dropdown.contains(e.target) && !e.target.closest('button[onclick="toggleImportantMenu()"]')) {
                dropdown.classList.add('hidden');
            }
        });

    </script>
</body>
</html>
