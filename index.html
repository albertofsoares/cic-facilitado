<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIC Fácil</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        tech: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9', // Sky blue
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                            dark: '#0f172a', // Slate 900
                            darker: '#020617', // Slate 950
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .dark ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        ::-webkit-scrollbar-thumb { background: #0ea5e9; border-radius: 4px; }
        
        /* Glassmorphism utilities */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* --- MARKDOWN STYLES --- */
        .parsed-content h1 { 
            font-size: 1.8rem; font-weight: 800; color: #0284c7; 
            margin-top: 1.5rem; margin-bottom: 0.75rem; line-height: 1.2;
            border-bottom: 2px solid #e0f2fe; padding-bottom: 0.25rem;
        }
        .dark .parsed-content h1 { color: #38bdf8; border-color: #1e293b; }

        .parsed-content h2 { 
            font-size: 1.5rem; font-weight: 700; color: #0369a1; 
            margin-top: 1.25rem; margin-bottom: 0.5rem; 
        }
        .dark .parsed-content h2 { color: #7dd3fc; }

        .parsed-content h3 { 
            font-size: 1.25rem; font-weight: 600; color: #075985; 
            margin-top: 1rem; margin-bottom: 0.5rem; 
        }
        .dark .parsed-content h3 { color: #bae6fd; }

        .parsed-content b, .parsed-content strong { font-weight: 700; color: #0284c7; }
        .dark .parsed-content b, .dark .parsed-content strong { color: #38bdf8; }

        .parsed-content i, .parsed-content em { font-style: italic; opacity: 0.9; }
        
        .parsed-content code { 
            background: #e0f2fe; color: #0c4a6e; padding: 2px 6px; 
            border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.9em;
        }
        .dark .parsed-content code { background: #1e293b; color: #7dd3fc; }

        .parsed-content ul { list-style-type: disc; margin-left: 25px; margin-bottom: 10px; }
        .parsed-content ol { list-style-type: decimal; margin-left: 25px; margin-bottom: 10px; }
        .parsed-content li { margin-bottom: 0.25rem; }
        
        .parsed-content blockquote {
            border-left: 4px solid #0ea5e9; padding-left: 1rem; margin: 1rem 0;
            color: #64748b; font-style: italic; background: rgba(14, 165, 233, 0.05);
            padding: 0.5rem 1rem; border-radius: 0 0.5rem 0.5rem 0;
        }
        .dark .parsed-content blockquote { color: #94a3b8; background: rgba(14, 165, 233, 0.1); }

        .parsed-content br { display: block; margin-bottom: 0.5rem; }

        /* Transition & Loader */
        body { transition: background-color 0.3s, color 0.3s; }
        .loader {
            border: 4px solid rgba(14, 165, 233, 0.3);
            border-left-color: #0ea5e9; border-radius: 50%;
            width: 30px; height: 30px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .progress-bar-fill { transition: width 1s ease-in-out; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-tech-darker dark:text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Progress Bar (Sticky Top) -->
    <div class="fixed top-0 left-0 w-full h-1.5 bg-slate-200 dark:bg-slate-800 z-[60]" id="progress-container">
        <div id="global-progress-bar" class="h-full bg-gradient-to-r from-green-400 to-green-600 progress-bar-fill shadow-[0_0_10px_rgba(74,222,128,0.5)]" style="width: 0%"></div>
    </div>

    <!-- Navigation -->
    <nav class="glass sticky top-1.5 z-50 shadow-sm transition-all duration-300 mt-1.5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- Logo -->
                <div class="flex items-center cursor-pointer" onclick="app.router.navigate('home')">
                    <div class="h-8 w-8 bg-tech-500 rounded-lg flex items-center justify-center text-white mr-3 shadow-[0_0_15px_rgba(14,165,233,0.5)]">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <span id="nav-site-title" class="font-bold text-xl tracking-tight text-tech-900 dark:text-white">HighTech</span>
                </div>

                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center space-x-6">
                    <div class="relative group">
                        <input type="text" id="global-search" placeholder="Pesquisar..." 
                            class="bg-slate-100 dark:bg-slate-800/50 border-none rounded-full py-1.5 px-4 text-sm focus:ring-2 focus:ring-tech-500 w-48 transition-all focus:w-64 outline-none">
                        <i class="fa-solid fa-magnifying-glass absolute right-3 top-2 text-slate-400 text-xs"></i>
                    </div>

                    <button onclick="app.router.navigate('home')" class="hover:text-tech-500 transition-colors">Início</button>
                    <button onclick="app.router.navigate('categories')" class="hover:text-tech-500 transition-colors">Categorias</button>
                    <button onclick="app.router.navigate('media')" class="hover:text-tech-500 transition-colors">Mídia</button>
                    <button onclick="app.router.navigate('quizzes')" class="hover:text-tech-500 transition-colors">Quiz</button>
                    
                    <!-- Admin Link -->
                    <button id="nav-admin-link" onclick="app.router.navigate('admin')" class="hidden text-amber-500 hover:text-amber-400 font-bold">
                        <i class="fa-solid fa-shield-halved mr-1"></i> Admin
                    </button>

                    <!-- Theme Toggle -->
                    <button onclick="app.ui.toggleTheme()" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
                        <i id="theme-icon" class="fa-solid fa-moon"></i>
                    </button>

                    <!-- Auth Button -->
                    <div id="auth-container"></div>
                </div>

                <!-- Mobile Menu Button -->
                <div class="flex items-center md:hidden">
                    <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="text-slate-600 dark:text-slate-200 hover:text-tech-500">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden glass border-t border-gray-200 dark:border-gray-800 p-4 space-y-3">
            <input type="text" id="mobile-search" placeholder="Pesquisar..." class="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded text-sm mb-2">
            <button onclick="app.router.navigate('home')" class="block w-full text-left py-2">Início</button>
            <button onclick="app.router.navigate('categories')" class="block w-full text-left py-2">Categorias</button>
            <button onclick="app.router.navigate('media')" class="block w-full text-left py-2">Mídia</button>
            <button onclick="app.router.navigate('quizzes')" class="block w-full text-left py-2">Quiz</button>
            <button id="mobile-admin-link" onclick="app.router.navigate('admin')" class="hidden block w-full text-left py-2 text-amber-500">Admin Panel</button>
            <button onclick="app.ui.toggleTheme()" class="block w-full text-left py-2">Alternar Tema</button>
            <div id="mobile-auth-container" class="pt-2 border-t dark:border-gray-700"></div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app-root" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 transition-opacity duration-300 opacity-100">
        <div class="flex justify-center items-center h-64">
            <div class="loader"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-tech-darker border-t border-slate-200 dark:border-slate-800 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-slate-500 dark:text-slate-400 text-sm">
                &copy; <span id="footer-year">2024</span> <span id="footer-site-title">HighTech</span>. Todos os direitos reservados.
            </p>
        </div>
    </footer>

    <!-- Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // CONFIGURAÇÃO DO FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAHDSu3C39lJPkMtacpHoLNXn3aphXpRvA",
            authDomain: "cic-ead.firebaseapp.com",
            projectId: "cic-ead",
            storageBucket: "cic-ead.firebasestorage.app",
            messagingSenderId: "224684609703",
            appId: "1:224684609703:web:52fce7f22501300a2b0b82"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);

        // --- Estado Global ---
        const store = {
            user: null,
            isAdmin: false,
            theme: 'light',
            data: {
                settings: { title: 'HighTech Hub', welcome: 'Bem-vindo ao futuro do conhecimento.' },
                settingsId: null,
                categories: [],
                posts: [],
                quizzes: [],
                media: [], // Nova coleção de mídia
                readPosts: [],
                bookmarks: []
            },
            quizState: {
                activeCategory: null,
                activeQuizzes: [],
                currentIndex: 0,
                isFinished: false
            },
            currentView: 'home',
            homeTab: 'recent', 
            params: {},
            isLoading: true
        };

        // --- Utilitários ---
        const utils = {
            parseCustomMarkdown: (text) => {
                if (!text) return '';
                let html = text
                    .replace(/^###\s?(.*$)/gim, '<h3>$1</h3>')
                    .replace(/^##\s?(.*$)/gim, '<h2>$1</h2>')
                    .replace(/^#\s?(.*$)/gim, '<h1>$1</h1>')
                    .replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>')
                    .replace(/^\s*-\s+(.*$)/gim, '<li>$1</li>')
                    .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                    .replace(/\*(.*?)\*/g, '<i>$1</i>')
                    .replace(/__(.*?)__/g, '<i>$1</i>')
                    .replace(/_(.*?)_/g, '<i>$1</i>')
                    .replace(/`(.*?)`/g, '<code>$1</code>')
                    .replace(/\n/g, '<br>');
                html = html.replace(/<br><li>/g, '<li>'); 
                return html;
            },
            formatDate: (isoString) => {
                if(!isoString) return 'Data desconhecida';
                try {
                    return new Date(isoString).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
                } catch (e) { return isoString; }
            },
            calculateProgress: () => {
                const total = store.data.posts.length;
                if (total === 0) return 0;
                const validReads = store.data.readPosts.filter(readId => store.data.posts.some(p => p.id === readId));
                return Math.round((validReads.length / total) * 100);
            },
            shuffleArray: (array) => {
                let currentIndex = array.length, randomIndex;
                while (currentIndex != 0) {
                    randomIndex = Math.floor(Math.random() * currentIndex);
                    currentIndex--;
                    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
                }
                return array;
            },
            // Converte links normais do youtube para embed
            getEmbedUrl: (url) => {
                if (!url) return '';
                // Se já for embed, retorna
                if (url.includes('embed')) return url;
                
                // Tenta extrair o ID do vídeo do YouTube
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
                const match = url.match(regExp);

                if (match && match[2].length === 11) {
                    return `https://www.youtube.com/embed/${match[2]}`;
                }
                // Se não for youtube, retorna a URL original (pode ser uma imagem ou mp4 direto)
                return url;
            }
        };

        // --- Camada de Dados ---
        const api = {
            getCollectionRef: (name) => collection(db, name),
            getUserProgressRef: (userId) => collection(db, 'users', userId, 'progress'),
            getUserBookmarksRef: (userId) => collection(db, 'users', userId, 'bookmarks'),

            fetchAll: async () => {
                store.isLoading = true;
                app.ui.render(); 
                
                try {
                    // Settings
                    const settingsSnap = await getDocs(api.getCollectionRef('settings'));
                    if (!settingsSnap.empty) {
                        store.data.settings = { ...store.data.settings, ...settingsSnap.docs[0].data() };
                        store.data.settingsId = settingsSnap.docs[0].id;
                    }
                    // Categories
                    const catsSnap = await getDocs(api.getCollectionRef('categories'));
                    store.data.categories = catsSnap.docs.map(d => ({id: d.id, ...d.data()}));
                    // Posts
                    const postsSnap = await getDocs(api.getCollectionRef('posts'));
                    store.data.posts = postsSnap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => new Date(b.date) - new Date(a.date));
                    // Media
                    const mediaSnap = await getDocs(api.getCollectionRef('media'));
                    store.data.media = mediaSnap.docs.map(d => ({id: d.id, ...d.data()}));
                    // Quizzes
                    const quizSnap = await getDocs(api.getCollectionRef('quizzes'));
                    store.data.quizzes = quizSnap.docs.map(d => ({id: d.id, ...d.data()}));

                    if (store.user) {
                        await api.fetchUserProgress();
                        await api.fetchUserBookmarks();
                    }

                } catch (error) {
                    console.error("Erro ao carregar:", error);
                    if(store.data.categories.length === 0) api.seedData();
                } finally {
                    store.isLoading = false;
                    app.ui.updateSiteMeta();
                    app.ui.updateProgressBar();
                    app.router.navigate(store.currentView);
                }
            },

            fetchUserProgress: async () => {
                if (!store.user) return;
                try {
                    const progressSnap = await getDocs(api.getUserProgressRef(store.user.uid));
                    store.data.readPosts = progressSnap.docs.map(doc => doc.id);
                } catch (error) { console.warn("Erro ao buscar progresso:", error); }
            },

            fetchUserBookmarks: async () => {
                if (!store.user) return;
                try {
                    const marksSnap = await getDocs(api.getUserBookmarksRef(store.user.uid));
                    store.data.bookmarks = marksSnap.docs.map(doc => doc.id);
                } catch (error) { console.warn("Erro ao buscar favoritos:", error); }
            },

            markPostAsRead: async (postId, isRead) => {
                if (!store.user) return alert("Faça login para salvar seu progresso!");
                try {
                    const docRef = doc(db, 'users', store.user.uid, 'progress', postId);
                    if (isRead) {
                        await setDoc(docRef, { readAt: new Date().toISOString() });
                        if (!store.data.readPosts.includes(postId)) store.data.readPosts.push(postId);
                    } else {
                        await deleteDoc(docRef);
                        store.data.readPosts = store.data.readPosts.filter(id => id !== postId);
                    }
                    app.ui.updateProgressBar();
                } catch (error) { console.error("Erro ao salvar progresso:", error); }
            },

            toggleBookmark: async (postId) => {
                if (!store.user) return alert("Faça login para salvar favoritos!");
                try {
                    const docRef = doc(db, 'users', store.user.uid, 'bookmarks', postId);
                    const isBookmarked = store.data.bookmarks.includes(postId);
                    
                    if (!isBookmarked) {
                        await setDoc(docRef, { savedAt: new Date().toISOString() });
                        store.data.bookmarks.push(postId);
                    } else {
                        await deleteDoc(docRef);
                        store.data.bookmarks = store.data.bookmarks.filter(id => id !== postId);
                    }
                    app.ui.render(); 
                } catch (error) { console.error("Erro ao salvar favorito:", error); }
            },

            seedData: () => {
                store.data.categories = [{ id: '1', name: 'Exemplo', sub: 'Teste' }];
                store.data.posts = [{ id: '1', title: 'Bem-vindo', categoryId: '1', summary: 'Teste', content: 'Teste', date: new Date().toISOString() }];
            },

            saveSetting: async (newSettings) => {
                if (store.data.settingsId) {
                    await updateDoc(doc(db, 'settings', store.data.settingsId), newSettings);
                } else {
                    const ref = await addDoc(api.getCollectionRef('settings'), newSettings);
                    store.data.settingsId = ref.id;
                }
                store.data.settings = newSettings;
                app.ui.updateSiteMeta();
            },

            addItem: async (collectionName, item) => {
                const ref = await addDoc(api.getCollectionRef(collectionName), item);
                store.data[collectionName].push({ ...item, id: ref.id });
                return ref.id;
            },
            
            updateItem: async (collectionName, id, data) => {
                await updateDoc(doc(db, collectionName, id), data);
                const index = store.data[collectionName].findIndex(i => i.id === id);
                if(index !== -1) store.data[collectionName][index] = { ...store.data[collectionName][index], ...data };
            },

            deleteItem: async (collectionName, id) => {
                await deleteDoc(doc(db, collectionName, id));
                store.data[collectionName] = store.data[collectionName].filter(i => i.id !== id);
            }
        };

        // --- UI ---
        const app = {
            init: async () => {
                if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    store.theme = 'dark';
                    document.documentElement.classList.add('dark');
                    document.getElementById('theme-icon').classList.replace('fa-moon', 'fa-sun');
                }

                onAuthStateChanged(auth, async (user) => {
                    store.user = user;
                    store.isAdmin = user && user.email && user.email.includes('@admin.com');
                    app.ui.renderAuth();
                    app.ui.toggleAdminAccess();

                    if(store.isLoading) {
                        api.fetchAll();
                    } else if (user) {
                        await api.fetchUserProgress();
                        await api.fetchUserBookmarks();
                        app.ui.updateProgressBar();
                        app.ui.render(); 
                    }
                });

                const handleSearch = (e) => {
                    if (e.key === 'Enter') app.router.navigate('search', { query: e.target.value });
                };
                document.getElementById('global-search').addEventListener('keypress', handleSearch);
                document.getElementById('mobile-search').addEventListener('keypress', handleSearch);
            },

            router: {
                navigate: (view, params = {}) => {
                    store.currentView = view;
                    store.params = params;
                    
                    if (view !== 'quizzes') {
                        store.quizState.activeCategory = null;
                        store.quizState.activeQuizzes = [];
                    }

                    app.ui.render();
                    window.scrollTo(0,0);
                }
            },

            ui: {
                toggleTheme: () => {
                    const html = document.documentElement;
                    const icon = document.getElementById('theme-icon');
                    if (html.classList.contains('dark')) {
                        html.classList.remove('dark');
                        localStorage.setItem('theme', 'light');
                        icon.classList.replace('fa-sun', 'fa-moon');
                    } else {
                        html.classList.add('dark');
                        localStorage.setItem('theme', 'dark');
                        icon.classList.replace('fa-moon', 'fa-sun');
                    }
                },
                updateSiteMeta: () => {
                    document.getElementById('nav-site-title').textContent = store.data.settings.title;
                    document.getElementById('footer-site-title').textContent = store.data.settings.title;
                    document.title = store.data.settings.title;
                },
                updateProgressBar: () => {
                    const percent = utils.calculateProgress();
                    const bar = document.getElementById('global-progress-bar');
                    if(bar) {
                        bar.style.width = `${percent}%`;
                        if(percent === 100) {
                            bar.classList.remove('from-green-400', 'to-green-600');
                            bar.classList.add('from-yellow-400', 'to-yellow-600');
                        }
                    }
                },
                toggleAdminAccess: () => {
                    document.getElementById('nav-admin-link').classList.toggle('hidden', !store.isAdmin);
                    document.getElementById('mobile-admin-link').classList.toggle('hidden', !store.isAdmin);
                },
                renderAuth: () => {
                    const html = store.user ? `
                        <div class="flex items-center space-x-3">
                            <span class="text-sm font-medium hidden lg:block truncate max-w-[150px]">${store.user.email}</span>
                            <button onclick="app.handlers.logout()" class="text-sm bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-full transition-colors">Sair</button>
                        </div>
                    ` : `
                        <button onclick="app.router.navigate('login')" class="bg-tech-600 hover:bg-tech-700 text-white px-5 py-2 rounded-full text-sm font-medium shadow-lg shadow-tech-500/30 transition-all transform hover:scale-105">Entrar</button>
                    `;
                    document.getElementById('auth-container').innerHTML = html;
                    document.getElementById('mobile-auth-container').innerHTML = html;
                },
                render: () => {
                    const root = document.getElementById('app-root');
                    if (store.isLoading) {
                        root.innerHTML = '<div class="flex justify-center py-20"><div class="loader"></div></div>';
                        return;
                    }
                    root.style.opacity = '0';
                    setTimeout(() => root.style.opacity = '1', 50);

                    switch (store.currentView) {
                        case 'home': root.innerHTML = app.views.home(); break;
                        case 'login': root.innerHTML = app.views.login(); break;
                        case 'categories': root.innerHTML = app.views.categories(); break;
                        case 'category': root.innerHTML = app.views.singleCategory(store.params.id); break;
                        case 'post': root.innerHTML = app.views.post(store.params.id); break;
                        case 'media': root.innerHTML = app.views.media(); break; // Nova View
                        case 'quizzes': root.innerHTML = app.views.quizzes(); break;
                        case 'admin': 
                            if (!store.isAdmin) { app.router.navigate('home'); return; }
                            root.innerHTML = app.views.admin();
                            app.handlers.attachAdminListeners(); 
                            break;
                        case 'search': root.innerHTML = app.views.searchResults(store.params.query); break;
                        default: root.innerHTML = app.views.home();
                    }
                }
            },

            views: {
                home: () => {

            handlers: {
                currentAuthMode: 'login',
                editingPostId: null,
                editingCatId: null,
                editingQuizId: null,
                editingMediaId: null,

                toggleReadStatus: (postId, checked) => {
                    api.markPostAsRead(postId, checked);
                },

                toggleBookmark: (postId) => {
                    api.toggleBookmark(postId);
                },

                setHomeTab: (tab) => {
                    store.homeTab = tab;
                    app.ui.render();
                },

                startQuiz: (category) => {
                    const filtered = store.data.quizzes.filter(q => (q.category || 'Geral') === category);
                    store.quizState.activeQuizzes = utils.shuffleArray([...filtered]);
                    store.quizState.activeCategory = category;
                    store.quizState.currentIndex = 0;
                    
                    if(store.quizState.activeQuizzes.length === 0) {
                        alert("Sem perguntas nesta categoria!");
                        return;
                    }
                    app.ui.render();
                },

                quitQuiz: () => {
                    store.quizState.activeCategory = null;
                    store.quizState.activeQuizzes = [];
                    store.quizState.currentIndex = 0;
                    store.quizState.isFinished = false;
                    app.router.navigate('quizzes');
                },

                answerQuiz: (selectedIdx) => {
                    const currentQuiz = store.quizState.activeQuizzes[store.quizState.currentIndex];
                    const correctIdx = currentQuiz.correct;
                    const feedbackEl = document.getElementById('quiz-feedback');
                    const nextBtn = document.getElementById('btn-next-quiz');
                    const opts = document.querySelectorAll('.quiz-opt-btn');

                    opts.forEach(btn => btn.disabled = true);

                    const explanationText = currentQuiz.explanation 
                        ? `<p class="mt-3 text-sm font-normal opacity-90 border-t border-white/20 pt-3">${currentQuiz.explanation}</p>` 
                        : '';

                    opts[correctIdx].classList.add('bg-green-100', 'border-green-500', 'dark:bg-green-900', 'dark:border-green-500');
                    
                    if (selectedIdx !== correctIdx) {
                        opts[selectedIdx].classList.add('bg-red-100', 'border-red-500', 'dark:bg-red-900', 'dark:border-red-500');
                        feedbackEl.innerHTML = `
                            <div class="text-3xl mb-2"><i class="fa-solid fa-circle-xmark"></i></div>
                            <div class="font-bold text-lg">Incorreto</div>
                            <div class="text-sm">A resposta correta era a opção <span class="font-bold">${String.fromCharCode(65+correctIdx)}</span></div>
                            ${explanationText}
                        `;
                        feedbackEl.classList.add('bg-red-500', 'text-white', 'shadow-lg', 'shadow-red-500/30');
                        feedbackEl.classList.remove('bg-green-500', 'shadow-green-500/30'); 
                    } else {
                        feedbackEl.innerHTML = `
                            <div class="text-3xl mb-2"><i class="fa-solid fa-circle-check"></i></div>
                            <div class="font-bold text-lg">Correto!</div>
                            ${explanationText}
                        `;
                        feedbackEl.classList.add('bg-green-500', 'text-white', 'shadow-lg', 'shadow-green-500/30');
                        feedbackEl.classList.remove('bg-red-500', 'shadow-red-500/30');
                    }

                    feedbackEl.classList.remove('hidden');
                    nextBtn.classList.remove('hidden');
                },

                nextQuiz: () => {
                    store.quizState.currentIndex++;
                    if (store.quizState.currentIndex >= store.quizState.activeQuizzes.length) {
                        if(confirm("Parabéns! Você completou todas as perguntas. Quer jogar novamente?")) {
                            store.quizState.activeQuizzes = utils.shuffleArray(store.quizState.activeQuizzes);
                            store.quizState.currentIndex = 0;
                        } else {
                            app.router.navigate('quizzes'); 
                            return;
                        }
                    }
                    app.ui.render();
                },

                switchAuthTab: (mode) => {
                    app.handlers.currentAuthMode = mode;
                    document.getElementById('tab-login').classList.toggle('border-b-2', mode === 'login');
                    document.getElementById('tab-login').classList.toggle('text-tech-600', mode === 'login');
                    
                    document.getElementById('tab-register').classList.toggle('border-b-2', mode === 'register');
                    document.getElementById('tab-register').classList.toggle('text-tech-600', mode === 'register');
                    
                    document.getElementById('auth-btn').textContent = mode === 'login' ? 'Entrar' : 'Registrar Conta';
                    document.getElementById('auth-error').classList.add('hidden');
                },

                submitAuth: async () => {
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    const errorEl = document.getElementById('auth-error');
                    const btn = document.getElementById('auth-btn');
                    
                    btn.disabled = true;
                    btn.textContent = 'Aguarde...';
                    errorEl.classList.add('hidden');

                    try {
                        if (app.handlers.currentAuthMode === 'login') {
                            await signInWithEmailAndPassword(auth, email, password);
                        } else {
                            await createUserWithEmailAndPassword(auth, email, password);
                        }
                        app.router.navigate('home');
                    } catch (error) {
                        errorEl.textContent = "Erro: " + error.message;
                        errorEl.classList.remove('hidden');
                    } finally {
                        btn.disabled = false;
                        btn.textContent = app.handlers.currentAuthMode === 'login' ? 'Entrar' : 'Registrar Conta';
                    }
                },

                logout: async () => {
                    await signOut(auth);
                    store.user = null;
                    store.isAdmin = false;
                    store.data.readPosts = []; 
                    app.ui.updateProgressBar();
                    app.router.navigate('home');
                },

                switchAdminTab: (tabId) => {
                    document.querySelectorAll('.admin-content').forEach(el => el.classList.add('hidden'));
                    document.getElementById(`admin-${tabId}`).classList.remove('hidden');
                    document.querySelectorAll('.admin-tab-btn').forEach(el => el.classList.remove('bg-tech-100', 'dark:bg-slate-700', 'font-bold'));
                    document.querySelector(`button[data-tab="${tabId}"]`).classList.add('bg-tech-100', 'dark:bg-slate-700', 'font-bold');
                },

                saveSettings: async () => {
                    try {
                        const newSettings = {
                            title: document.getElementById('site-title-input').value,
                            welcome: document.getElementById('site-welcome-input').value
                        };
                        await api.saveSetting(newSettings);
                        alert('Sucesso! Configurações salvas.');
                    } catch (error) {
                        alert("Erro ao salvar: " + error.message + "\n\nVerifique as Regras do Firestore!");
                    }
                },

                prepareEdit: (type, id) => {
                    if (type === 'posts') {
                        const post = store.data.posts.find(p => p.id === id);
                        if(post) {
                            document.getElementById('new-post-title').value = post.title;
                            document.getElementById('new-post-cat').value = post.categoryId;
                            document.getElementById('new-post-summary').value = post.summary || '';
                            document.getElementById('new-post-content').value = post.content;
                            
                            app.handlers.editingPostId = id;
                            const btn = document.getElementById('btn-save-post');
                            btn.textContent = 'Atualizar Post';
                            btn.classList.replace('bg-tech-600', 'bg-amber-600');
                            btn.classList.replace('hover:bg-tech-700', 'hover:bg-amber-700');
                            
                            document.getElementById('btn-cancel-post').classList.remove('hidden');
                            window.scrollTo(0, 0);
                        }
                    } else if (type === 'cats') {
                        const cat = store.data.categories.find(c => c.id === id);
                        if(cat) {
                            document.getElementById('new-cat-name').value = cat.name;
                            document.getElementById('new-cat-sub').value = cat.sub;
                            
                            app.handlers.editingCatId = id;
                            const btn = document.getElementById('btn-save-cat');
                            btn.textContent = 'Atualizar';
                            btn.classList.replace('bg-tech-600', 'bg-amber-600');
                            btn.classList.replace('hover:bg-tech-700', 'hover:bg-amber-700');
                            
                            document.getElementById('btn-cancel-cat').classList.remove('hidden');
                        }
                    } else if (type === 'quizzes') {
                        const quiz = store.data.quizzes.find(q => q.id === id);
                        if(quiz) {
                            document.getElementById('new-quiz-cat').value = quiz.category || '';
                            document.getElementById('new-quiz-q').value = quiz.question;
                            
                            const optInputs = document.querySelectorAll('.quiz-opt-input');
                            quiz.options.forEach((opt, idx) => {
                                if(optInputs[idx]) optInputs[idx].value = opt;
                            });

                            document.getElementById('new-quiz-correct').value = quiz.correct;
                            document.getElementById('new-quiz-explanation').value = quiz.explanation || '';
                            
                            app.handlers.editingQuizId = id;
                            const btn = document.getElementById('btn-save-quiz');
                            btn.textContent = 'Atualizar Quiz';
                            btn.classList.replace('bg-tech-600', 'bg-amber-600');
                            btn.classList.replace('hover:bg-tech-700', 'hover:bg-amber-700');
                            
                            document.getElementById('btn-cancel-quiz').classList.remove('hidden');

                    } else if (type === 'media') {
                        const media = store.data.media.find(m => m.id === id);
                        if(media) {
                            document.getElementById('new-media-title').value = media.title;
                            document.getElementById('new-media-type').value = media.type;
                            document.getElementById('new-media-cat').value = media.category || '';
                            document.getElementById('new-media-url').value = media.url;
                            document.getElementById('new-media-desc').value = media.description || '';
                            
                            app.handlers.editingMediaId = id;
                            const btn = document.getElementById('btn-save-media');
                            btn.textContent = 'Atualizar Mídia';
                            btn.classList.replace('bg-tech-600', 'bg-amber-600');
                            btn.classList.replace('hover:bg-tech-700', 'hover:bg-amber-700');
                            document.getElementById('btn-cancel-media').classList.remove('hidden');
                        }
                    }

                    if (type === 'posts') {

                        document.getElementById('new-post-title').value = '';
                        document.getElementById('new-post-summary').value = '';

                        const btn = document.getElementById('btn-save-post');

                        document.getElementById('new-cat-name').value = '';
                        document.getElementById('new-cat-sub').value = '';
                        
                        const btn = document.getElementById('btn-save-cat');
                        btn.textContent = 'Add';
                        btn.classList.replace('bg-amber-600', 'bg-tech-600');
                        btn.classList.replace('hover:bg-amber-700', 'hover:bg-tech-700');
                        document.getElementById('btn-cancel-cat').classList.add('hidden');
                    } else if (type === 'quizzes') {
                        app.handlers.editingQuizId = null;
                        document.getElementById('new-quiz-cat').value = '';
                        document.getElementById('new-quiz-q').value = '';
                        document.querySelectorAll('.quiz-opt-input').forEach(i => i.value = '');
                        document.getElementById('new-quiz-correct').value = '0';

                        document.getElementById('new-media-cat').value = '';
                        document.getElementById('new-media-url').value = '';
                        document.getElementById('new-media-desc').value = '';
                        
                        const btn = document.getElementById('btn-save-media');

                    }

                addCategory: async () => {
                    try {
                        const name = document.getElementById('new-cat-name').value;
                        const sub = document.getElementById('new-cat-sub').value;
                        
                        if (app.handlers.editingCatId) {
                            await api.updateItem('categories', app.handlers.editingCatId, { name, sub });
                            app.handlers.cancelEdit('cats');
                        } else {
                            await api.addItem('categories', { name, sub });
                        }
                        
                        app.ui.render();
                        app.handlers.switchAdminTab('cats');
                    } catch (error) { alert("Erro ao salvar: " + error.message); }
                },

                    try {
                        const title = document.getElementById('new-post-title').value;
                        const categoryId = document.getElementById('new-post-cat').value;
                        const summary = document.getElementById('new-post-summary').value;
                        const content = document.getElementById('new-post-content').value;
                        
                        if (app.handlers.editingPostId) {
                            await api.updateItem('posts', app.handlers.editingPostId, { 
                                title, categoryId, summary, content

                            app.handlers.cancelEdit('posts');
                        } else {
                            await api.addItem('posts', { 
                                title, categoryId, summary, content, date: new Date().toISOString() 
                            });
                        }
                        
                        app.ui.render();
                        app.handlers.switchAdminTab('posts');
                    } catch (error) { alert("Erro ao salvar post: " + error.message); }
                },

                addQuiz: async () => {
                    try {
                        const category = document.getElementById('new-quiz-cat').value;
                        const q = document.getElementById('new-quiz-q').value;
                        const options = Array.from(document.querySelectorAll('.quiz-opt-input')).map(i => i.value);
                        const correct = parseInt(document.getElementById('new-quiz-correct').value);
                        const explanation = document.getElementById('new-quiz-explanation').value;
                        
                        if (app.handlers.editingQuizId) {
                             await api.updateItem('quizzes', app.handlers.editingQuizId, { category, question: q, options, correct, explanation });
                             app.handlers.cancelEdit('quizzes');
                        } else {
                             await api.addItem('quizzes', { category, question: q, options, correct, explanation });
                        }

                        app.ui.render();
                        app.handlers.switchAdminTab('quizzes');
                    } catch (error) { alert("Erro ao adicionar quiz: " + error.message); }
                },

                addMedia: async () => {
                    try {
                        const title = document.getElementById('new-media-title').value;
                        const type = document.getElementById('new-media-type').value;
                        const category = document.getElementById('new-media-cat').value;
                        const url = document.getElementById('new-media-url').value;
                        const description = document.getElementById('new-media-desc').value;
                        
                        if (app.handlers.editingMediaId) {
                            await api.updateItem('media', app.handlers.editingMediaId, { 
                                title, type, category, url, description 
                            });
                            app.handlers.cancelEdit('media');
                        } else {
                            await api.addItem('media', { 
                                title, type, category, url, description, date: new Date().toISOString() 
                            });
                        }
                        
                        app.ui.render();
                        app.handlers.switchAdminTab('media');
                    } catch (error) { alert("Erro ao salvar mídia: " + error.message); }
                },

                deleteItem: async (col, id) => {
                    if(confirm('Tem certeza?')) {
                        try {
                            await api.deleteItem(col, id);
                            app.ui.render();
                            const tabs = { 'categories': 'cats', 'posts': 'posts', 'quizzes': 'quizzes', 'media': 'media' };
                            app.handlers.switchAdminTab(tabs[col]);
                        } catch (error) { alert("Erro ao deletar: " + error.message); }
                    }
                },

                attachAdminListeners: () => { /* Eventos inline para simplicidade */ }
            }
        };

        window.app = app;
        app.init();
    </script>
</body>
</html>
